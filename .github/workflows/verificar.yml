# Revisa cada cambio antes de que llegue a main: sintaxis, pruebas y contraste de colores.
# No necesita ningún secreto, así que también corre en pull requests de otras personas.
name: Verificar

on:
  push:
    branches-ignore: [main]   # main se verifica dentro del flujo de despliegue
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxis, pruebas y contraste
        run: npm run verificar
