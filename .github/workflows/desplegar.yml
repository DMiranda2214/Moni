# Despliegue automático: cada cambio que entra a main se verifica, pasa a DESARROLLO y, después de que alguien
# lo apruebe, a PRODUCCIÓN. Nadie copia ni pega código, ni descarga nada.
#
# Hace falta configurar (ver docs/DESPLIEGUE_CI.md), en Settings → Environments, DOS entornos:
#   desarrollo   secreto CLASPRC_JSON  ·  variables SCRIPT_ID y DEPLOYMENT_ID
#   produccion   lo mismo, con otro proyecto de Apps Script y "Required reviewers" (aprobación manual)
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:   # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read

# Un despliegue a la vez; uno en curso nunca se corta a la mitad.
concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verificar

  desarrollo:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desarrollo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Subir y publicar en desarrollo
        env:
          ENTORNO: desarrollo
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          DESCRIPCION: ${{ github.sha }}
        run: ./.github/scripts/desplegar.sh

  produccion:
    needs: desarrollo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion   # aquí se configura la aprobación manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Subir y publicar en producción
        env:
          ENTORNO: produccion
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          DESCRIPCION: ${{ github.sha }}
        run: ./.github/scripts/desplegar.sh
