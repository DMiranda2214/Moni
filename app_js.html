<script>
'use strict';
/* ==========================================================================
   Moni — aplicación (Fase 1): inicio, bolsillos, tarjetas y Ajustes con todos los catálogos.
   Sin librerías. Cada pantalla es una función que devuelve su HTML; los eventos se delegan
   con atributos data-acc. Todo texto dinámico pasa por esc().
   ========================================================================== */

// <ACENTOS>
const ACENTOS = {
  rosa:    { nombre: 'Rosa',    claro: '#CC2B65', oscuro: '#FF7A9E' },
  azul:    { nombre: 'Azul',    claro: '#0B63CE', oscuro: '#64A8FF' },
  verde:   { nombre: 'Verde',   claro: '#17744A', oscuro: '#4CD08A' },
  morado:  { nombre: 'Morado',  claro: '#7B3FCB', oscuro: '#B794F6' },
  naranja: { nombre: 'Naranja', claro: '#A4510A', oscuro: '#FFA05A' },
  grafito: { nombre: 'Grafito', claro: '#3A3A3C', oscuro: '#E5E5EA' }
};
// </ACENTOS>

/** Las cuatro áreas de la app. Cada una abre su pantalla de entrada (`ruta`). */
const TABS = [
  { id: 'inicio', etiqueta: 'Inicio', icono: 'inicio', ruta: 'inicio' },
  { id: 'dinero', etiqueta: 'Dinero', icono: 'bolsillos', ruta: 'bolsillos' },
  { id: 'planear', etiqueta: 'Planear', icono: 'calendario', ruta: 'planear' },
  { id: 'deudas', etiqueta: 'Deudas', icono: 'tarjetas', ruta: 'tarjetas' }
];

/** Cada pantalla principal pertenece a un área: el área marca la pestaña (o el grupo de la barra lateral) activa. */
const AREA_DE_RUTA = {
  inicio: 'inicio', bolsillos: 'dinero', movimientos: 'dinero', ahorro: 'dinero', cdt: 'dinero',
  planear: 'planear', presupuesto: 'planear', nomina: 'planear', ingresos: 'planear', pagos: 'planear', regalos: 'planear', anual: 'planear', analisis: 'planear',
  tarjetas: 'deudas', ajustes: 'ajustes', guia: 'ajustes'
};

/** Grupos de la barra lateral y pestañas internas de Dinero: [ruta, etiqueta, ícono]. */
const GRUPOS_NAV = [
  { area: 'dinero', titulo: 'Dinero', items: [['bolsillos', 'Bolsillos', 'bolsillos'], ['movimientos', 'Movimientos', 'presupuesto'], ['ahorro', 'Ahorro', 'escudo'], ['cdt', 'CDT', 'capas']] },
  { area: 'planear', titulo: 'Planear', items: [['presupuesto', 'Presupuesto', 'presupuesto'], ['nomina', 'Nómina', 'usuario'], ['ingresos', 'Otros ingresos', 'usuario'], ['pagos', 'Servicios y suscripciones', 'tarjetas'], ['regalos', 'Regalos', 'regalo'], ['anual', 'Vista anual', 'calendario'], ['analisis', 'Análisis', 'pulso']] },
  { area: 'deudas', titulo: 'Deudas', items: [['tarjetas', 'Tarjetas y créditos', 'tarjetas']] }
];
const TITULOS_BASE = { inicio: 'Inicio', bolsillos: 'Bolsillos', presupuesto: 'Presupuesto', tarjetas: 'Deudas', planear: 'Planear' };

const ETIQUETAS = {
  TipoCuenta: { Billetera: 'Billetera', Debito: 'Débito', Ahorro: 'Ahorro', Otra: 'Otra' },
  RolBolsillo: { Operativo: 'Operativo', Fondo: 'Fondo', Reserva_Tarjeta: 'Reserva de tarjeta', General: 'General' },
  RolPersona: { Titular: 'Titular', Familiar: 'Familiar', Otro: 'Otro' },
  TipoCategoria: { Gasto: 'Gasto', Ingreso: 'Ingreso', Transferencia: 'Transferencia', Ajuste: 'Ajuste' },
  PeriodoCobro: { Mensual: 'Cada mes', Bimestral: 'Cada 2 meses', Trimestral: 'Cada 3 meses', Semestral: 'Cada 6 meses', Anual: 'Cada año' },
  Tema: { Automatico: 'Automático', Claro: 'Claro', Oscuro: 'Oscuro' }
};

const App = { boot: null, pila: ['inicio'], inactivos: {}, error: null };

// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------

function esc(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function ico(nombre, extra) {
  return '<svg class="m-icon ' + (extra || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + nombre + '"/></svg>';
}

const _formatos = {};
/** Monto con su moneda: sin decimales en pesos, con dos en las demás. Sin `divisa`, la moneda base de la app. */
function dinero(n, divisa) {
  const d = divisa || (App.boot && App.boot.config && App.boot.config.Moneda) || 'COP';
  const v = Number(n) || 0;
  // En pesos no se muestran centavos... salvo cuando el valor los tiene (un rendimiento, un saldo del banco): así lo que se ve
  // es lo que se guardó y las sumas cuadran. Las demás monedas siempre llevan dos decimales.
  const conCentavos = d !== 'COP' || Math.abs(v - Math.round(v)) >= 0.005;
  const llave = d + (conCentavos ? '2' : '0');
  if (!_formatos[llave]) {
    const dec = conCentavos ? 2 : 0;
    _formatos[llave] = new Intl.NumberFormat('es-CO', { style: 'currency', currency: d, minimumFractionDigits: dec, maximumFractionDigits: dec });
  }
  return _formatos[llave].format(v).replace(/ /g, ' ');
}

/** Convierte lo que se escribe ("1.250.000,50") a número, con la convención de es-CO. */
/** Una tasa de cambio en pesos, con decimales: $ 4.012,5 */
const tasaPesos = n => '$ ' + new Intl.NumberFormat('es-CO', { maximumFractionDigits: 2 }).format(n);

function leerDinero(texto) {
  const t = String(texto || '').replace(/[^\d,.\-]/g, '');
  if (t === '' || t === '-') return '';
  const n = Number(t.replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? n : NaN;
}

function claseSaldo(n) { return Number(n) < 0 ? 'm-negativo' : ''; }
const etiqueta = (grupo, v) => (ETIQUETAS[grupo] && ETIQUETAS[grupo][v]) || v || '';
const $ = (sel, raiz) => (raiz || document).querySelector(sel);
const $$ = (sel, raiz) => Array.prototype.slice.call((raiz || document).querySelectorAll(sel));

let _pendientes = 0;
let _temporizadorProgreso = null;
/** Barra fina arriba: aparece solo si una petición tarda más de 400 ms. */
function progreso(delta) {
  _pendientes = Math.max(0, _pendientes + delta);
  const barra = $('#progreso');
  if (!barra) return;
  if (_pendientes > 0) {
    if (!_temporizadorProgreso) _temporizadorProgreso = setTimeout(() => { barra.classList.add('m-activo'); barra.setAttribute('aria-hidden', 'false'); }, 400);
  } else {
    clearTimeout(_temporizadorProgreso); _temporizadorProgreso = null;
    barra.classList.remove('m-activo'); barra.setAttribute('aria-hidden', 'true');
  }
}

/** Mensajes técnicos de Google o de la red, dichos en claro. El detalle original queda en consola. */
function mensajeLlano(e) {
  const crudo = (e && e.message) || String(e || '');
  if (!navigator.onLine || /failed to fetch|networkerror|network error|load failed/i.test(crudo)) return 'Parece que no hay conexión. Revisa tu internet y vuelve a intentarlo.';
  if (/not authorized|authorization|sign in|login|permission|accounts\.google/i.test(crudo)) return 'Tu sesión de Google venció. Recarga la página para volver a entrar.';
  if (/lock|bloqueo|another process|timed out waiting/i.test(crudo)) return 'Moni está guardando otro cambio. Espera un momento y reintenta.';
  if (/exceeded maximum execution time|tardó demasiado|time limit/i.test(crudo)) return 'La operación tardó demasiado. Reintenta; si se repite, usa Respaldos y avisa.';
  if (/service invoked too many times|quota/i.test(crudo)) return 'Google pidió una pausa por exceso de uso. Espera unos minutos.';
  return crudo || 'Ocurrió un error.';
}

/** Tiempos de las últimas llamadas (cliente = lo que ve el usuario; servidor = lo que tardó Apps Script). */
const TIEMPOS = [];
function anotarTiempo(fn, t0, ms, ok) {
  TIEMPOS.push({ fn: fn, cliente: Math.round(performance.now() - t0), servidor: typeof ms === 'number' ? ms : null, ok: ok });
  if (TIEMPOS.length > 100) TIEMPOS.shift();
}

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new Error('Esta pantalla debe abrirse desde la aplicación publicada.'));
      return;
    }
    progreso(1);
    const t0 = performance.now();
    // Si Google no responde en 45 s, se avisa en vez de dejar la pantalla "pensando" para siempre.
    let terminada = false;
    const reloj = setTimeout(() => {
      if (terminada) return;
      terminada = true; progreso(-1); anotarTiempo(fn, t0, null, false);
      reject(new Error('Está tardando demasiado en responder. Reintenta; si se repite, revisa tu conexión.'));
    }, 45000);
    google.script.run
      .withSuccessHandler(r => {
        if (terminada) return;
        terminada = true; clearTimeout(reloj);
        progreso(-1); anotarTiempo(fn, t0, r && r.ms, !!(r && r.ok));
        (r && r.ok) ? resolve(r.data) : reject(new Error((r && r.error && r.error.message) || 'Ocurrió un error.'));
      })
      .withFailureHandler(e => {
        if (terminada) return;
        terminada = true; clearTimeout(reloj);
        progreso(-1); anotarTiempo(fn, t0, null, false);
        if (window.console) console.warn('Fallo de ' + fn + ':', e);
        reject(new Error(mensajeLlano(e)));
      })
      [fn].apply(google.script.run, args);
  });
}

/**
 * Errores del navegador al registro del servidor (Ajustes → Registro de errores), con tope por sesión
 * para que un fallo repetido no inunde el registro.
 */
let _erroresReportados = 0;
function reportarErrorCliente(mensaje, detalle) {
  if (_erroresReportados >= 5) return;
  _erroresReportados++;
  try { api('logClientError', String(mensaje).slice(0, 400), String(detalle || '').slice(0, 1800)).catch(() => {}); } catch (e) {}
}
window.addEventListener('error', ev => reportarErrorCliente(ev.message, (ev.filename || '') + ':' + ev.lineno + ':' + ev.colno + '\n' + ((ev.error && ev.error.stack) || '')));
window.addEventListener('unhandledrejection', ev => {
  const r = ev.reason;
  reportarErrorCliente('Promesa rechazada: ' + ((r && r.message) || r), (r && r.stack) || '');
});

/**
 * Aviso breve. `opc` puede ser `true` (error) o { error, deshacer }.
 * Con `deshacer` (una función) el aviso ofrece "Deshacer" durante 8 segundos.
 */
function aviso(mensaje, opc) {
  const o = (opc && typeof opc === 'object') ? opc : { error: !!opc };
  const caja = $('#avisos');
  const el = document.createElement('div');
  el.className = 'm-aviso' + (o.error ? ' m-error' : '');
  const txt = document.createElement('span');
  txt.textContent = mensaje;
  el.appendChild(txt);
  if (o.deshacer) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'm-aviso-accion'; b.textContent = 'Deshacer';
    b.addEventListener('click', () => { el.remove(); o.deshacer(); });
    el.appendChild(b);
  }
  if (o.error) {
    el.setAttribute('role', 'alert');
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'm-aviso-accion'; x.textContent = 'Cerrar';
    x.addEventListener('click', () => el.remove());
    el.appendChild(x);
  }
  caja.appendChild(el);
  // Más texto, más tiempo para leerlo (unos 60 ms por carácter, con mínimo y máximo).
  const lectura = Math.min(12000, Math.max(o.error ? 6000 : 3000, mensaje.length * 60));
  setTimeout(() => el.remove(), o.deshacer ? Math.max(8000, lectura) : lectura);
}

/**
 * Una escritura completa: llama al servidor, aplica lo que cambió, repinta y avisa (con "Deshacer" si se da).
 * Reemplaza el mismo try/catch que se repetía en cada "anular…" y "restaurar…".
 * @param {string} fn función del servidor
 * @param {Array} args sus argumentos
 * @param {Object} o { mensaje, aplicar: [fn(res)], deshacer: fn }
 */
// ---------------------------------------------------------------------------
// Cargos de una operación (comisiones, impuestos, cambio de divisa, cuota de manejo, seguros)
// Moni los PROPONE según las reglas de Ajustes → Cargos y comisiones; la persona los cambia, quita o agrega.
// ---------------------------------------------------------------------------

/** Bloque de cargos para un formulario. `solo`: tipos de registro en que se muestra (como los demás data-solo). */
function htmlCargos(solo) {
  return '<div class="m-campo m-cargos" data-cargos' + (solo ? ' data-solo="' + solo + '"' : '') + '>' +
    '<details class="m-nom-mas" data-cargos-det><summary>Comisiones e impuestos <span class="m-cargos-resumen" data-cargos-resumen></span></summary>' +
    '<p class="m-ayuda">Lo que te cobra el banco o la tarjeta por esta operación. Se registra aparte, como gasto en “Comisiones e impuestos”, y se anula si anulas la operación.</p>' +
    '<div data-cargos-lista></div>' +
    '<button type="button" class="m-btn-texto" data-cargos-agregar>' + ico('plus') + ' Agregar un cargo</button>' +
    '<p class="m-ayuda" data-cargos-total aria-live="polite"></p></details></div>';
}

function htmlFilaCargo(c) {
  return '<div class="m-cargo-fila" data-tipo="' + esc(c.tipo || 'Comision') + '">' +
    '<input class="m-input" data-cargo-nombre aria-label="Nombre del cargo" maxlength="80" value="' + esc(c.nombre || '') + '" placeholder="Comisión, 4x1000, seguro…">' +
    '<input class="m-input m-num" data-cargo-valor aria-label="Valor del cargo" inputmode="decimal" value="' + esc(c.valor ? String(c.valor).replace('.', ',') : '') + '" placeholder="0">' +
    '<button type="button" class="m-btn-texto" data-cargo-quitar aria-label="Quitar este cargo">✕</button></div>';
}

/** Los cargos que quedaron en el formulario: [{ nombre, tipo, valor }] (sin los vacíos). */
function leerCargos(raiz) {
  return $$('[data-cargos] .m-cargo-fila', raiz).map(f => {
    const v = leerDinero($('[data-cargo-valor]', f).value);
    return { nombre: $('[data-cargo-nombre]', f).value.trim(), tipo: f.dataset.tipo || 'Comision', valor: typeof v === 'number' && !isNaN(v) ? v : 0 };
  }).filter(c => c.valor > 0);
}

/**
 * Pide al servidor los cargos sugeridos cada vez que cambia la operación (medio de pago, valor…) y los pinta.
 * Cuando la persona toca un cargo, ya no se reemplazan: lo que escribió manda.
 * @param {Function} contexto () => ({ operacion, ctx: { idBolsillo, idTarjeta, idCredito, valor } }) o null si no aplica
 */
function activarCargos(raiz, contexto) {
  const caja = $('[data-cargos]', raiz);
  if (!caja) return { pedir: () => {} };
  const lista = $('[data-cargos-lista]', caja), det = $('[data-cargos-det]', caja);
  let tocado = false, temporizador = null, pedido = 0;
  const resumir = () => {
    const cs = leerCargos(raiz), total = cs.reduce((a, c) => a + c.valor, 0);
    const c = contexto(), base = c && c.ctx ? Number(c.ctx.valor) || 0 : 0;
    $('[data-cargos-resumen]', caja).textContent = cs.length ? '· ' + cs.length + ' · ' + dinero(total) : '';
    $('[data-cargos-total]', caja).textContent = cs.length && base ? 'Total con cargos: ' + dinero(base + total) : '';
  };
  const pintar = cargos => { lista.innerHTML = cargos.map(htmlFilaCargo).join(''); resumir(); };
  const pedir = () => {
    if (tocado) { resumir(); return; }
    clearTimeout(temporizador);
    temporizador = setTimeout(async () => {
      const c = contexto();
      // Sin reglas no hay nada que sugerir (y no se molesta al servidor), salvo los seguros fijos de un crédito
      if (!c || (!activos('Cargos_Reglas').length && !c.ctx.idCredito)) { if (!tocado) pintar([]); return; }
      const n = ++pedido;
      try {
        const s = await api('getCargosSugeridos', c.operacion, c.ctx);
        if (n !== pedido || tocado) return;
        pintar(s);
        if (s.length) det.open = true;
      } catch (e) { /* sin sugerencias: la persona puede agregarlos a mano */ }
    }, 350);
  };
  caja.addEventListener('input', () => { tocado = true; resumir(); });
  caja.addEventListener('click', ev => {
    const q = ev.target.closest('[data-cargo-quitar]');
    if (q) { tocado = true; q.closest('.m-cargo-fila').remove(); resumir(); return; }
    if (ev.target.closest('[data-cargos-agregar]')) {
      tocado = true;
      lista.insertAdjacentHTML('beforeend', htmlFilaCargo({}));
      const ult = lista.lastElementChild; if (ult) $('[data-cargo-nombre]', ult).focus();
      resumir();
    }
  });
  const fuera = ev => { if (!ev.target.closest('[data-cargos]')) pedir(); };
  raiz.addEventListener('input', fuera);
  raiz.addEventListener('change', fuera);
  pedir();
  return { pedir: pedir };
}

/** Cuándo se cobra un cargo, en palabras. */
const OPERACION_CARGO = {
  Salida: 'En toda salida de dinero de la cuenta', Transferencia: 'Al pasar dinero a otra cuenta', Pago: 'En gastos y pagos',
  Conversion: 'Al convertir divisas', Apertura_CDT: 'Al abrir un CDT', Compra: 'En cada compra con la tarjeta',
  Compra_Internacional: 'En compras en otra moneda', Extracto: 'En cada extracto (mensual)', Cuota: 'En cada cuota del crédito'
};

/** Medios de pago a los que se les puede poner una regla de cargo: [['Ambito|ID', 'Tipo · Nombre']]. */
function opcionesMedioCargo() {
  const lista = [];
  activos('Bancos').forEach(b => lista.push(['Banco|' + b.ID_Banco, 'Banco · ' + b.Nombre]));
  activos('Cuentas').forEach(c => lista.push(['Cuenta|' + c.ID_Cuenta, 'Cuenta · ' + c.Nombre]));
  activos('Tarjetas').forEach(t => lista.push(['Tarjeta|' + t.ID_Tarjeta, 'Tarjeta · ' + t.Nombre]));
  ((App.boot && App.boot.creditos) || []).forEach(c => lista.push(['Credito|' + c.ID_Credito, 'Crédito · ' + c.Nombre]));
  return lista;
}

function nombreMedioCargo(r) {
  const o = opcionesMedioCargo().find(x => x[0] === r.Ambito + '|' + r.ID_Ambito);
  return o ? o[1] : r.Ambito;
}

/** 0,004 → "0,4 %" (con los decimales que tenga). */
function pctDecimal(n) { return (Math.round((Number(n) || 0) * 100000) / 1000).toLocaleString('es-CO') + ' %'; }

/**
 * Carga los datos de una pantalla en su estado { data, cargando, error } y repinta si la persona sigue en esa ruta.
 * Con `valido`, una respuesta que llega vieja (la persona cambió de mes o de elemento mientras tanto) se descarta.
 * `alCargar(data)` hace lo propio de cada pantalla con los datos nuevos. Todas las pantallas cargan así.
 */
async function cargarEn(st, ruta, fn, args, valido, alCargar) {
  st.cargando = true; st.error = null;
  try {
    const data = await api.apply(null, [fn].concat(args || []));
    if (valido && !valido()) { st.cargando = false; render(); return; } // respuesta vieja: se descarta y se pide la actual
    st.data = data;
    if (alCargar) alCargar(data);
  } catch (e) { st.error = e.message; }
  st.cargando = false;
  if (rutaActual() === ruta) render();
}

async function escribirYAvisar(fn, args, o) {
  try {
    const res = await api.apply(null, [fn].concat(args || []));
    aplicarEscritura(res);
    (o.aplicar || []).forEach(a => a(res));
    render();
    aviso(o.mensaje, o.deshacer ? { deshacer: o.deshacer } : undefined);
    return res;
  } catch (e) { aviso(e.message, true); return null; }
}

// ---------------------------------------------------------------------------
// Apariencia (tema y color de acento)
// ---------------------------------------------------------------------------

function aplicarApariencia() {
  const cfg = (App.boot && App.boot.config) || {};
  const tema = cfg.Tema || 'Automatico';
  const raiz = document.documentElement;
  raiz.removeAttribute('data-theme');
  if (tema === 'Claro') raiz.setAttribute('data-theme', 'light');
  if (tema === 'Oscuro') raiz.setAttribute('data-theme', 'dark');

  const oscuro = tema === 'Oscuro' || (tema === 'Automatico' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const acento = ACENTOS[cfg.Color_Acento] || ACENTOS.rosa;
  const hex = oscuro ? acento.oscuro : acento.claro;
  const n = parseInt(hex.slice(1), 16);
  const rgb = ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
  raiz.style.setProperty('--m-tint', hex);
  raiz.style.setProperty('--m-on-tint', oscuro ? '#1C1C1E' : '#FFFFFF');
  raiz.style.setProperty('--m-tint-soft', 'rgba(' + rgb + ', ' + (oscuro ? 0.16 : 0.10) + ')');
}
if (window.matchMedia) {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarApariencia);
}

// ---------------------------------------------------------------------------
// Campos de fecha en AAAA/MM/DD
// ---------------------------------------------------------------------------

function esFechaReal(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const d = new Date(iso + 'T00:00:00Z');
  return !isNaN(d.getTime()) && d.toISOString().slice(0, 10) === iso;
}

/**
 * Convierte cada campo de fecha del navegador en un campo de texto AAAA/MM/DD (con botón de calendario). El campo original
 * queda oculto y conserva su valor: el resto del código lo sigue leyendo igual (AAAA-MM-DD, o lo escrito si está incompleto,
 * para que el servidor avise en vez de usar otra fecha).
 */
function mejorarCamposFecha(raiz) {
  $$('input[type="date"]:not([data-mejorado])', raiz || document).forEach(orig => {
    orig.dataset.mejorado = '1';
    const natural = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    let incompleto = '';
    const caja = document.createElement('div');
    caja.className = 'm-fecha-campo';
    const txt = document.createElement('input');
    txt.type = 'text'; txt.className = orig.className; txt.inputMode = 'numeric'; txt.maxLength = 10; txt.autocomplete = 'off';
    txt.placeholder = 'AAAA/MM/DD'; txt.id = orig.id ? orig.id + '-txt' : '';
    // El calendario se abre al tocar el ícono: el campo de fecha nativo (transparente) va encima de él. showPicker() no sirve
    // aquí porque la app corre dentro de un iframe de Apps Script y el navegador lo bloquea.
    const boton = document.createElement('span');
    boton.className = 'm-fecha-boton';
    boton.innerHTML = ico('calendario', 'm-icon-sm');
    orig.parentNode.insertBefore(caja, orig);
    caja.appendChild(txt); caja.appendChild(boton); boton.appendChild(orig);
    orig.classList.add('m-fecha-nativo'); orig.setAttribute('aria-label', 'Elegir en el calendario');
    if (orig.id) { const lb = document.querySelector('label[for="' + orig.id + '"]'); if (lb) lb.setAttribute('for', txt.id); }

    const mostrar = () => { txt.value = natural.get.call(orig) ? fechaTxt(natural.get.call(orig)) : incompleto; };
    Object.defineProperty(orig, 'value', {
      configurable: true,
      get() { return incompleto || natural.get.call(orig); },
      set(v) { incompleto = ''; natural.set.call(orig, v); mostrar(); }
    });
    mostrar();

    txt.addEventListener('input', () => {
      const d = txt.value.replace(/\D/g, '').slice(0, 8);
      let f = d;
      if (d.length > 4) f = d.slice(0, 4) + '/' + d.slice(4);
      if (d.length > 6) f = d.slice(0, 4) + '/' + d.slice(4, 6) + '/' + d.slice(6);
      txt.value = f;
      const iso = d.length === 8 ? d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6) : '';
      const valida = iso && esFechaReal(iso) && (!orig.max || iso <= orig.max) && (!orig.min || iso >= orig.min);
      txt.classList.toggle('m-invalido', d.length === 8 && !valida);
      if (valida) { incompleto = ''; natural.set.call(orig, iso); }
      else { natural.set.call(orig, ''); incompleto = f; }
      orig.dispatchEvent(new Event('change', { bubbles: true }));
    });
    // Elegida en el calendario nativo
    orig.addEventListener('change', ev => { if (ev.isTrusted) { incompleto = ''; mostrar(); txt.classList.remove('m-invalido'); } });
  });
}

new MutationObserver(muts => {
  muts.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) mejorarCamposFecha(n); }));
}).observe(document.documentElement, { childList: true, subtree: true });

async function cargar() {
  try {
    App.boot = await api('getBootstrap');
    App.proximosViejos = !!App.boot.proximosPendientes; // los próximos pagos se piden aparte, ya pintada la pantalla
    App.error = null;
  } catch (e) {
    App.error = e.message;
  }
  aplicarApariencia();
  render();
}

/** Instala las tablas por partes (cada llamada hace lo que alcanza en ~20 s) y muestra el avance en el botón. */
async function completarInstalacion(boton, hechas, tablas) {
  if (boton) boton.textContent = 'Preparando tus tablas…' + (tablas ? ' ' + hechas + ' de ' + tablas : '');
  for (let i = 0; i < 30; i++) {
    const r = await api('instalarBaseDatos');
    if (!r.parcial) return r;
    if (boton) boton.textContent = 'Preparando tus tablas… ' + r.hechas + ' de ' + r.tablas;
  }
  throw new Error('La instalación sigue en curso. Vuelve a intentarlo: continúa donde quedó.');
}

/**
 * Refresco liviano tras guardar: pide solo lo que cambió (tablas y/o parámetros) en vez de recargar toda la app.
 * opc = { tablas: ['Personas'], config: true }.
 */
async function refrescarParcial(opc) {
  const r = await api('getRefresco', opc);
  if (r.config) App.boot.config = r.config;
  Object.keys(r.catalogos || {}).forEach(t => { App.boot.catalogos[t] = r.catalogos[t]; });
  if (r.saldos) App.boot.saldos = r.saldos;
  if (r.invertido) App.boot.invertido = r.invertido;
  if ((opc.tablas || []).indexOf('CDTs') !== -1) { App.cdt.data = null; App.proximosViejos = true; }
  if (r.estado) App.boot.estado = r.estado;
  if (r.avisos) App.boot.avisos = r.avisos;
  const tocaPagos = (opc.tablas || []).some(t => ['Suscripciones', 'Ingresos_Recurrentes', 'Tarjetas', 'Creditos', 'Servicios_Publicos'].indexOf(t) !== -1);
  if (tocaPagos) { App.proximosViejos = true; App.pag.data = null; App.ing.data = null; }
  // Una suscripción nueva o editada entra al presupuesto de este mes: se vuelve a pedir para que Registrar y Presupuesto la vean.
  if ((opc.tablas || []).indexOf('Suscripciones') !== -1) {
    App.ppto.data = null;
    try { aplicarPresupuesto(await api('getPresupuesto', App.boot.hoy.slice(0, 7))); } catch (e) { /* se pedirá al abrir el presupuesto */ }
  }
  if (opc.config) aplicarApariencia();
  App.inicioGraf.viejo = true; App.inicioGraf.intentado = false;
  return r;
}

async function refrescar() {
  App.boot = await api('getBootstrap');
  App.pag.data = null; App.ing.data = null; App.proximosViejos = !!App.boot.proximosPendientes;
  App.inicioGraf.viejo = true; App.inicioGraf.intentado = false;
  aplicarApariencia();
  pedirSyncRecordatorios();
}

const cat = tabla => (App.boot && App.boot.catalogos && App.boot.catalogos[tabla]) || [];
const activos = tabla => cat(tabla).filter(f => esVerdad(f.Activo) || f.Activo === '' || f.Activo === undefined);
const esVerdad = v => v === true || String(v).toUpperCase() === 'TRUE';
const porId = (tabla, idCol, id) => cat(tabla).find(f => f[idCol] === id);
/** ¿Esta versión permite datos de demostración? Solo el entorno de desarrollo. En producción no hay nada de demo. */
const demoOn = () => !!(App.boot && App.boot.demoHabilitado);
const cfg = clave => (App.boot && App.boot.config && App.boot.config[clave]) || '';

// Divisas: se elige en el banco; sus cuentas y bolsillos la heredan.
const DIVISAS_UI = [['COP', 'Pesos (COP)'], ['USD', 'Dólares (USD)'], ['EUR', 'Euros (EUR)']];
const NOMBRE_DIVISA = { COP: 'Pesos', USD: 'Dólares', EUR: 'Euros' };
function divisaDeBanco(idBanco) { const b = porId('Bancos', 'ID_Banco', idBanco); return (b && b.Divisa) || 'COP'; }
function divisaDeCuenta(idCuenta) { const c = porId('Cuentas', 'ID_Cuenta', idCuenta); return c ? divisaDeBanco(c.ID_Banco) : 'COP'; }
function divisaDeBolsillo(idBolsillo) { const b = porId('Bolsillos', 'ID_Bolsillo', idBolsillo); return b ? divisaDeCuenta(b.ID_Cuenta) : 'COP'; }
const hayOtrasDivisas = () => activos('Bancos').some(b => (b.Divisa || 'COP') !== 'COP');

function saldoBolsillo(id) {
  const cuentas = (App.boot.saldos && App.boot.saldos.cuentas) || [];
  for (let i = 0; i < cuentas.length; i++) {
    const b = cuentas[i].bolsillos.find(x => x.ID_Bolsillo === id);
    if (b) return b.Saldo;
  }
  return 0;
}
function saldoCuenta(id) {
  const c = ((App.boot.saldos && App.boot.saldos.cuentas) || []).find(x => x.ID_Cuenta === id);
  return c ? c.Saldo : 0;
}

// ---------------------------------------------------------------------------
// Estado de movimientos: una escritura devuelve lo que cambió y aquí se aplica,
// sin volver a pedir todo al servidor.
// ---------------------------------------------------------------------------

App.det = { id: null, mes: null, anulados: false, data: null, cargando: false, error: null };
App.mov = { mes: null, anulados: false, texto: '', data: null, cargando: false, error: null };

function mesMas(mes, d) {
  const p = mes.split('-').map(Number);
  const f = new Date(p[0], p[1] - 1 + d, 1);
  return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0');
}
const capitalizar = t => t.charAt(0).toUpperCase() + t.slice(1);
function mesTexto(mes) {
  const p = mes.split('-').map(Number);
  return capitalizar(new Date(p[0], p[1] - 1, 1).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' }));
}
function isoDe(fecha) {
  return fecha.getFullYear() + '-' + String(fecha.getMonth() + 1).padStart(2, '0') + '-' + String(fecha.getDate()).padStart(2, '0');
}
/** Las fechas se muestran como AAAA/MM/DD. */
function fechaTxt(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  return m ? m[1] + '/' + m[2] + '/' + m[3] : String(iso || '');
}
function etiquetaDia(iso) {
  const hoy = App.boot.hoy;
  if (iso === hoy) return 'Hoy';
  const h = hoy.split('-').map(Number);
  if (iso === isoDe(new Date(h[0], h[1] - 1, h[2] - 1))) return 'Ayer';
  return fechaTxt(iso);
}

function aplicarSaldos(s) {
  const sal = App.boot && App.boot.saldos;
  if (!s || !sal) return;
  sal.cuentas.forEach(c => {
    const n = s.cuentas[c.ID_Cuenta];
    if (n) { c.Saldo = n.Saldo; c.Saldo_Real = n.Saldo_Real; c.Diferencia = n.Diferencia; c.Fecha_Saldo_Real = n.Fecha_Saldo_Real; }
    c.bolsillos.forEach(b => { if (s.bolsillos[b.ID_Bolsillo] !== undefined) b.Saldo = s.bolsillos[b.ID_Bolsillo]; });
  });
  sal.disponible = s.disponible; sal.ahorro = s.ahorro; sal.total = s.total; sal.divisas = s.divisas || [];
}

/** Totales de una lista, de una sola divisa (los pesos y los dólares no se suman). */
function totalesDe(lista, divisa) {
  const dv = divisa || 'COP';
  let ingresos = 0, gastos = 0;
  lista.forEach(i => { if (i.Anulado || i.esTransferencia || (i.Divisa || 'COP') !== dv) return; if (i.Valor >= 0) ingresos += i.Valor; else gastos += -i.Valor; });
  return { ingresos: ingresos, gastos: gastos, neto: ingresos - gastos, Divisa: dv };
}

function fusionarItems(lista, items, verAnulados, enRango) {
  items.forEach(it => {
    const i = lista.findIndex(x => x.ID_Mov === it.ID_Mov);
    if (it.Anulado && !verAnulados) { if (i >= 0) lista.splice(i, 1); return; }
    if (i >= 0) lista[i] = it; else if (enRango(it)) lista.unshift(it);
  });
  lista.sort((a, b) => (a.Fecha < b.Fecha ? 1 : a.Fecha > b.Fecha ? -1 : 0));
}

/** Aplica el resultado de una escritura: saldos, últimos movimientos y la lista que se está viendo. */
function aplicarEscritura(res) {
  pedirSyncRecordatorios();
  aplicarSaldos(res.saldos);
  if (res.ultimos) App.boot.ultimos = res.ultimos;
  if (res.invertido) App.boot.invertido = res.invertido;
  if (res.patrimonio) App.boot.patrimonio = res.patrimonio;
  if (res.presupuesto) aplicarPresupuesto(res.presupuesto);
  App.deudas.data = null; App.tar.data = null; App.cre.data = null; // se vuelven a pedir si hace falta
  App.proximosViejos = true; App.pag.data = null; App.ing.data = null;
  App.aho.data = null; App.ahoC.data = null; App.reg.data = null; App.anual.data = null; if (App.ana) App.ana.data = null;
  App.inicioGraf.viejo = true; App.inicioGraf.intentado = false;
  const ruta = rutaActual();

  const d = App.det;
  if (d.data && ruta === 'bolsillo/' + d.id) {
    if (res.saldos.bolsillos[d.id] !== undefined) d.data.bolsillo.Saldo = res.saldos.bolsillos[d.id];
    fusionarItems(d.data.movimientos, res.items, d.anulados, i => i.Fecha.slice(0, 7) === d.data.mes);
    d.data.totales = totalesDe(d.data.movimientos, divisaDeBolsillo(d.id));
  } else { d.data = null; }

  const m = App.mov;
  if (m.data && ruta === 'movimientos') {
    fusionarItems(m.data.items, res.items, m.anulados, i => i.Fecha.slice(0, 7) === m.data.mes);
    m.data.totales = totalesDe(m.data.items);
  } else { m.data = null; }
}

const vistaActual = () => { const r = rutaActual(); return r.indexOf('bolsillo/') === 0 ? { idBolsillo: r.slice(9) } : undefined; };

function infoBolsillo(id) {
  const cuentas = (App.boot.saldos && App.boot.saldos.cuentas) || [];
  for (let i = 0; i < cuentas.length; i++) {
    const b = cuentas[i].bolsillos.find(x => x.ID_Bolsillo === id);
    if (b) return { b: b, c: cuentas[i] };
  }
  return null;
}
/** Nombre con que se muestra un bolsillo: el saldo propio de una cuenta con bolsillos es "Sin asignar"; el de una cuenta sin bolsillos, la cuenta misma. */
function nombreBolsillo(b, c) { return b.Es_Interno ? (esVerdad(c.Permite_Bolsillos) ? 'Sin asignar' : c.Nombre) : b.Nombre; }
const hayBolsillos = () => ((App.boot.saldos && App.boot.saldos.cuentas) || []).some(c => c.bolsillos.length);

function buscarMov(id) {
  const fuentes = [App.det.data && App.det.data.movimientos, App.mov.data && App.mov.data.items, App.ahoC.data && App.ahoC.data.movimientos, App.boot.ultimos];
  for (let i = 0; i < fuentes.length; i++) {
    const hit = (fuentes[i] || []).find(x => x.ID_Mov === id);
    if (hit) return hit;
  }
  return null;
}

// Navegación
// ---------------------------------------------------------------------------

const esTab = r => Object.prototype.hasOwnProperty.call(AREA_DE_RUTA, r);

function navegar(ruta) {
  if (esTab(ruta)) App.pila = [ruta];
  else App.pila.push(ruta);
  render(true);
}
function volver() {
  if (App.pila.length > 1) App.pila.pop();
  render(true);
}
const rutaActual = () => App.pila[App.pila.length - 1];

function tituloRuta(ruta) {
  if (TITULOS_BASE[ruta]) return TITULOS_BASE[ruta];
  const partes = ruta.split('/');
  if (partes[0] === 'ajustes' && partes.length === 1) return 'Ajustes';
  if (partes[0] === 'movimientos') return 'Movimientos';
  if (partes[0] === 'nomina') return 'Nómina';
  if (partes[0] === 'regalos') return 'Regalos';
  if (partes[0] === 'anual') return 'Vista anual';
  if (partes[0] === 'guia') return 'Guía de uso';
  if (partes[0] === 'pagos') return 'Servicios y suscripciones';
  if (partes[0] === 'ingresos') return 'Otros ingresos';
  if (partes[0] === 'cdt') return 'CDT';
  if (partes[0] === 'ahorro') return partes.length === 1 ? 'Ahorro' : (App.ahoC.data && App.ahoC.id === partes[1] ? App.ahoC.data.cuenta.Nombre : 'Ahorro');
  if (partes[0] === 'tarjeta') return App.tar.data && App.tar.id === partes[1] ? App.tar.data.tarjeta.Nombre : 'Tarjeta';
  if (partes[0] === 'credito') return App.cre.data && App.cre.id === partes[1] ? App.cre.data.credito.Nombre : 'Crédito';
  if (partes[0] === 'bolsillo') { const inf = App.boot && infoBolsillo(partes[1]); return inf ? inf.b.Nombre : 'Bolsillo'; }
  const s = partes[1];
  if (CAT[s]) return CAT[s].plural;
  return { perfil: 'Perfil', apariencia: 'Apariencia', demo: 'Datos de demostración', diagnostico: 'Diagnóstico', plantilla: 'Plantilla del presupuesto', parametros: 'Parámetros de nómina', respaldos: 'Respaldos', cuenta: 'Mi cuenta', borrar: 'Borrar mis datos', registro: 'Registro de errores', divisas: 'Divisas', recordatorios: 'Recordatorios' }[s] || 'Atrás';
}

function render(enfocar) {
  VIZ.items = {}; // los gráficos de esta pantalla se registran al armar su HTML
  ocultarTip();
  const ruta = rutaActual();
  const raiz = App.pila[0];

  // Navegación principal: barra inferior (celular) y barra lateral (tablet y computador)
  const area = AREA_DE_RUTA[raiz] || '';
  const puedeRegistrar = !!(App.boot && App.boot.instalado && hayBolsillos());
  const tabHtml = t => '<button class="m-tab" data-acc="tab" data-ruta="' + t.ruta + '"' + (t.id === area ? ' aria-current="page"' : '') + '>' +
    '<span class="m-tab-ico">' + ico(t.icono) + '</span><span>' + esc(t.etiqueta) + '</span></button>';
  $('#tabbar').innerHTML = tabHtml(TABS[0]) + tabHtml(TABS[1]) +
    '<div class="m-tab-centro">' + (puedeRegistrar ? '<button class="m-tab-mas" data-acc="menu-registrar" aria-label="Registrar un movimiento">' + ico('plus') + '</button>' : '') + '</div>' +
    tabHtml(TABS[2]) + tabHtml(TABS[3]);
  $('#lateral').innerHTML = htmlLateral(raiz, area, puedeRegistrar);
  document.body.classList.toggle('m-lat-chica', lateralChica());

  // Pantalla
  let vista;
  try {
    vista = App.error ? vErrorCarga() : pantalla(ruta);
  } catch (e) {
    reportarErrorCliente('Pantalla ' + ruta + ': ' + e.message, e.stack);
    vista = { titulo: 'Error', html: '<div class="m-vacio">' + ico('alerta') + '<h2>No se pudo mostrar esta pantalla</h2><p>' + esc(e.message) + '</p></div>' };
  }

  const prev = App.pila.length > 1 ? tituloRuta(App.pila[App.pila.length - 2]) : '';
  $('#barra-izq').innerHTML = prev ? '<button class="m-btn-texto" data-acc="volver" aria-label="Volver a ' + esc(prev) + '">' + ico('izq', 'm-icon-sm') + esc(prev) + '</button>' : '';
  $('#barra-titulo').textContent = vista.titulo || '';
  $('#barra-der').innerHTML = vista.acciones || '';

  const titulo = vista.ocultarTitulo ? '' : '<h1 class="m-titulo-grande" id="titulo-pantalla" tabindex="-1">' + esc(vista.titulo) + '</h1>';
  $('#vista').classList.toggle('m-ancha', !!vista.ancha);
  $('#vista').innerHTML = titulo + (vista.subtitulo ? '<p class="m-subtitulo">' + esc(vista.subtitulo) + '</p>' : '') + pildorasDinero(ruta) + vista.html;
  document.title = (vista.titulo ? vista.titulo + ' · ' : '') + 'Moni';

  document.body.classList.toggle('m-asistente', !!vista.asistente);
  const fab = $('#fab');
  if (fab) fab.hidden = true; // registrar ahora vive en el botón + de la barra inferior y en la barra lateral

  if (vista.despues) vista.despues();
  activarViz();
  if (enfocar) {
    window.scrollTo(0, 0);
    const h = $('#titulo-pantalla');
    if (h) h.focus({ preventScroll: true });
  }
  $('#barra').classList.toggle('m-escrolado', window.scrollY > 40);
}

function pantalla(ruta) {
  if (!App.boot) return { titulo: 'Moni', html: '<div class="m-cargando">Cargando…</div>', ocultarTitulo: true };
  // Varias personas: antes de nada, cada una necesita su propia hoja.
  if (App.boot.sinHoja) return vCrearHoja();
  if (!App.boot.instalado && ruta.indexOf('ajustes') !== 0) return vInstalar();

  const partes = ruta.split('/');
  switch (partes[0]) {
    case 'inicio': return vInicio();
    case 'bolsillos': return vBolsillos();
    case 'presupuesto': return vPresupuesto();
    case 'nomina': return vNomina();
    case 'regalos': return vRegalos();
    case 'anual': return vAnual();
    case 'analisis': return vAnalisis();
    case 'guia': return vGuia();
    case 'pagos': return vPagos();
    case 'ingresos': return vIngresos();
    case 'cdt': return vCdts();
    case 'ahorro': return partes.length === 1 ? vAhorro() : vCuentaAhorro(partes[1]);
    case 'bolsillo': return vBolsillo(partes[1]);
    case 'movimientos': return vMovimientos();
    case 'tarjetas': return vDeudas();
    case 'tarjeta': return vTarjeta(partes[1]);
    case 'credito': return vCredito(partes[1]);
    case 'planear': return vPlanear();
    case 'ajustes':
      if (partes.length === 1) return vAjustes();
      if (partes[1] === 'perfil') return vPerfil();
      if (partes[1] === 'apariencia') return vApariencia();
      if (partes[1] === 'demo') return vDemo();
      if (partes[1] === 'plantilla') return vPlantilla();
      if (partes[1] === 'respaldos') return vRespaldos();
      if (partes[1] === 'cuenta') return vCuenta();
      if (partes[1] === 'borrar') return vBorrar();
      if (partes[1] === 'registro') return vRegistro();
      if (partes[1] === 'divisas') return vDivisas();
      if (partes[1] === 'recordatorios') return vRecordatorios();
      if (partes[1] === 'parametros') return vParametros();
      if (partes[1] === 'diagnostico') return vDiagnostico();
      if (CAT[partes[1]]) return vCatalogo(partes[1]);
  }
  return vProximamente('No encontrada', 'alerta', 'Esta pantalla no existe.');
}

function fila(o) {
  const cuerpo =
    (o.icono ? '<span class="m-row-icono">' + ico(o.icono, 'm-icon-sm') + '</span>' : '') +
    '<span class="m-row-texto"><span class="m-row-titulo" style="display:block">' + o.titulo + '</span>' +
    (o.sub ? '<span class="m-row-sub" style="display:block">' + o.sub + '</span>' : '') + '</span>' +
    (o.final ? '<span class="m-row-final">' + o.final + '</span>' : '') +
    (o.chevron ? ico('der', 'm-icon-sm m-chevron') : '');
  if (o.deshabilitada) return '<div class="m-row" aria-disabled="true">' + cuerpo + '</div>';
  return '<button class="m-row' + (o.clase ? ' ' + o.clase : '') + '" ' + (o.attrs || '') + '>' + cuerpo + '</button>';
}

function seccion(titulo, filas, pie) {
  return '<section class="m-seccion"' + (titulo ? ' aria-label="' + esc(titulo) + '"' : '') + '>' +
    (titulo ? '<h2 class="m-seccion-titulo">' + esc(titulo) + '</h2>' : '') +
    '<div class="m-group">' + filas + '</div>' + (pie ? '<p class="m-seccion-pie">' + pie + '</p>' : '') + '</section>';
}

function vacio(icono, titulo, texto, boton) {
  return '<div class="m-vacio">' + ico(icono) + '<h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p>' + (boton || '') + '</div>';
}

function irA(ruta, o) { return fila(Object.assign({ chevron: true, attrs: 'data-acc="ir" data-ruta="' + ruta + '"' }, o)); }
