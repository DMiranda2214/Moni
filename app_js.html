App.ppto = { mes: null, data: null, cargando: false, error: null };
App.nom = { mes: null, idEsc: '', data: null, cargando: false, error: null };
App.plantillaEsc = null;

/** Aplica un presupuesto recibido del servidor: la pantalla, el resumen de Inicio y los renglones de Registrar. */
function aplicarPresupuesto(data) {
  if (App.ppto.mes === data.mes) App.ppto.data = data;
  if (data.mes === App.boot.hoy.slice(0, 7)) {
    App.boot.ppto = { mes: data.mes, existe: data.existe, totales: data.totales };
    App.boot.renglones = data.items.map(i => ({ ID_Item: i.ID_Item, Concepto: i.Concepto, Pagado: i.Pagado }));
  }
}

const TIPOS_RENGLON = [['Gasto', 'Gasto'], ['Cuota', 'Cuota de un crédito'], ['Ahorro', 'Ahorro'], ['Fondo', 'Fondo para una meta']];

function opcionesDestino(conNinguno) {
  const grupos = ((App.boot.saldos && App.boot.saldos.cuentas) || []).filter(c => c.bolsillos.length).map(c => ({
    grupo: c.Banco + ' · ' + c.Nombre,
    opciones: c.bolsillos.map(b => [b.ID_Bolsillo, b.Es_Interno ? c.Nombre : b.Nombre])
  }));
  return (conNinguno ? [['', 'Ninguno']] : []).concat(grupos);
}

// ---------- Presupuesto ----------

function pctTexto(n) { return n === null || n === undefined ? '—' : Math.round(n * 100) + ' %'; }

function vPresupuesto() {
  const p = App.ppto;
  if (!p.mes) p.mes = App.boot.hoy.slice(0, 7);
  let html = bannerDemo() + navegadorMes('ppto', p.mes, mesMas(App.boot.hoy.slice(0, 7), 1));
  if (p.error) html += bloqueError(p.error, 'recargar-ppto');
  else if (!p.data) html += esqueleto(5);
  else if (!p.data.existe) html += htmlGenerarPpto(p.data);
  else html += htmlPresupuesto(p.data);

  const acciones = (p.data && p.data.existe)
    ? '<button class="m-btn-texto" data-acc="ir" data-ruta="nomina">Nómina</button><button class="m-btn-texto" data-acc="nuevo-renglon" aria-label="Agregar un renglón">' + ico('plus') + '</button>'
    : '<button class="m-btn-texto" data-acc="ir" data-ruta="nomina">Nómina</button>';
  return { titulo: 'Presupuesto', acciones: acciones, html: html, despues: () => { if (!p.data && !p.cargando && !p.error) cargarPpto(); } };
}

async function cargarPpto() {
  const p = App.ppto;
  const mes = p.mes;
  p.cargando = true; p.error = null;
  try {
    const data = await api('getPresupuesto', mes);
    if (p.mes !== mes) { p.cargando = false; render(); return; } // respuesta vieja: se descarta y se pide la actual
    p.data = data; aplicarPresupuesto(data);
  } catch (e) { p.error = e.message; }
  p.cargando = false;
  if (rutaActual() === 'presupuesto') render();
}

function htmlGenerarPpto(d) {
  const conRenglones = d.escenarios.filter(e => e.renglones > 0);
  if (!conRenglones.length) {
    return vacio('presupuesto', 'Aún no tienes una plantilla',
      'La plantilla es la lista de lo que planeas gastar cada mes. Con ella, el presupuesto de cada mes se genera en un toque.',
      '<button class="m-btn m-btn-primary" data-acc="ir" data-ruta="ajustes/plantilla">Armar la plantilla</button>');
  }
  const base = conRenglones.find(e => e.Es_Base) || conRenglones[0];
  const selector = conRenglones.length > 1
    ? '<div class="m-campo" style="text-align:left;width:100%;max-width:360px"><label class="m-label" for="ppto-esc">Escenario</label><select class="m-input" id="ppto-esc">' +
      conRenglones.map(e => '<option value="' + esc(e.ID_Escenario) + '"' + (e.ID_Escenario === base.ID_Escenario ? ' selected' : '') + '>' + esc(e.Nombre) + ' (' + e.renglones + ' renglones)</option>').join('') + '</select></div>'
    : '';
  return '<div class="m-vacio">' + ico('presupuesto') + '<h2>Aún no hay presupuesto de ' + esc(mesTexto(d.mes).toLowerCase()) + '</h2>' +
    '<p>Se crea con los renglones de tu plantilla' + (conRenglones.length === 1 ? ' (' + esc(base.Nombre) + ', ' + base.renglones + ' renglones)' : '') + '. Después puedes ajustarlo.</p>' +
    selector + '<button class="m-btn m-btn-primary" data-acc="generar-ppto">Generar el presupuesto</button></div>';
}

function filaRenglon(i) {
  const rest = i.Restante;
  const final = i.Pagado
    ? '<strong class="m-num ' + (rest < 0 ? 'm-negativo' : 'm-positivo') + '">' + dinero(Math.abs(rest)) + '</strong><span class="m-row-sub" style="display:block">' + (rest < 0 ? 'excedido' : 'ahorro') + '</span>'
    : '<strong class="m-num ' + (rest < 0 ? 'm-negativo' : '') + '">' + dinero(Math.abs(rest)) + '</strong><span class="m-row-sub" style="display:block">' + (rest < 0 ? 'excedido' : 'falta') + '</span>';
  return '<div class="m-row m-renglon' + (i.Pagado ? ' m-hecho' : '') + '">' +
    '<label class="m-check"><input type="checkbox" data-acc-cambio="pagado" data-id="' + esc(i.ID_Item) + '"' + (i.Pagado ? ' checked' : '') + ' aria-label="Pagado: ' + esc(i.Concepto) + '"><span aria-hidden="true">' + ico('check', 'm-icon-sm') + '</span></label>' +
    '<button class="m-row-main" data-acc="renglon" data-id="' + esc(i.ID_Item) + '"><span class="m-row-texto"><span class="m-row-titulo" style="display:block">' + esc(i.Concepto) + '</span>' +
    '<span class="m-row-sub" style="display:block">Plan ' + dinero(i.Plan) + ' · Real ' + dinero(i.Real) + (i.Bolsillo ? ' · ' + esc(i.Bolsillo) : '') + '</span></span>' +
    '<span class="m-row-final">' + final + '</span></button></div>';
}

function htmlPresupuesto(d) {
  const t = d.totales;
  const avance = t.plan > 0 ? Math.min(100, Math.round(t.real / t.plan * 100)) : 0;
  let h = '<div class="m-group m-saldo-grande"><div class="m-resumen-etiqueta">Te queda</div>' +
    '<div class="m-resumen-cifra m-num ' + claseSaldo(t.saldo) + '">' + dinero(t.saldo) + '</div>' +
    '<div class="m-resumen-fila"><div><div class="m-resumen-etiqueta">Entró</div><strong class="m-num m-positivo">' + dinero(t.ingresos) + '</strong></div>' +
    '<div><div class="m-resumen-etiqueta">Gastado</div><strong class="m-num">' + dinero(t.real) + '</strong></div>' +
    '<div><div class="m-resumen-etiqueta">Ahorras</div><strong class="m-num">' + pctTexto(t.porcentajeAhorro) + '</strong></div></div>' +
    '<div class="m-progreso" style="margin-top:var(--m-space-3)" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + avance + '" aria-label="Gastado frente a lo planeado"><span style="width:' + avance + '%"></span></div>' +
    '<p class="m-ayuda">Gastado ' + dinero(t.real) + ' de ' + dinero(t.plan) + ' planeado · ' + t.pagados + ' de ' + t.renglones + ' pagados' + (d.escenario ? ' · ' + esc(d.escenario.Nombre) : '') + '</p></div>';

  h += '<div style="height:var(--m-space-4)"></div><div class="m-group">' + d.items.map(filaRenglon).join('') + '</div>';
  h += '<div class="m-acciones-fila" style="margin-top:var(--m-space-4)"><button class="m-btn m-btn-primary" data-acc="distribuir">Repartir la nómina en los bolsillos</button></div>';
  return h;
}

// ---------- Renglón: detalle, editar, pagar ----------

async function abrirRenglon(id) {
  const it = App.ppto.data && App.ppto.data.items.find(x => x.ID_Item === id);
  if (!it) return;
  const filas = [['Tipo', esc(it.Tipo === 'Cuota' ? 'Cuota de un crédito' : it.Tipo)], ['Plan', dinero(it.Plan)], ['Real', dinero(it.Real)],
    [it.Restante < 0 ? 'Excedido' : 'Falta', dinero(Math.abs(it.Restante))]];
  if (it.Bolsillo) filas.push([it.Tipo === 'Gasto' ? 'Se paga desde' : 'Se aparta en', esc(it.Bolsillo)]);
  if (it.Pagado) filas.push(['Estado', 'Pagado' + (it.Ahorro ? ' · ahorro ' + dinero(it.Ahorro) : '')]);

  let siguiente = null;
  const apartar = it.Tipo !== 'Gasto';
  const cuerpo = '<p class="m-subtitulo" style="padding:0 0 var(--m-space-3);margin:0;font-weight:600;color:var(--m-label)">' + esc(it.Concepto) + '</p>' +
    '<dl class="m-detalle">' + filas.map(f => '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>').join('') + '</dl>' +
    '<button type="button" class="m-btn m-btn-primary" style="width:100%;margin-bottom:var(--m-space-2)" data-hoja-acc="pagar">' + (apartar ? 'Apartar dinero' : 'Registrar el pago') + '</button>' +
    '<button type="button" class="m-btn m-btn-secondary" style="width:100%" data-hoja-acc="editar">Editar el renglón</button>' +
    '<button type="button" class="m-accion-peligro" data-hoja-acc="pedir-quitar">Quitar el renglón</button>' +
    '<div id="confirma" hidden class="m-error-form" style="margin-top:var(--m-space-3)"><p style="margin-bottom:var(--m-space-3)">¿Quitar “' + esc(it.Concepto) + '” de este mes? Solo se puede si no tiene movimientos enlazados.</p>' +
    '<div class="m-hoja-acciones"><button type="button" class="m-btn m-btn-secondary" data-hoja-acc="no-quitar">No, dejarlo</button><button type="button" class="m-btn m-btn-primary" style="background:var(--m-danger);color:#fff" data-hoja-acc="quitar">Sí, quitarlo</button></div></div>';

  await abrirHoja({
    titulo: 'Renglón', izq: 'Cerrar', sinGuardar: true, cuerpo: cuerpo,
    extra: {
      pagar: () => {
        const falta = Math.max(it.Restante, 0) || it.Plan;
        siguiente = () => abrirRegistrar(apartar
          ? { tipo: 'Mover', destino: it.ID_Bolsillo_Destino, concepto: it.Concepto, valor: falta, idItem: it.ID_Item }
          : { tipo: 'Gasto', idBolsillo: it.ID_Bolsillo_Destino, concepto: it.Concepto, valor: falta, idItem: it.ID_Item });
        return Promise.resolve();
      },
      editar: () => { siguiente = () => abrirRenglonMes(it); return Promise.resolve(); },
      'pedir-quitar': raiz => { $('#confirma', raiz).hidden = false; $('[data-hoja-acc="pedir-quitar"]', raiz).hidden = true; $('[data-hoja-acc="quitar"]', raiz).focus(); },
      'no-quitar': raiz => { $('#confirma', raiz).hidden = true; $('[data-hoja-acc="pedir-quitar"]', raiz).hidden = false; },
      quitar: () => api('deleteRenglonMes', id).then(data => { aplicarPresupuesto(data); render(); aviso('Renglón quitado'); })
    }
  });
  if (siguiente) siguiente();
}

async function abrirRenglonMes(item) {
  const campos = [
    { k: 'Concepto', label: 'Concepto', tipo: 'texto', requerido: true, maxlength: 80 },
    { k: 'Plan', label: 'Cuánto planeas', tipo: 'dinero', requerido: true },
    { k: 'Tipo', label: 'Tipo', tipo: 'select', opciones: () => TIPOS_RENGLON },
    { k: 'ID_Bolsillo_Destino', label: 'Bolsillo de destino', tipo: 'select', opciones: () => opcionesDestino(true),
      ayuda: 'Si es un gasto, el bolsillo desde donde lo pagas. Si es ahorro, fondo o cuota, donde se aparta el dinero.' },
    { k: 'ID_Credito', label: 'Crédito que paga', tipo: 'select', visible: v => v.Tipo === 'Cuota', opciones: () => [['', 'Ninguno']].concat((App.boot.creditos || []).map(c => [c.ID_Credito, c.Nombre])),
      ayuda: 'Al pagar una cuota de ese crédito, cuenta como lo real de este renglón.' }
  ];
  const v0 = item || { Tipo: 'Gasto', Plan: '' };
  await abrirHoja({
    titulo: item ? 'Editar renglón' : 'Nuevo renglón',
    cuerpo: '<form novalidate data-form="renglon">' + campos.map(c => htmlCampo(c, v0[c.k] === undefined ? '' : v0[c.k], {})).join('') + '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => {
      activarEcoDinero(raiz); actualizarVisibilidad(raiz, campos, {});
      raiz.addEventListener('change', () => actualizarVisibilidad(raiz, campos, {}));
      const f = $('#f-Concepto', raiz); if (f && !item) f.focus();
    },
    alGuardar: async raiz => {
      const v = leerFormulario(raiz, campos);
      if (!v.Concepto) throw new Error('Escribe el concepto.');
      if (v.Plan === '' || (typeof v.Plan === 'number' && isNaN(v.Plan))) throw new Error('Escribe cuánto planeas.');
      const envio = { Mes: App.ppto.mes, Concepto: v.Concepto, Plan: v.Plan, Tipo: v.Tipo, ID_Bolsillo_Destino: v.ID_Bolsillo_Destino, ID_Credito: v.Tipo === 'Cuota' ? (v.ID_Credito || '') : '' };
      if (item) envio.ID_Item = item.ID_Item;
      const data = await api('saveRenglonMes', envio);
      aplicarPresupuesto(data); render(); aviso(item ? 'Renglón actualizado' : 'Renglón agregado');
    }
  });
}

// ---------- Repartir la nómina ----------

async function abrirDistribucion(mes) {
  const pago = App.nom.data && App.nom.mes === mes ? App.nom.data.pago : null;
  const grupos = opcionesDestino(false);
  const ids = [].concat.apply([], grupos.map(g => g.opciones.map(x => x[0])));
  const origenInicial = pago && ids.indexOf(pago.ID_Bolsillo_Destino) !== -1 ? pago.ID_Bolsillo_Destino : (ids.indexOf(ultimoBolsillo()) !== -1 ? ultimoBolsillo() : ids[0]);
  let prev = null;

  const cuerpo = '<form novalidate data-form="distribuir"><p class="m-hoja-mensaje">Mueve el dinero de la nómina desde el bolsillo donde llegó hasta los bolsillos de destino, según el presupuesto de ' + esc(mesTexto(mes).toLowerCase()) + '.</p>' +
    '<div class="m-campo"><label class="m-label" for="f-Origen">¿Dónde está la nómina?</label><select class="m-input" id="f-Origen">' +
    grupos.map(g => '<optgroup label="' + esc(g.grupo) + '">' + g.opciones.map(x => '<option value="' + esc(x[0]) + '"' + (x[0] === origenInicial ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') + '</optgroup>').join('') + '</select></div>' +
    '<div id="dist-prev" aria-live="polite">' + esqueleto(3) + '</div>' +
    '<div class="m-campo" id="dist-repetir" hidden><div class="m-interruptor-fila"><label for="f-Repetir">Ya se repartió este mes. Repetirlo de todos modos</label><span class="m-interruptor"><input type="checkbox" role="switch" id="f-Repetir"><i></i></span></div></div>' +
    '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>';

  await abrirHoja({
    titulo: 'Repartir nómina', der: 'Repartir', cuerpo: cuerpo,
    alAbrir: raiz => {
      const sel = $('#f-Origen', raiz);
      const cargar = async () => {
        $('#dist-prev', raiz).innerHTML = esqueleto(3); prev = null;
        try {
          prev = await api('previewDistribucion', mes, sel.value);
          const caja = $('#dist-prev', raiz);
          caja.innerHTML = prev.lineas.length
            ? '<dl class="m-detalle">' + prev.lineas.map(l => '<div><dt>' + (l.ID_Item ? esc(l.Renglones[0]) + ' → ' + esc(l.Destino) : esc(l.Destino) + ' (' + esc(l.Renglones.join(', ')) + ')') + '</dt><dd class="m-num">' + dinero(l.Monto) + '</dd></div>').join('') +
              '<div><dt><strong>Total a repartir</strong></dt><dd class="m-num"><strong>' + dinero(prev.total) + '</strong></dd></div></dl>'
            : '<p class="m-ayuda">No hay nada que repartir desde este bolsillo: los renglones del mes no tienen otro bolsillo de destino.</p>';
          $('#dist-repetir', raiz).hidden = !prev.yaDistribuido;
        } catch (e) { $('#dist-prev', raiz).innerHTML = '<div class="m-error-form" role="alert">' + esc(e.message) + '</div>'; }
      };
      sel.addEventListener('change', cargar);
      cargar();
    },
    alGuardar: async raiz => {
      if (!prev) throw new Error('Espera un momento: se está calculando el reparto.');
      if (!prev.lineas.length) throw new Error('No hay nada que repartir desde este bolsillo.');
      const origen = $('#f-Origen', raiz).value;
      const res = await api('distribuir', mes, origen, App.boot.hoy, !!$('#f-Repetir', raiz).checked);
      recordarBolsillo(origen);
      aplicarEscritura(res); render();
      aviso('Nómina repartida: ' + res.distribucion.traslados + ' traslados', { deshacer: () => deshacerReparto(res.ids) });
    }
  });
}

async function deshacerReparto(ids) {
  try {
    const res = await api('voidVarios', ids, vistaActual());
    aplicarEscritura(res); render();
    aviso('Reparto deshecho');
  } catch (e) { aviso(e.message, true); }
}

// ---------- Plantilla del presupuesto ----------

function vPlantilla() {
  const escs = activos('Escenarios');
  if (!App.plantillaEsc || !escs.some(e => e.ID_Escenario === App.plantillaEsc)) {
    const base = escs.find(e => esVerdad(e.Es_Base)) || escs[0];
    App.plantillaEsc = base ? base.ID_Escenario : null;
  }
  const filas = activos('Presupuesto_Plantilla').filter(p => p.ID_Escenario === App.plantillaEsc)
    .sort((a, b) => (Number(a.Orden) || 9999) - (Number(b.Orden) || 9999));
  const total = filas.reduce((a, p) => a + (Number(p.Monto_Plan) || 0), 0);

  let html = '';
  if (escs.length > 1) {
    html += '<div class="m-campo"><label class="m-label" for="plantilla-esc">Escenario</label><select class="m-input" id="plantilla-esc" data-acc-cambio="plantilla-esc">' +
      escs.map(e => '<option value="' + esc(e.ID_Escenario) + '"' + (e.ID_Escenario === App.plantillaEsc ? ' selected' : '') + '>' + esc(e.Nombre) + (esVerdad(e.Es_Base) ? ' (base)' : '') + '</option>').join('') + '</select>' +
      '<p class="m-ayuda">Cada escenario es un presupuesto completo. Crea otro en Ajustes → Escenarios (por ejemplo, uno de contingencia).</p></div>';
  }
  if (!filas.length) {
    html += vacio('presupuesto', 'Esta plantilla está vacía', 'Agrega lo que planeas gastar cada mes: arriendo, servicios, mercado, ahorro… Con eso se genera cada presupuesto mensual.',
      '<button class="m-btn m-btn-primary" data-acc="nuevo-plantilla">Agregar el primer renglón</button>');
  } else {
    html += '<div class="m-group">' + filas.map(p => {
      const b = p.ID_Bolsillo_Destino ? infoBolsillo(p.ID_Bolsillo_Destino) : null;
      return fila({
        titulo: esc(p.Concepto), sub: esc(p.Tipo === 'Cuota' ? 'Cuota' : p.Tipo) + (b ? ' · ' + esc(b.b.Es_Interno ? b.c.Nombre : b.b.Nombre) : ''),
        final: '<span class="m-num">' + dinero(p.Monto_Plan) + '</span>', chevron: true,
        attrs: 'data-acc="editar-plantilla" data-id="' + esc(p.ID_Plantilla) + '"'
      });
    }).join('') + fila({ titulo: '<strong>Total del mes</strong>', final: '<strong class="m-num">' + dinero(total) + '</strong>' }).replace('<button', '<div').replace('</button>', '</div>') + '</div>';
  }
  return {
    titulo: 'Plantilla del presupuesto',
    acciones: filas.length ? '<button class="m-btn-texto" data-acc="nuevo-plantilla" aria-label="Agregar un renglón">' + ico('plus') + '</button>' : '',
    html: html
  };
}

// ---------- Nómina ----------

function vNomina() {
  const n = App.nom;
  if (!n.mes) n.mes = App.boot.hoy.slice(0, 7);
  let html = bannerDemo() + navegadorMes('nom', n.mes, mesMas(App.boot.hoy.slice(0, 7), 1));
  if (n.error) html += bloqueError(n.error, 'recargar-nom');
  else if (!n.data) html += esqueleto(5);
  else html += htmlNomina(n.data);
  return { titulo: 'Nómina', html: html, despues: () => { if (!n.data && !n.cargando && !n.error) cargarNomina(); } };
}

async function cargarNomina() {
  const n = App.nom;
  const mes = n.mes, idEsc = n.idEsc;
  n.cargando = true; n.error = null;
  try {
    const data = await api('getNomina', mes, idEsc);
    if (n.mes !== mes || n.idEsc !== idEsc) { n.cargando = false; render(); return; } // respuesta vieja: se descarta y se pide la actual
    n.data = data;
  } catch (e) { n.error = e.message; }
  n.cargando = false;
  if (rutaActual() === 'nomina') render();
}

function seccionNomina(titulo, lineas, clase) {
  if (!lineas.length) return '';
  return '<section class="m-seccion"><h2 class="m-seccion-titulo">' + esc(titulo) + '</h2><div class="m-group">' +
    lineas.map(l => fila({ titulo: esc(l.concepto), final: '<span class="m-num ' + (clase || '') + '">' + (clase === 'm-negativo' ? '−' : '') + dinero(l.valor) + '</span>' })).join('') + '</div></section>';
}

function htmlNomina(d) {
  if (!d.calculo) {
    return vacio('usuario', 'Aún no hay escenarios de nómina', d.error || 'Crea uno con tu sueldo base para calcular cuánto te llega cada mes.',
      '<button class="m-btn m-btn-primary" data-acc="ir" data-ruta="ajustes/Nomina_Escenarios">Crear un escenario</button>');
  }
  const c = d.calculo;
  let h = '';
  if (d.comparacion.length > 1) {
    h += '<div class="m-campo"><label class="m-label" for="nom-esc">Escenario</label><select class="m-input" id="nom-esc">' +
      d.comparacion.map(e => '<option value="' + esc(e.ID_Nomina_Esc) + '"' + (e.ID_Nomina_Esc === c.escenario.ID_Nomina_Esc ? ' selected' : '') + '>' + esc(e.Nombre) + (e.Vigente ? ' (vigente)' : '') + ' — ' + dinero(e.neto) + '</option>').join('') + '</select></div>';
  }

  h += '<div class="m-group m-saldo-grande"><div class="m-resumen-etiqueta">Neto estimado · ' + esc(c.escenario.Nombre) + '</div>' +
    '<div class="m-resumen-cifra m-num">' + dinero(c.totales.neto) + '</div>' +
    '<p class="m-ayuda">Devengado ' + dinero(c.totales.devengado) + ' − deducciones ' + dinero(c.totales.deducciones) + (c.totales.extras ? ' + extras ' + dinero(c.totales.extras) : '') + '</p></div><div style="height:var(--m-space-4)"></div>';

  h += seccionNomina('Devengado', c.devengos) + seccionNomina('Deducciones', c.deducciones, 'm-negativo') + seccionNomina('Este mes además', c.extras, 'm-positivo');

  if (d.pago) {
    const b = infoBolsillo(d.pago.ID_Bolsillo_Destino);
    h += '<section class="m-seccion"><h2 class="m-seccion-titulo">Nómina recibida</h2><div class="m-group"><dl class="m-detalle" style="padding:var(--m-space-2) var(--m-space-4);margin:0">' +
      '<div><dt>Neto recibido</dt><dd class="m-num"><strong>' + dinero(d.pago.Neto_Real) + '</strong></dd></div>' +
      '<div><dt>Fecha</dt><dd>' + esc(d.pago.Fecha_Pago) + '</dd></div>' +
      '<div><dt>Llegó a</dt><dd>' + esc(b ? (b.b.Es_Interno ? b.c.Nombre : b.b.Nombre) : '') + '</dd></div>' +
      (Math.abs(d.pago.Neto_Real - d.pago.Neto_Estimado) >= 0.005 ? '<div><dt>Diferencia con lo estimado</dt><dd class="m-num">' + dinero(d.pago.Neto_Real - d.pago.Neto_Estimado) + '</dd></div>' : '') +
      '</dl></div></section>' +
      '<div class="m-acciones-fila"><button class="m-btn m-btn-primary" data-acc="distribuir-nomina">Repartir en los bolsillos</button></div>' +
      '<button class="m-accion-peligro" data-acc="anular-nomina">Anular esta nómina</button>';
  } else {
    h += '<div class="m-acciones-fila"><button class="m-btn m-btn-primary" data-acc="registrar-nomina">Registrar nómina recibida</button></div>';
  }
  return h;
}

async function abrirRegistrarNomina() {
  const d = App.nom.data;
  if (!d || !d.calculo) return;
  const campos = [
    { k: 'Valor', label: 'Neto que recibiste', tipo: 'dinero', requerido: true, ayuda: 'Por defecto, el estimado. Cámbialo si el valor real fue distinto.' },
    { k: 'Bolsillo', label: 'Bolsillo donde llegó', tipo: 'select', requerido: true, opciones: () => opcionesDestino(false) }
  ];
  const preferido = ultimoBolsillo();
  await abrirHoja({
    titulo: 'Nómina de ' + mesTexto(App.nom.mes).toLowerCase(),
    cuerpo: '<form novalidate data-form="nomina">' + htmlCampo(campos[0], d.calculo.totales.neto, {}) + htmlCampo(campos[1], preferido, {}) +
      '<div class="m-campo"><label class="m-label" for="f-Fecha">Fecha</label><input class="m-input" id="f-Fecha" type="date" max="' + App.boot.hoy + '" value="' + App.boot.hoy + '"></div>' +
      '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => activarEcoDinero(raiz),
    alGuardar: async raiz => {
      const v = leerFormulario(raiz, campos);
      if (v.Valor === '' || (typeof v.Valor === 'number' && isNaN(v.Valor))) throw new Error('Escribe el neto que recibiste.');
      if (!v.Bolsillo) throw new Error('Elige el bolsillo donde llegó.');
      const res = await api('registrarNomina', App.nom.mes, App.nom.idEsc, v.Valor, $('#f-Fecha', raiz).value, v.Bolsillo);

const FUENTES = [
  ['Personal', 'Personal', 'Sale de tu bolsillo personal cuando pagues el extracto.'],
  ['Ppto', 'Del presupuesto', 'Aparta ahora el dinero desde el bolsillo del renglón del presupuesto (por ejemplo, una suscripción).'],
  ['Guardar', 'Para guardar', 'Aparta ahora el dinero desde tu bolsillo personal, para tenerlo listo.'],
  ['Otro', 'De otra persona', 'Compra para alguien más: no mueve dinero hasta que te lo reembolsen.']
];
const etiquetaFuente = f => (FUENTES.find(x => x[0] === f) || [f, f])[1];

function fechaCorta(iso) {
  if (!iso) return '';
  const p = iso.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
}

/** Mes (AAAA-MM) del extracto al que entra una compra con esta fecha, según el día de corte. */
function mesExtractoDe(fecha, diaCorte) {
  const p = fecha.split('-').map(Number);
  let a = p[0], m = p[1];
  if (p[2] > diaCorte) { m++; if (m > 12) { m = 1; a++; } }
  return a + '-' + String(m).padStart(2, '0');
}

async function abrirPagoCredito() {

  const cuerpo = '<form novalidate data-form="pagocredito">' + htmlCampo(campos[0], c.proxima.Cuota, {}) +
    '<div id="pago-prev" aria-live="polite" class="m-hoja-mensaje"></div>' +
    '<div class="m-campo"><label class="m-label" for="f-Origen">Pagas desde</label><select class="m-input" id="f-Origen">' +
    grupos.map(g => '<optgroup label="' + esc(g.grupo) + '">' + g.opciones.map(x => '<option value="' + esc(x[0]) + '"' + (x[0] === c.ID_Bolsillo_Pago ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') + '</optgroup>').join('') + '</select></div>' +

      activarEcoDinero(raiz);

            (previa.excedente > 0 ? '<br>Abono a capital: <strong>' + dinero(previa.excedente) + '</strong>' + (previa.cancela ? ' · con esto <strong>se termina el crédito</strong>.' : (previa.cuotasAhorradas > 0 ? ' · el plazo baja de ' + previa.cuotasRestantesAntes + ' a ' + previa.cuotasRestantes + ' cuotas restantes (ahorras ' + previa.cuotasAhorradas + ').' : ' · el plazo se mantiene, pero la última cuota será más pequeña.')) : '') +
            '<br>Total a pagar: <strong>' + dinero(previa.valorCobrado) + '</strong>' + (previa.valorCobrado < v ? ' (solo se cobra lo necesario)' : '') + '.';
        } catch (e) { previa = null; caja.textContent = e.message; }
      };
      entrada.addEventListener('input', () => { clearTimeout(temporizador); temporizador = setTimeout(calcular, 350); });
      calcular(); entrada.focus();
    },
    alGuardar: async raiz => {
      const v = leerDinero($('#f-Valor', raiz).value);
      if (v === '' || isNaN(v)) throw new Error('Escribe el valor del pago.');
      const res = await api('payCredito', c.ID_Credito, v, $('#f-Fecha', raiz).value, $('#f-Origen', raiz).value);
      aplicarEscritura(res); aplicarCredito(res); render();
      aviso(res.pago.cancela ? 'Crédito pagado por completo' : (res.pago.excedente ? (res.pago.cuotasAhorradas > 0 ? 'Pago registrado: el plazo bajó ' + res.pago.cuotasAhorradas + (res.pago.cuotasAhorradas === 1 ? ' cuota' : ' cuotas') : 'Pago registrado con abono a capital') : 'Cuota pagada'), { deshacer: () => anularPagoCreditoYAvisar(res.pago.idPago) });
    }
  });

/** Carga genérica: pide `fn`, guarda en `st.data` y vuelve a pintar si se sigue en `ruta`. */
async function cargarEn(st, ruta, fn, args, valido) {
  st.cargando = true; st.error = null;
  try {
    const data = await api.apply(null, [fn].concat(args));
    if (valido && !valido()) { st.cargando = false; render(); return; }
    st.data = data;
  } catch (e) { st.error = e.message; }
  st.cargando = false;
  if (rutaActual() === ruta) render();
}

/** Sacar dinero del ahorro para gastos, o reponerlo. */
async function abrirMovimientoAhorro(modo) {
  const d = App.ahoC.data;
  if (!d) return;
  const retirar = modo === 'retirar';
  const grupos = opcionesDestino(false).map(g => ({ grupo: g.grupo, opciones: g.opciones.filter(x => x[0] !== d.ID_Bolsillo) })).filter(g => g.opciones.length);
  const cuerpo = '<form novalidate data-form="ahorro-mov"><p class="m-hoja-mensaje">' + (retirar ? 'Sacas dinero del ahorro para gastarlo. Queda anotado como algo que debes reponer.' : 'Devuelves dinero al ahorro. Baja lo que debes reponer (hoy: ' + dinero(d.cuenta.deuda.manual) + ').') + '</p>' +
    htmlCampo({ k: 'Valor', label: 'Valor', tipo: 'dinero', requerido: true }, retirar ? '' : d.cuenta.deuda.manual, {}) +
    '<div class="m-campo"><label class="m-label" for="f-Bolsillo">' + (retirar ? 'El dinero llega a' : 'El dinero sale de') + '</label><select class="m-input" id="f-Bolsillo">' +
    grupos.map(g => '<optgroup label="' + esc(g.grupo) + '">' + g.opciones.map(x => '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>').join('') + '</optgroup>').join('') + '</select></div>' +
    '<div class="m-campo"><label class="m-label" for="f-Fecha">Fecha</label><input class="m-input" id="f-Fecha" type="date" max="' + App.boot.hoy + '" value="' + App.boot.hoy + '"></div><button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>';
  await abrirHoja({
    titulo: retirar ? 'Sacar para gastos' : 'Reponer al ahorro', cuerpo: cuerpo, alAbrir: raiz => { activarEcoDinero(raiz); $('#f-Valor', raiz).focus(); },
    alGuardar: async raiz => {
      const v = leerDinero($('#f-Valor', raiz).value);
      if (v === '' || isNaN(v)) throw new Error('Escribe el valor.');
      const res = await api(retirar ? 'withdrawAhorro' : 'repayAhorro', d.cuenta.ID_Cuenta, $('#f-Bolsillo', raiz).value, v, $('#f-Fecha', raiz).value, '');
      aplicarEscritura(res); aplicarAhorro(res); render(); aviso(retirar ? 'Dinero sacado del ahorro' : 'Dinero repuesto');
    }
  });
}

function aplicarRegalos(data) { if (App.reg.anio === data.anio) App.reg.data = data; }

async function abrirRegalo(item) {
  const personas = activos('Personas');
  if (!personas.length) { aviso('Primero agrega a las personas en Ajustes → Personas.', true); return; }
  const campos = [
    { k: 'ID_Persona', label: 'Para quién', tipo: 'select', requerido: true, opciones: () => personas.map(p => [p.ID_Persona, p.Nombre]) },
    { k: 'Idea', label: 'Idea de regalo', tipo: 'texto', maxlength: 120 },
    { k: 'Estimado', label: 'Cuánto calculas gastar', tipo: 'dinero', requerido: true },
    { k: 'Aplica', label: 'Aplica este año', tipo: 'interruptor', ayuda: 'Desactívalo si este año no le vas a regalar; no cuenta en los totales.' }
  ];
  const v0 = item || { Aplica: true };
  await abrirHoja({
    titulo: item ? 'Editar regalo' : 'Nuevo regalo',
    cuerpo: '<form novalidate data-form="regalo">' + campos.map(c => htmlCampo(c, v0[c.k] === undefined ? '' : v0[c.k], {})).join('') + '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => activarEcoDinero(raiz),
    alGuardar: async raiz => {
      const v = leerFormulario(raiz, campos);
      if (!v.ID_Persona) throw new Error('Elige para quién es.');
      if (v.Estimado === '' || (typeof v.Estimado === 'number' && isNaN(v.Estimado))) throw new Error('Escribe cuánto calculas gastar.');
      const envio = Object.assign({ Anio: App.reg.anio }, v);
      if (item) envio.ID_Regalo = item.ID_Regalo;
      aplicarRegalos(await api('saveRegalo', envio)); render(); aviso(item ? 'Regalo actualizado' : 'Regalo agregado');
    }
  });
}

async function abrirDetalleRegalo(id) {
  const it = App.reg.data && App.reg.data.items.find(x => x.ID_Regalo === id);
  if (!it) return;
  let siguiente = null;
  await abrirHoja({
    titulo: 'Regalo', izq: 'Cerrar', sinGuardar: true,
    cuerpo: '<p class="m-subtitulo" style="padding:0 0 var(--m-space-3);margin:0;font-weight:600;color:var(--m-label)">' + esc(it.Persona) + (it.Idea ? ' · ' + esc(it.Idea) : '') + '</p><dl class="m-detalle">' +
      '<div><dt>Estimado</dt><dd class="m-num">' + dinero(it.Estimado) + '</dd></div><div><dt>Gastado</dt><dd class="m-num">' + dinero(it.Real) + '</dd></div><div><dt>Diferencia</dt><dd class="m-num ' + (it.Diferencia < 0 ? 'm-negativo' : '') + '">' + dinero(it.Diferencia) + '</dd></div></dl>' +
      '<button type="button" class="m-btn m-btn-primary" style="width:100%;margin-bottom:var(--m-space-2)" data-hoja-acc="comprar">Registrar la compra</button>' +
      '<button type="button" class="m-btn m-btn-secondary" style="width:100%" data-hoja-acc="editar">Editar</button>' +
      '<button type="button" class="m-accion-peligro" data-hoja-acc="quitar">Quitar el regalo</button>',
    extra: {
      comprar: () => { siguiente = () => abrirCompraRegalo(it); return Promise.resolve(); },
      editar: () => { siguiente = () => abrirRegalo(it); return Promise.resolve(); },
      quitar: () => api('deleteRegalo', id).then(data => { aplicarRegalos(data); render(); aviso('Regalo quitado'); })
    }
  });
  if (siguiente) siguiente();
}

async function abrirCompraRegalo(it) {
  const grupos = opcionesDestino(false);
  const pref = grupos.map(g => g.opciones.find(x => /regalo/i.test(x[1]))).find(Boolean);
  await abrirHoja({
    titulo: 'Compra de regalo',
    cuerpo: '<form novalidate data-form="compra-regalo"><p class="m-hoja-mensaje">Para ' + esc(it.Persona) + (it.Idea ? ' · ' + esc(it.Idea) : '') + '. Se registra como un gasto.</p>' +
      htmlCampo({ k: 'Valor', label: 'Cuánto costó', tipo: 'dinero', requerido: true }, it.Estimado - it.Real > 0 ? it.Estimado - it.Real : '', {}) +
      '<div class="m-campo"><label class="m-label" for="f-Bolsillo">Sale de</label><select class="m-input" id="f-Bolsillo">' + grupos.map(g => '<optgroup label="' + esc(g.grupo) + '">' + g.opciones.map(x => '<option value="' + esc(x[0]) + '"' + (pref && x[0] === pref[0] ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') + '</optgroup>').join('') + '</select></div>' +
      '<div class="m-campo"><label class="m-label" for="f-Fecha">Fecha</label><input class="m-input" id="f-Fecha" type="date" max="' + App.boot.hoy + '" value="' + App.boot.hoy + '"></div><button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => { activarEcoDinero(raiz); $('#f-Valor', raiz).focus(); },
    alGuardar: async raiz => {
      const v = leerDinero($('#f-Valor', raiz).value);
      if (v === '' || isNaN(v)) throw new Error('Escribe cuánto costó.');
      const res = await api('payRegalo', it.ID_Regalo, v, $('#f-Bolsillo', raiz).value, $('#f-Fecha', raiz).value);
      aplicarEscritura(res); aplicarRegalos(res.regalos); render(); aviso('Compra registrada');
    }
  });
}

        d.listo ? 'Todo lo necesario está listo.' : 'Completa lo que falta para poder iniciar.') +

async function abrirPagarCobro(s) {
  const campos = [{ k: 'Valor', label: s.Tipo === 'Servicio' ? 'Cuánto pagaste' : 'Valor', tipo: 'dinero', requerido: true }];
  const medio = s.ID_Tarjeta ? 'T:' + s.ID_Tarjeta : (s.ID_Bolsillo ? 'B:' + s.ID_Bolsillo : '');
  const grupos = opcionesDestino(false);
  const delBolsillo = [].concat.apply([], grupos.map(g => g.opciones.map(o => ['B:' + o[0], o[1] + ' · ' + g.grupo.split(' · ').pop()])));
  const opts = [{ grupo: 'Desde un bolsillo', opciones: delBolsillo }]
    .concat(activos('Tarjetas').length ? [{ grupo: 'Con una tarjeta', opciones: activos('Tarjetas').map(t => ['T:' + t.ID_Tarjeta, t.Nombre]) }] : []);
  await abrirHoja({
    titulo: 'Pagar ' + s.Nombre,
    cuerpo: '<form novalidate data-form="pago-cobro">' + htmlCampo(campos[0], s.Valor, {}) +
      '<div class="m-campo"><label class="m-label" for="f-Medio">Con qué lo pagas</label><select class="m-input" id="f-Medio">' +
      (medio ? '' : '<option value="" disabled selected>Elegir…</option>') +
      opts.map(g => '<optgroup label="' + esc(g.grupo) + '">' + g.opciones.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === medio ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</optgroup>').join('') + '</select></div>' +
      '<div class="m-campo"><label class="m-label" for="f-Fecha">Fecha</label><input class="m-input" id="f-Fecha" type="date" max="' + App.boot.hoy + '" value="' + App.boot.hoy + '"></div>' +
      '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => { activarEcoDinero(raiz); $('#f-Valor', raiz).focus(); },
    alGuardar: async raiz => {
      const v = leerDinero($('#f-Valor', raiz).value);
      if (v === '' || isNaN(v)) throw new Error('Escribe el valor.');
      const m = $('#f-Medio', raiz).value;
      if (!m) throw new Error('Elige con qué lo pagas.');
      const datos = { Valor: v, Fecha: $('#f-Fecha', raiz).value, ID_Bolsillo: m[0] === 'B' ? m.slice(2) : '', ID_Tarjeta: m[0] === 'T' ? m.slice(2) : '' };
      const res = await api('paySuscripcion', s.ID_Suscripcion, datos);
      aplicarEscritura(res); App.pag.data = res.suscripciones; render();
      aviso('Pago registrado · próximo cobro ' + res.proximo, {
        deshacer: async () => {
          try {
            const u = await api('undoPagoSuscripcion', s.ID_Suscripcion, res.anterior, res.idMov, res.idCompra);
            aplicarEscritura(u); App.pag.data = u.suscripciones; render(); aviso('Pago deshecho');
          } catch (e) { aviso(e.message, true); }
        }
      });
    }
  });
}

const CLAVE_ASIST_OMITIDO = 'moni.asistente.omitido';
function asistenteOmitido() { try { return localStorage.getItem(CLAVE_ASIST_OMITIDO) === '1'; } catch (e) { return false; } }
function recordarAsistenteOmitido(v) { try { if (v) localStorage.setItem(CLAVE_ASIST_OMITIDO, '1'); else localStorage.removeItem(CLAVE_ASIST_OMITIDO); } catch (e) {} }

/** activo: el asistente ya arrancó en esta sesión (sigue visible aunque se complete lo obligatorio, hasta el cierre). */
App.asist = { activo: false, paso: null, omitido: asistenteOmitido(), ultimo: {} };

function asistenteVisible() {
  const e = App.boot && App.boot.estado;
  if (!e || !e.instalado || !e.pasos) return false;
  if (App.asist.omitido || esVerdad(cfg('Datos_Demo')) || esVerdad(cfg('Arranque_Hecho'))) return false;
  if (!App.asist.activo && !e.completo) App.asist.activo = true;
  return App.asist.activo;
}

/** Sin nada hecho: bienvenida. Con avance (por ejemplo, de otra sesión): el primer paso pendiente. */
function pasoInicialAsist() {
  const pasos = App.boot.estado.pasos;
  if (pasos.every(p => !p.hecho)) return 'bienvenida';
  const pendiente = pasos.find(p => !p.hecho && !p.opcional) || pasos.find(p => !p.hecho);
  return pendiente ? pendiente.id : 'fin';
}

function aplicaPasoAsist(id) {
  if (id === 'bolsillos') return activos('Cuentas').some(c => esVerdad(c.Permite_Bolsillos)); // sin bolsillos no hay qué repartir
  return true;
}

function moverAsist(delta) {
  let i = ORDEN_ASIST.indexOf(App.asist.paso);
  do { i += delta; } while (i > 0 && i < ORDEN_ASIST.length - 1 && !aplicaPasoAsist(ORDEN_ASIST[i]));
  App.asist.paso = ORDEN_ASIST[Math.max(0, Math.min(ORDEN_ASIST.length - 1, i))];
  render(true);
}

function terminarAsistente(omitido) {
  App.asist.activo = false; App.asist.paso = null;
  if (omitido) { App.asist.omitido = true; recordarAsistenteOmitido(true); }
  App.pila = ['inicio'];
  render(true);
}

const camposAsist = tabla => CAT[tabla].campos.filter(c => CAMPOS_ASIST[tabla].indexOf(c.k) !== -1);
const listaAsist = tabla => activos(tabla).filter(f => !esVerdad(f.Es_Interno));

function valorInicialAsist(c) {
  const preseleccion = (lista, idCol, recordado) => lista.some(f => f[idCol] === recordado) ? recordado : (lista.length === 1 ? lista[0][idCol] : '');
  if (c.k === 'ID_Banco') return preseleccion(activos('Bancos'), 'ID_Banco', App.asist.ultimo.ID_Banco);
  if (c.k === 'ID_Cuenta') return preseleccion(activos('Cuentas').filter(x => esVerdad(x.Permite_Bolsillos)), 'ID_Cuenta', App.asist.ultimo.ID_Cuenta);
  return c.defecto !== undefined ? c.defecto : '';
}

/**
 * Guarda lo escrito en un paso de catálogo. Devuelve true si guardó algo; false si el formulario estaba
 * vacío pero ya había uno guardado (se puede seguir). Valida igual que el formulario de Ajustes.
 */
async function guardarCatalogoAsist(paso, f, otro) {
  const p = PASOS_ASIST.find(x => x.id === paso);
  const campos = camposAsist(p.tabla);
  const v = leerFormulario(f, campos);
  if (!v.Nombre) {
    if (otro) throw new Error('Escribe el nombre para agregar ' + p.uno + ' más.');
    if (!listaAsist(p.tabla).length) throw new Error('Agrega al menos ' + p.uno + ' para continuar.');
    return false;
  }
  campos.forEach(c => {
    if (c.visible && !c.visible(v, {})) delete v[c.k];
    if (c.tipo === 'dinero' && typeof v[c.k] === 'number' && isNaN(v[c.k])) throw new Error(c.label + ' debe ser un número.');
  });
  const falta = campos.find(c => c.requerido && (!c.visible || c.visible(v, {})) && (v[c.k] === '' || v[c.k] === undefined));
  if (falta) throw new Error(falta.label + ' es obligatorio.');

  const envio = Object.assign({}, v);
  Object.keys(envio).forEach(k => { if (envio[k] === '') delete envio[k]; });
  await api('saveCatalogo', p.tabla, envio, {});
  if (v.ID_Banco) App.asist.ultimo.ID_Banco = v.ID_Banco;
  if (v.ID_Cuenta) App.asist.ultimo.ID_Cuenta = v.ID_Cuenta;
  return true;
}

/** Continuar (o "agregar otro") en el paso actual: guarda, actualiza lo que Moni sabe y avanza. */
async function enviarPasoAsist(f, otro) {
  const paso = App.asist.paso;
  const caja = $('#asist-error');
  const botones = $$('.m-asist button');
  caja.hidden = true;
  botones.forEach(b => { b.disabled = true; });
  try {
    if (paso === 'perfil') {
      const nombre = $('#asist-nombre', f).value.trim();
      if (!nombre) throw new Error('Escribe tu nombre para continuar.');
      if (nombre !== cfg('Nombre_Usuario')) await api('saveConfigParam', 'Nombre_Usuario', nombre);
    } else {
      await guardarCatalogoAsist(paso, f, otro);
    }
    await refrescar();
    if (otro) {
      render();
      aviso('Se agregó ' + CAT[PASOS_ASIST.find(x => x.id === paso).tabla].singular);
      const nombre = $('#' + idCampo('Nombre'));
      if (nombre) nombre.focus();
    } else {
      moverAsist(1);
    }
  } catch (e) {
    caja.textContent = e.message; caja.hidden = false;
    botones.forEach(b => { b.disabled = false; });
    caja.scrollIntoView({ block: 'nearest' });
  }
}

    try { const r = await api('makeRespaldo'); App.resp.data = r.estado; render(); aviso('Respaldo creado'); }
    catch (e) { aviso(e.message, true); el.disabled = false; el.textContent = 'Crear un respaldo ahora'; }
  },
  'recargar-deudas': () => { App.deudas.error = null; App.deudas.data = null; render(); },
  'recargar-tar': () => { App.tar.error = null; App.tar.data = null; render(); },
  'recargar-cre': () => { App.cre.error = null; App.cre.data = null; render(); },
  'abrir-compra': () => abrirCompra(App.tar.id),
  compra: el => abrirDetalleCompra(el.dataset.id),
  'pagar-extracto': () => abrirPagoExtracto(),
  'anular-pago-extracto': async () => {
    const ok = await confirmar({ titulo: 'Anular el pago', accion: 'Anular', mensaje: 'Se devuelve el dinero a la reserva y a tu bolsillo personal, y las compras quedan pendientes otra vez.' });
    if (ok && App.tar.data && App.tar.data.extracto) anularPagoExtractoYAvisar(App.tar.data.extracto.ID_Extracto);
  },
  'editar-tarjeta': () => { abrirFormulario('Tarjetas', App.tar.id).then(() => { App.tar.data = null; App.deudas.data = null; render(); }); },
  'nuevo-credito': () => abrirNuevoCredito(),
  'pagar-credito': () => abrirPagoCredito(),
  'editar-credito': () => abrirEditarCredito(),
  'pago-credito': async el => {
    const ok = await confirmar({ titulo: 'Anular el pago', accion: 'Anular', mensaje: 'Se devuelve el dinero al bolsillo y la cuota vuelve a quedar pendiente. Si el pago incluía un abono, el plazo vuelve al anterior.' });
    if (ok) anularPagoCreditoYAvisar(el.dataset.id);
  },
  'anular-credito': async () => {
    const ok = await confirmar({ titulo: 'Anular el crédito', accion: 'Anular', mensaje: 'Se anula el crédito y el dinero que salió del ahorro vuelve a él.' });
    if (!ok) return;
    try {
      const res = await api('cancelCredito', App.cre.id);
      aplicarEscritura(res); App.boot.creditos = (App.boot.creditos || []).filter(x => x.ID_Credito !== App.cre.id);
      aviso('Crédito anulado'); volver();
    } catch (e) { aviso(e.message, true); }
  },
  'recargar-ppto': () => { App.ppto.error = null; App.ppto.data = null; render(); },
  'recargar-nom': () => { App.nom.error = null; App.nom.data = null; render(); },
  'generar-ppto': async el => {
    el.disabled = true; el.textContent = 'Generando…';
    try {
      const sel = $('#ppto-esc');
      const data = await api('generarPresupuesto', App.ppto.mes, sel ? sel.value : '', false);
      aplicarPresupuesto(data); render(); aviso('Presupuesto generado');
    } catch (e) { aviso(e.message, true); el.disabled = false; el.textContent = 'Generar el presupuesto'; }
  },
  renglon: el => abrirRenglon(el.dataset.id),
  'nuevo-renglon': () => abrirRenglonMes(null),
  distribuir: () => abrirDistribucion(App.ppto.mes),
  'distribuir-nomina': () => abrirDistribucion(App.nom.mes),
  'registrar-nomina': () => abrirRegistrarNomina(),
  'anular-nomina': async () => {
    const ok = await confirmar({ titulo: 'Anular nómina', accion: 'Anular', mensaje: 'Se anula el ingreso de la nómina de este mes. Si ya la repartiste, esos traslados no se deshacen solos.' });
    if (ok) anularNominaYAvisar();
  },
  'nuevo-plantilla': () => abrirFormulario('Presupuesto_Plantilla', null, { ID_Escenario: App.plantillaEsc }),
  'editar-plantilla': el => abrirFormulario('Presupuesto_Plantilla', el.dataset.id),
  registrar: el => abrirRegistrar({ idBolsillo: el.dataset.bolsillo }),
  mover: el => abrirRegistrar({ tipo: 'Mover', idBolsillo: el.dataset.bolsillo }),
  mov: el => abrirDetalleMov(el.dataset.id),
  cuadrar: el => abrirCuadre(el.dataset.cuenta),
  'recargar-det': () => { App.det.error = null; App.det.data = null; render(); },
  'recargar-mov': () => { App.mov.error = null; App.mov.data = null; render(); },
  mes: el => cambiarMes(el.dataset.vista, Number(el.dataset.delta)),
  'editar-bolsillo': el => {
    const inf = infoBolsillo(el.dataset.id);
    if (!inf) return;
    if (inf.b.Es_Interno) abrirFormulario('Cuentas', inf.c.ID_Cuenta); else abrirFormulario('Bolsillos', inf.b.ID_Bolsillo);
  },
  tab: el => navegar(el.dataset.ruta),
  ir: el => navegar(el.dataset.ruta),
  volver: () => volver(),
  recargar: () => { App.error = null; $('#vista').innerHTML = '<div class="m-cargando">Cargando…</div>'; cargar(); },
  nuevo: el => abrirFormulario(el.dataset.tabla),
  editar: el => abrirFormulario(el.dataset.tabla, el.dataset.id),
  instalar: async el => {
    el.disabled = true;
    try {
      const r = await api('instalarBaseDatos');
      await refrescar(); render();
      aviso(r.ok ? 'Base de datos lista' : 'Hay tablas con encabezados distintos; revisa el diagnóstico', !r.ok);
    } catch (e) { aviso(e.message, true); el.disabled = false; }
  },
  'sembrar-demo': async el => {
    el.disabled = true;
    try { await api('seedDemo'); await refrescar(); render(); aviso('Datos de demostración creados'); }
    catch (e) { aviso(e.message, true); el.disabled = false; }
  },
  'limpiar-demo': async () => {
    const ok = await confirmar({ titulo: 'Borrar demostración', accion: 'Borrar', mensaje: 'Se borrarán solo los datos de demostración. Lo que hayas registrado de verdad no se toca.' });
    if (!ok) return;
    try { await api('clearDemo'); await refrescar(); render(); aviso('Datos de demostración borrados'); }
    catch (e) { aviso(e.message, true); }
  }
};

(function () {
  const dlg = $('#hoja');
  dlg.addEventListener('click', ev => { if (hojaActual) hojaActual.alClic(ev); });
  dlg.addEventListener('submit', ev => { if (hojaActual) hojaActual.alEnviar(ev); });
  dlg.addEventListener('close', () => { if (hojaActual) hojaActual.finalizar(); }); // Esc o cierre nativo
})();

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-acc]');
  if (!el || el.closest('dialog')) return;
  const fn = ACCIONES[el.dataset.acc];
  if (fn) { ev.preventDefault(); fn(el); }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.accCambio === 'inactivos') {
    App.inactivos[t.dataset.tabla] = t.checked;
    render();
    const nuevo = $('#ver-inactivos'); if (nuevo) nuevo.focus();
    return;
  }
  if (t.dataset.accCambio === 'pagado') {
    try { aplicarPresupuesto(await api('payRenglonMes', t.dataset.id, t.checked)); render(); }
    catch (e) { t.checked = !t.checked; aviso(e.message, true); }
    return;
  }
  if (t.name === 'log-filtro') { App.log.soloErrores = t.value === 'errores'; cargarRegistro(); return; }
  if (t.dataset.accCambio === 'plantilla-esc') { App.plantillaEsc = t.value; render(); return; }
  if (t.id === 'reg-anio') { App.reg.anio = Number(t.value); App.reg.data = null; render(); return; }
  if (t.id === 'anual-anio') { App.anual.anio = Number(t.value); App.anual.data = null; render(); return; }
  if (t.dataset.accCambio === 'resp-auto') {
    try { App.resp.data = await api('setRespaldoAuto', t.checked); aviso(t.checked ? 'Copias automáticas activadas' : 'Copias automáticas desactivadas'); }
    catch (e) { t.checked = !t.checked; aviso(e.message, true); }
    return;
  }
  if (t.id === 'tar-mes') { App.tar.mes = t.value; App.tar.data = null; render(); return; }
  if (t.id === 'nom-esc') { App.nom.idEsc = t.value; App.nom.data = null; render(); return; }
  if (t.dataset.accCambio === 'anulados') {
    const st = t.dataset.vista === 'det' ? App.det : App.mov;
    st.anulados = t.checked; st.data = null;
    render();
    const nuevo = $('#ver-anulados'); if (nuevo) nuevo.focus();
    return;
  }
  if (t.name === 'tema' || t.name === 'acento') {
    const clave = t.name === 'tema' ? 'Tema' : 'Color_Acento';
    const anterior = App.boot.config[clave];
    App.boot.config[clave] = t.value;
    aplicarApariencia();
    try { await api('saveConfigParam', clave, t.value); }
    catch (e) { App.boot.config[clave] = anterior; aplicarApariencia(); render(); aviso(e.message, true); return; }
    if (t.name === 'tema') {
      // Los colores de las muestras dependen del tema: se vuelve a pintar y se devuelve el foco.
      render();
      const marcado = $('input[name="tema"]:checked'); if (marcado) marcado.focus();
    }
  }
});

document.addEventListener('submit', async ev => {
  const f = ev.target;
  if (f.dataset.form === 'asistente') { ev.preventDefault(); enviarPasoAsist(f, false); return; }
  if (f.dataset.form === 'parametros' || f.dataset.form === 'respaldos') {
    ev.preventDefault();
    const caja = $('#param-error', f), boton = $('button[type=submit]', f);
    caja.hidden = true; boton.disabled = true;
    const mapa = {};
    $$('[data-param]', f).forEach(i => {
      let v = i.value.trim();
      if (i.dataset.pct) { const n = Number(v.replace(',', '.')); v = isFinite(n) && v !== '' ? String(Math.round(n * 100) / 10000) : v; }
      else if (i.getAttribute('inputmode') === 'decimal') { v = String(leerDinero(v)); }
      mapa[i.dataset.param] = v;
    });
    try {
      const r = await api('saveConfigParams', mapa);
      Object.keys(r).forEach(k => { App.boot.config[k] = r[k]; });
      if (f.dataset.form === 'respaldos') App.resp.data = null;
      aviso('Parámetros guardados'); render();
    } catch (e) { caja.textContent = e.message; caja.hidden = false; }
    boton.disabled = false;
    return;
  }
  if (f.dataset.form !== 'perfil') return;
  ev.preventDefault();
  const boton = $('button[type=submit]', f);
  boton.disabled = true;
  try {
    await api('saveConfigParam', 'Nombre_Usuario', $('#f-nombre', f).value);
    await refrescar();
    aviso('Guardado');
    render();
  } catch (e) { aviso(e.message, true); }
  boton.disabled = false;
});

document.addEventListener('input', ev => {
  if (ev.target.id !== 'buscar-mov') return;
  App.mov.texto = ev.target.value;
  const caja = $('#lista-mov');
  if (caja) caja.innerHTML = htmlListaMov(filtrarMov(App.mov.data ? App.mov.data.items : []), false);
});

window.addEventListener('scroll', () => { $('#barra').classList.toggle('m-escrolado', window.scrollY > 40); }, { passive: true });

cargar();
</script>
