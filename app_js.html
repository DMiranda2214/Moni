<script>
'use strict';
/* ==========================================================================
   Moni — aplicación (Fase 1): inicio, bolsillos, tarjetas y Ajustes con todos los catálogos.
   Sin librerías. Cada pantalla es una función que devuelve su HTML; los eventos se delegan
   con atributos data-acc. Todo texto dinámico pasa por esc().
   ========================================================================== */

// <ACENTOS>
const ACENTOS = {
  rosa:    { nombre: 'Rosa',    claro: '#CC2B65', oscuro: '#FF7A9E' },
  azul:    { nombre: 'Azul',    claro: '#0B63CE', oscuro: '#64A8FF' },
  verde:   { nombre: 'Verde',   claro: '#17744A', oscuro: '#4CD08A' },
  morado:  { nombre: 'Morado',  claro: '#7B3FCB', oscuro: '#B794F6' },
  naranja: { nombre: 'Naranja', claro: '#A4510A', oscuro: '#FFA05A' },
  grafito: { nombre: 'Grafito', claro: '#3A3A3C', oscuro: '#E5E5EA' }
};
// </ACENTOS>

const TABS = [
  { id: 'inicio', etiqueta: 'Inicio', icono: 'inicio' },
  { id: 'bolsillos', etiqueta: 'Bolsillos', icono: 'bolsillos' },
  { id: 'presupuesto', etiqueta: 'Presupuesto', icono: 'presupuesto' },
  { id: 'tarjetas', etiqueta: 'Deudas', icono: 'tarjetas' },
  { id: 'mas', etiqueta: 'Más', icono: 'mas' }
];

const ETIQUETAS = {
  TipoCuenta: { Billetera: 'Billetera', Debito: 'Débito', Ahorro: 'Ahorro', Otra: 'Otra' },
  RolBolsillo: { Operativo: 'Operativo', Fondo: 'Fondo', Reserva_Tarjeta: 'Reserva de tarjeta', General: 'General' },
  RolPersona: { Titular: 'Titular', Familiar: 'Familiar', Otro: 'Otro' },
  TipoCategoria: { Gasto: 'Gasto', Ingreso: 'Ingreso', Transferencia: 'Transferencia', Ajuste: 'Ajuste' },
  PeriodoCobro: { Mensual: 'Cada mes', Bimestral: 'Cada 2 meses', Trimestral: 'Cada 3 meses', Semestral: 'Cada 6 meses', Anual: 'Cada año' },
  Tema: { Automatico: 'Automático', Claro: 'Claro', Oscuro: 'Oscuro' }
};

const App = { boot: null, pila: ['inicio'], inactivos: {}, error: null };

// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------

function esc(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function ico(nombre, extra) {
  return '<svg class="m-icon ' + (extra || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + nombre + '"/></svg>';
}

let _formato = null;
function dinero(n) {
  if (!_formato) {
    const moneda = (App.boot && App.boot.config && App.boot.config.Moneda) || 'COP';
    _formato = new Intl.NumberFormat('es-CO', { style: 'currency', currency: moneda, maximumFractionDigits: 0 });
  }
  return _formato.format(Number(n) || 0).replace(/ /g, ' ');
}

/** Convierte lo que se escribe ("1.250.000,50") a número, con la convención de es-CO. */
function leerDinero(texto) {
  const t = String(texto || '').replace(/[^\d,.\-]/g, '');
  if (t === '' || t === '-') return '';
  const n = Number(t.replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? n : NaN;
}

function claseSaldo(n) { return Number(n) < 0 ? 'm-negativo' : ''; }
const etiqueta = (grupo, v) => (ETIQUETAS[grupo] && ETIQUETAS[grupo][v]) || v || '';
const $ = (sel, raiz) => (raiz || document).querySelector(sel);
const $$ = (sel, raiz) => Array.prototype.slice.call((raiz || document).querySelectorAll(sel));

let _pendientes = 0;
let _temporizadorProgreso = null;
/** Barra fina arriba: aparece solo si una petición tarda más de 400 ms. */
function progreso(delta) {
  _pendientes = Math.max(0, _pendientes + delta);
  const barra = $('#progreso');
  if (!barra) return;
  if (_pendientes > 0) {
    if (!_temporizadorProgreso) _temporizadorProgreso = setTimeout(() => { barra.classList.add('m-activo'); barra.setAttribute('aria-hidden', 'false'); }, 400);
  } else {
    clearTimeout(_temporizadorProgreso); _temporizadorProgreso = null;
    barra.classList.remove('m-activo'); barra.setAttribute('aria-hidden', 'true');
  }
}

/** Mensajes técnicos de Google o de la red, dichos en claro. El detalle original queda en consola. */
function mensajeLlano(e) {
  const crudo = (e && e.message) || String(e || '');
  if (!navigator.onLine || /failed to fetch|networkerror|network error|load failed/i.test(crudo)) return 'Parece que no hay conexión. Revisa tu internet y vuelve a intentarlo.';
  if (/not authorized|authorization|sign in|login|permission|accounts\.google/i.test(crudo)) return 'Tu sesión de Google venció. Recarga la página para volver a entrar.';
  if (/lock|bloqueo|another process|timed out waiting/i.test(crudo)) return 'Moni está guardando otro cambio. Espera un momento y reintenta.';
  if (/exceeded maximum execution time|tardó demasiado|time limit/i.test(crudo)) return 'La operación tardó demasiado. Reintenta; si se repite, usa Respaldos y avisa.';
  if (/service invoked too many times|quota/i.test(crudo)) return 'Google pidió una pausa por exceso de uso. Espera unos minutos.';
  return crudo || 'Ocurrió un error.';
}

/** Tiempos de las últimas llamadas (cliente = lo que ve el usuario; servidor = lo que tardó Apps Script). */
const TIEMPOS = [];
function anotarTiempo(fn, t0, ms, ok) {
  TIEMPOS.push({ fn: fn, cliente: Math.round(performance.now() - t0), servidor: typeof ms === 'number' ? ms : null, ok: ok });
  if (TIEMPOS.length > 100) TIEMPOS.shift();
}

function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) {
      reject(new Error('Esta pantalla debe abrirse desde la aplicación publicada.'));
      return;
    }
    progreso(1);
    const t0 = performance.now();
    // Si Google no responde en 45 s, se avisa en vez de dejar la pantalla "pensando" para siempre.
    let terminada = false;
    const reloj = setTimeout(() => {
      if (terminada) return;
      terminada = true; progreso(-1); anotarTiempo(fn, t0, null, false);
      reject(new Error('Está tardando demasiado en responder. Reintenta; si se repite, revisa tu conexión.'));
    }, 45000);
    google.script.run
      .withSuccessHandler(r => {
        if (terminada) return;
        terminada = true; clearTimeout(reloj);
        progreso(-1); anotarTiempo(fn, t0, r && r.ms, !!(r && r.ok));
        (r && r.ok) ? resolve(r.data) : reject(new Error((r && r.error && r.error.message) || 'Ocurrió un error.'));
      })
      .withFailureHandler(e => {
        if (terminada) return;
        terminada = true; clearTimeout(reloj);
        progreso(-1); anotarTiempo(fn, t0, null, false);
        if (window.console) console.warn('Fallo de ' + fn + ':', e);
        reject(new Error(mensajeLlano(e)));
      })
      [fn].apply(google.script.run, args);
  });
}

/**
 * Errores del navegador al registro del servidor (Ajustes → Registro de errores), con tope por sesión
 * para que un fallo repetido no inunde el registro.
 */
let _erroresReportados = 0;
function reportarErrorCliente(mensaje, detalle) {
  if (_erroresReportados >= 5) return;
  _erroresReportados++;
  try { api('logClientError', String(mensaje).slice(0, 400), String(detalle || '').slice(0, 1800)).catch(() => {}); } catch (e) {}
}
window.addEventListener('error', ev => reportarErrorCliente(ev.message, (ev.filename || '') + ':' + ev.lineno + ':' + ev.colno + '\n' + ((ev.error && ev.error.stack) || '')));
window.addEventListener('unhandledrejection', ev => {
  const r = ev.reason;
  reportarErrorCliente('Promesa rechazada: ' + ((r && r.message) || r), (r && r.stack) || '');
});

/**
 * Aviso breve. `opc` puede ser `true` (error) o { error, deshacer }.
 * Con `deshacer` (una función) el aviso ofrece "Deshacer" durante 8 segundos.
 */
function aviso(mensaje, opc) {
  const o = (opc && typeof opc === 'object') ? opc : { error: !!opc };
  const caja = $('#avisos');
  const el = document.createElement('div');
  el.className = 'm-aviso' + (o.error ? ' m-error' : '');
  const txt = document.createElement('span');
  txt.textContent = mensaje;
  el.appendChild(txt);
  if (o.deshacer) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'm-aviso-accion'; b.textContent = 'Deshacer';
    b.addEventListener('click', () => { el.remove(); o.deshacer(); });
    el.appendChild(b);
  }
  if (o.error) {
    el.setAttribute('role', 'alert');
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'm-aviso-accion'; x.textContent = 'Cerrar';
    x.addEventListener('click', () => el.remove());
    el.appendChild(x);
  }
  caja.appendChild(el);
  // Más texto, más tiempo para leerlo (unos 60 ms por carácter, con mínimo y máximo).
  const lectura = Math.min(12000, Math.max(o.error ? 6000 : 3000, mensaje.length * 60));
  setTimeout(() => el.remove(), o.deshacer ? Math.max(8000, lectura) : lectura);
}

// ---------------------------------------------------------------------------
// Apariencia (tema y color de acento)
// ---------------------------------------------------------------------------

function aplicarApariencia() {
  const cfg = (App.boot && App.boot.config) || {};
  const tema = cfg.Tema || 'Automatico';
  const raiz = document.documentElement;
  raiz.removeAttribute('data-theme');
  if (tema === 'Claro') raiz.setAttribute('data-theme', 'light');
  if (tema === 'Oscuro') raiz.setAttribute('data-theme', 'dark');

  const oscuro = tema === 'Oscuro' || (tema === 'Automatico' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const acento = ACENTOS[cfg.Color_Acento] || ACENTOS.rosa;
  const hex = oscuro ? acento.oscuro : acento.claro;
  const n = parseInt(hex.slice(1), 16);
  const rgb = ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
  raiz.style.setProperty('--m-tint', hex);
  raiz.style.setProperty('--m-on-tint', oscuro ? '#1C1C1E' : '#FFFFFF');
  raiz.style.setProperty('--m-tint-soft', 'rgba(' + rgb + ', ' + (oscuro ? 0.16 : 0.10) + ')');
}
if (window.matchMedia) {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarApariencia);
}

// ---------------------------------------------------------------------------
// Datos
// ---------------------------------------------------------------------------

async function cargar() {
  try {
    App.boot = await api('getBootstrap');
    App.error = null;
  } catch (e) {
    App.error = e.message;
  }
  aplicarApariencia();
  render();
}

async function refrescar() {
  App.boot = await api('getBootstrap');
  App.pag.data = null; App.proximosViejos = false;
  aplicarApariencia();
}

const cat = tabla => (App.boot && App.boot.catalogos && App.boot.catalogos[tabla]) || [];
const activos = tabla => cat(tabla).filter(f => esVerdad(f.Activo) || f.Activo === '' || f.Activo === undefined);
const esVerdad = v => v === true || String(v).toUpperCase() === 'TRUE';
const porId = (tabla, idCol, id) => cat(tabla).find(f => f[idCol] === id);
const cfg = clave => (App.boot && App.boot.config && App.boot.config[clave]) || '';

function saldoBolsillo(id) {
  const cuentas = (App.boot.saldos && App.boot.saldos.cuentas) || [];
  for (let i = 0; i < cuentas.length; i++) {
    const b = cuentas[i].bolsillos.find(x => x.ID_Bolsillo === id);
    if (b) return b.Saldo;
  }
  return 0;
}
function saldoCuenta(id) {
  const c = ((App.boot.saldos && App.boot.saldos.cuentas) || []).find(x => x.ID_Cuenta === id);
  return c ? c.Saldo : 0;
}

// ---------------------------------------------------------------------------
// Estado de movimientos: una escritura devuelve lo que cambió y aquí se aplica,
// sin volver a pedir todo al servidor.
// ---------------------------------------------------------------------------

App.det = { id: null, mes: null, anulados: false, data: null, cargando: false, error: null };
App.mov = { mes: null, anulados: false, texto: '', data: null, cargando: false, error: null };

function mesMas(mes, d) {
  const p = mes.split('-').map(Number);
  const f = new Date(p[0], p[1] - 1 + d, 1);
  return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0');
}
const capitalizar = t => t.charAt(0).toUpperCase() + t.slice(1);
function mesTexto(mes) {
  const p = mes.split('-').map(Number);
  return capitalizar(new Date(p[0], p[1] - 1, 1).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' }));
}
function isoDe(fecha) {
  return fecha.getFullYear() + '-' + String(fecha.getMonth() + 1).padStart(2, '0') + '-' + String(fecha.getDate()).padStart(2, '0');
}
function etiquetaDia(iso) {
  const hoy = App.boot.hoy;
  if (iso === hoy) return 'Hoy';
  const h = hoy.split('-').map(Number);
  if (iso === isoDe(new Date(h[0], h[1] - 1, h[2] - 1))) return 'Ayer';
  const p = iso.split('-').map(Number);
  return capitalizar(new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' }));
}

function aplicarSaldos(s) {
  const sal = App.boot && App.boot.saldos;
  if (!s || !sal) return;
  sal.cuentas.forEach(c => {
    const n = s.cuentas[c.ID_Cuenta];
    if (n) { c.Saldo = n.Saldo; c.Saldo_Real = n.Saldo_Real; c.Diferencia = n.Diferencia; c.Fecha_Saldo_Real = n.Fecha_Saldo_Real; }
    c.bolsillos.forEach(b => { if (s.bolsillos[b.ID_Bolsillo] !== undefined) b.Saldo = s.bolsillos[b.ID_Bolsillo]; });
  });
  sal.disponible = s.disponible; sal.ahorro = s.ahorro; sal.total = s.total;
}

function totalesDe(lista) {
  let ingresos = 0, gastos = 0;
  lista.forEach(i => { if (i.Anulado || i.esTransferencia) return; if (i.Valor >= 0) ingresos += i.Valor; else gastos += -i.Valor; });
  return { ingresos: ingresos, gastos: gastos, neto: ingresos - gastos };
}

function fusionarItems(lista, items, verAnulados, enRango) {
  items.forEach(it => {
    const i = lista.findIndex(x => x.ID_Mov === it.ID_Mov);
    if (it.Anulado && !verAnulados) { if (i >= 0) lista.splice(i, 1); return; }
    if (i >= 0) lista[i] = it; else if (enRango(it)) lista.unshift(it);
  });
  lista.sort((a, b) => (a.Fecha < b.Fecha ? 1 : a.Fecha > b.Fecha ? -1 : 0));
}

/** Aplica el resultado de una escritura: saldos, últimos movimientos y la lista que se está viendo. */
function aplicarEscritura(res) {
  aplicarSaldos(res.saldos);
  if (res.ultimos) App.boot.ultimos = res.ultimos;
  if (res.presupuesto) aplicarPresupuesto(res.presupuesto);
  App.deudas.data = null; App.tar.data = null; App.cre.data = null; // se vuelven a pedir si hace falta
  App.proximosViejos = true; App.pag.data = null;
  App.arr.data = null; App.aho.data = null; App.ahoC.data = null; App.reg.data = null; App.anual.data = null;
  const ruta = rutaActual();

  const d = App.det;
  if (d.data && ruta === 'bolsillo/' + d.id) {
    if (res.saldos.bolsillos[d.id] !== undefined) d.data.bolsillo.Saldo = res.saldos.bolsillos[d.id];
    fusionarItems(d.data.movimientos, res.items, d.anulados, i => i.Fecha.slice(0, 7) === d.data.mes);
    d.data.totales = totalesDe(d.data.movimientos);
  } else { d.data = null; }

  const m = App.mov;
  if (m.data && ruta === 'movimientos') {
    fusionarItems(m.data.items, res.items, m.anulados, i => i.Fecha.slice(0, 7) === m.data.mes);
    m.data.totales = totalesDe(m.data.items);
  } else { m.data = null; }
}

const vistaActual = () => { const r = rutaActual(); return r.indexOf('bolsillo/') === 0 ? { idBolsillo: r.slice(9) } : undefined; };

function infoBolsillo(id) {
  const cuentas = (App.boot.saldos && App.boot.saldos.cuentas) || [];
  for (let i = 0; i < cuentas.length; i++) {
    const b = cuentas[i].bolsillos.find(x => x.ID_Bolsillo === id);
    if (b) return { b: b, c: cuentas[i] };
  }
  return null;
}
const hayBolsillos = () => ((App.boot.saldos && App.boot.saldos.cuentas) || []).some(c => c.bolsillos.length);

function buscarMov(id) {
  const fuentes = [App.det.data && App.det.data.movimientos, App.mov.data && App.mov.data.items, App.ahoC.data && App.ahoC.data.movimientos, App.boot.ultimos];
  for (let i = 0; i < fuentes.length; i++) {
    const hit = (fuentes[i] || []).find(x => x.ID_Mov === id);
    if (hit) return hit;
  }
  return null;
}

// ---------------------------------------------------------------------------
// Navegación
// ---------------------------------------------------------------------------

const esTab = r => TABS.some(t => t.id === r);

function navegar(ruta) {
  if (esTab(ruta)) App.pila = [ruta];
  else App.pila.push(ruta);
  render(true);
}
function volver() {
  if (App.pila.length > 1) App.pila.pop();
  render(true);
}
const rutaActual = () => App.pila[App.pila.length - 1];

function tituloRuta(ruta) {
  const t = TABS.find(x => x.id === ruta);
  if (t) return t.etiqueta;
  const partes = ruta.split('/');
  if (partes[0] === 'ajustes' && partes.length === 1) return 'Ajustes';
  if (partes[0] === 'movimientos') return 'Movimientos';
  if (partes[0] === 'nomina') return 'Nómina';
  if (partes[0] === 'regalos') return 'Regalos';
  if (partes[0] === 'anual') return 'Vista anual';
  if (partes[0] === 'guia') return 'Guía de uso';
  if (partes[0] === 'pagos') return 'Servicios y suscripciones';
  if (partes[0] === 'ahorro') return partes.length === 1 ? 'Ahorro' : (App.ahoC.data && App.ahoC.id === partes[1] ? App.ahoC.data.cuenta.Nombre : 'Ahorro');
  if (partes[0] === 'tarjeta') return App.tar.data && App.tar.id === partes[1] ? App.tar.data.tarjeta.Nombre : 'Tarjeta';
  if (partes[0] === 'credito') return App.cre.data && App.cre.id === partes[1] ? App.cre.data.credito.Nombre : 'Crédito';
  if (partes[0] === 'bolsillo') { const inf = App.boot && infoBolsillo(partes[1]); return inf ? inf.b.Nombre : 'Bolsillo'; }
  const s = partes[1];
  if (CAT[s]) return CAT[s].plural;
  return { perfil: 'Perfil', apariencia: 'Apariencia', demo: 'Datos de demostración', diagnostico: 'Diagnóstico', plantilla: 'Plantilla del presupuesto', parametros: 'Parámetros de nómina', respaldos: 'Respaldos', arranque: 'Arranque', borrar: 'Borrar mis datos', registro: 'Registro de errores' }[s] || 'Atrás';
}

function render(enfocar) {
  const ruta = rutaActual();
  const raiz = App.pila[0];

  // Navegación principal
  const navHtml = (clase) => TABS.map(t =>
    '<button class="' + clase + '" data-acc="tab" data-ruta="' + t.id + '"' + (t.id === raiz ? ' aria-current="page"' : '') + '>' +
    ico(t.icono) + '<span>' + esc(t.etiqueta) + '</span></button>').join('');
  $('#tabbar').innerHTML = navHtml('m-tab');
  $('#lateral').innerHTML = '<div class="m-marca">Moni</div>' + navHtml('m-lateral-item');

  // Pantalla
  let vista;
  try {
    vista = App.error ? vErrorCarga() : pantalla(ruta);
  } catch (e) {
    reportarErrorCliente('Pantalla ' + ruta + ': ' + e.message, e.stack);
    vista = { titulo: 'Error', html: '<div class="m-vacio">' + ico('alerta') + '<h2>No se pudo mostrar esta pantalla</h2><p>' + esc(e.message) + '</p></div>' };
  }

  const prev = App.pila.length > 1 ? tituloRuta(App.pila[App.pila.length - 2]) : '';
  $('#barra-izq').innerHTML = prev ? '<button class="m-btn-texto" data-acc="volver" aria-label="Volver a ' + esc(prev) + '">' + ico('izq', 'm-icon-sm') + esc(prev) + '</button>' : '';
  $('#barra-titulo').textContent = vista.titulo || '';
  $('#barra-der').innerHTML = vista.acciones || '';

  const titulo = vista.ocultarTitulo ? '' : '<h1 class="m-titulo-grande" id="titulo-pantalla" tabindex="-1">' + esc(vista.titulo) + '</h1>';
  $('#vista').classList.toggle('m-ancha', !!vista.ancha);
  $('#vista').innerHTML = titulo + (vista.subtitulo ? '<p class="m-subtitulo">' + esc(vista.subtitulo) + '</p>' : '') + vista.html;
  document.title = (vista.titulo ? vista.titulo + ' · ' : '') + 'Moni';

  document.body.classList.toggle('m-asistente', !!vista.asistente);
  const fab = $('#fab');
  if (fab) fab.hidden = !!vista.asistente || !(App.boot && App.boot.instalado && hayBolsillos() && ['inicio', 'bolsillos', 'presupuesto', 'movimientos'].indexOf(ruta) !== -1);

  if (vista.despues) vista.despues();
  if (enfocar) {
    window.scrollTo(0, 0);
    const h = $('#titulo-pantalla');
    if (h) h.focus({ preventScroll: true });
  }
  $('#barra').classList.toggle('m-escrolado', window.scrollY > 40);
}

function pantalla(ruta) {
  if (!App.boot) return { titulo: 'Moni', html: '<div class="m-cargando">Cargando…</div>', ocultarTitulo: true };
  if (!App.boot.instalado && ruta !== 'mas' && ruta.indexOf('ajustes') !== 0) return vInstalar();

  const partes = ruta.split('/');
  switch (partes[0]) {
    case 'inicio': return vInicio();
    case 'bolsillos': return vBolsillos();
    case 'presupuesto': return vPresupuesto();
    case 'nomina': return vNomina();
    case 'regalos': return vRegalos();
    case 'anual': return vAnual();
    case 'guia': return vGuia();
    case 'pagos': return vPagos();
    case 'ahorro': return partes.length === 1 ? vAhorro() : vCuentaAhorro(partes[1]);
    case 'bolsillo': return vBolsillo(partes[1]);
    case 'movimientos': return vMovimientos();
    case 'tarjetas': return vDeudas();
    case 'tarjeta': return vTarjeta(partes[1]);
    case 'credito': return vCredito(partes[1]);
    case 'mas': return vMas();
    case 'ajustes':
      if (partes.length === 1) return vAjustes();
      if (partes[1] === 'perfil') return vPerfil();
      if (partes[1] === 'apariencia') return vApariencia();
      if (partes[1] === 'demo') return vDemo();
      if (partes[1] === 'plantilla') return vPlantilla();
      if (partes[1] === 'respaldos') return vRespaldos();
      if (partes[1] === 'arranque') return vArranque();
      if (partes[1] === 'borrar') return vBorrar();
      if (partes[1] === 'registro') return vRegistro();
      if (partes[1] === 'parametros') return vParametros();
      if (partes[1] === 'diagnostico') return vDiagnostico();
      if (CAT[partes[1]]) return vCatalogo(partes[1]);
  }
  return vProximamente('No encontrada', 'alerta', 'Esta pantalla no existe.');
}

function fila(o) {
  const cuerpo =
    (o.icono ? '<span class="m-row-icono">' + ico(o.icono, 'm-icon-sm') + '</span>' : '') +
    '<span class="m-row-texto"><span class="m-row-titulo" style="display:block">' + o.titulo + '</span>' +
    (o.sub ? '<span class="m-row-sub" style="display:block">' + o.sub + '</span>' : '') + '</span>' +
    (o.final ? '<span class="m-row-final">' + o.final + '</span>' : '') +
    (o.chevron ? ico('der', 'm-icon-sm m-chevron') : '');
  if (o.deshabilitada) return '<div class="m-row" aria-disabled="true">' + cuerpo + '</div>';
  return '<button class="m-row' + (o.clase ? ' ' + o.clase : '') + '" ' + (o.attrs || '') + '>' + cuerpo + '</button>';
}

function seccion(titulo, filas, pie) {
  return '<section class="m-seccion"' + (titulo ? ' aria-label="' + esc(titulo) + '"' : '') + '>' +
    (titulo ? '<h2 class="m-seccion-titulo">' + esc(titulo) + '</h2>' : '') +
    '<div class="m-group">' + filas + '</div>' + (pie ? '<p class="m-seccion-pie">' + pie + '</p>' : '') + '</section>';
}

function vacio(icono, titulo, texto, boton) {
  return '<div class="m-vacio">' + ico(icono) + '<h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p>' + (boton || '') + '</div>';
}

function irA(ruta, o) { return fila(Object.assign({ chevron: true, attrs: 'data-acc="ir" data-ruta="' + ruta + '"' }, o)); }

function textoPlazo(dias) {
  if (dias < 0) return 'Venció hace ' + (-dias) + (dias === -1 ? ' día' : ' días');
  if (dias === 0) return 'Vence hoy';
  if (dias === 1) return 'Vence mañana';
  return 'Vence en ' + dias + ' días';
}

async function refrescarProximos() {
  App.proximosCargando = true;
  try { App.boot.proximos = await api('getProximos'); App.proximosViejos = false; }
  catch (e) { /* queda la lista anterior; no es crítico */ }
  App.proximosCargando = false;
  if (rutaActual() === 'inicio') render();
}

function vInicio() {
  if (asistenteVisible()) return vAsistente();
  const nombre = cfg('Nombre_Usuario');
  const estado = App.boot.estado || {};
  const s = App.boot.saldos || { cuentas: [] };
  let html = bannerDemo();

  if (estado.pasos && !estado.completo) {
    const hechos = estado.pasos.filter(p => p.hecho).length;
    // Quien dejó el asistente "para más tarde" lo retoma desde aquí; con datos de demostración no aplica.
    const retomar = App.asist.omitido && !esVerdad(cfg('Datos_Demo'))
      ? fila({ icono: 'capas', titulo: 'Continuar con el asistente', sub: 'Te lleva paso a paso', chevron: true, attrs: 'data-acc="asist-reanudar"' }) : '';
    html += '<section class="m-seccion" aria-label="Primeros pasos"><h2 class="m-seccion-titulo">Primeros pasos · ' + hechos + ' de ' + estado.pasos.length + '</h2>' +
      '<div class="m-group">' + retomar + estado.pasos.map(p =>
        fila({
          icono: p.hecho ? 'check' : 'plus',
          titulo: esc(p.titulo),
          sub: p.opcional ? 'Opcional' : '',
          chevron: true,
          attrs: 'data-acc="ir" data-ruta="' + esc(p.pantalla) + '"',
          clase: p.hecho ? 'm-hecho' : ''
        })).join('') + '</div>' +
      '<div class="m-progreso" style="margin:var(--m-space-3) var(--m-space-4) 0" role="progressbar" aria-valuemin="0" aria-valuemax="' + estado.pasos.length + '" aria-valuenow="' + hechos + '" aria-label="Avance de la configuración"><span style="width:' + Math.round(hechos / estado.pasos.length * 100) + '%"></span></div></section>';
  }

  if (estado.completo && !esVerdad(cfg('Datos_Demo')) && !esVerdad(cfg('Arranque_Hecho'))) {
    html += '<div class="m-banner" role="note">' + ico('check') + '<span>Falta cargar tus saldos reales y empezar.</span><button class="m-btn-texto" data-acc="ir" data-ruta="ajustes/arranque">Arranque</button></div>';
  }

  if (hayBolsillos()) {
    const rap = (icono, texto, attrs) => '<button class="m-rapido" ' + attrs + '><span class="m-rapido-icono">' + ico(icono) + '</span><span>' + esc(texto) + '</span></button>';
    html += '<section class="m-seccion m-tablero-ancho" aria-label="Accesos rápidos"><div class="m-rapidos">' +
      rap('plus', 'Gasto', 'data-acc="rapido" data-tipo="Gasto"') +
      rap('check', 'Ingreso', 'data-acc="rapido" data-tipo="Ingreso"') +
      rap('capas', 'Mover dinero', 'data-acc="rapido" data-tipo="Mover"') +
      rap('pulso', 'Pagar servicios', 'data-acc="ir" data-ruta="pagos"') +
      rap('tarjetas', 'Tarjetas', 'data-acc="tab" data-ruta="tarjetas"') +
      rap('presupuesto', 'Presupuesto', 'data-acc="tab" data-ruta="presupuesto"') + '</div></section>';
  }
  html += '<div class="m-tablero">';

  if (s.cuentas.length) {
    html += '<section class="m-seccion" aria-label="Resumen"><h2 class="m-seccion-titulo">Resumen</h2><div class="m-group m-resumen">' +
      '<div class="m-resumen-etiqueta">Total</div><div class="m-resumen-cifra m-num ' + claseSaldo(s.total) + '">' + dinero(s.total) + '</div>' +
      '<div class="m-resumen-fila"><div><div class="m-resumen-etiqueta">Disponible</div><strong class="m-num ' + claseSaldo(s.disponible) + '">' + dinero(s.disponible) + '</strong></div>' +
      '<div><div class="m-resumen-etiqueta">Ahorro</div><strong class="m-num">' + dinero(s.ahorro) + '</strong></div></div></div></section>';

    html += seccion('Cuentas', s.cuentas.map(c => fila({
      icono: c.Tipo === 'Ahorro' ? 'bolsillos' : 'cuenta',
      titulo: esc(c.Nombre),
      sub: esc(c.Banco) + ' · ' + esc(etiqueta('TipoCuenta', c.Tipo)),
      final: '<strong class="m-num ' + claseSaldo(c.Saldo) + '">' + dinero(c.Saldo) + '</strong>',
      attrs: 'data-acc="ir" data-ruta="bolsillos"'
    })).join(''));
  } else if (!(estado.pasos && !estado.completo)) {
    html += vacio('bolsillos', 'Aún no tienes cuentas', 'Agrega una cuenta desde Ajustes para ver tus saldos aquí.');
  }

  const pp = App.boot.ppto;
  if (pp && s.cuentas.length) {
    if (pp.existe) {
      const avance = pp.totales.plan > 0 ? Math.min(100, Math.round(pp.totales.real / pp.totales.plan * 100)) : 0;
      html += '<section class="m-seccion" aria-label="Presupuesto del mes"><h2 class="m-seccion-titulo">Presupuesto de ' + esc(mesTexto(pp.mes).toLowerCase()) + '</h2><div class="m-group">' +
        fila({ titulo: 'Gastado ' + dinero(pp.totales.real) + ' de ' + dinero(pp.totales.plan), sub: pp.totales.pagados + ' de ' + pp.totales.renglones + ' renglones pagados',
          final: '<strong class="m-num ' + claseSaldo(pp.totales.saldo) + '">' + dinero(pp.totales.saldo) + '</strong><span class="m-row-sub" style="display:block">te queda</span>',
          chevron: true, attrs: 'data-acc="ir" data-ruta="presupuesto"' }) +
        '<div style="padding:0 var(--m-space-4) var(--m-space-4)"><div class="m-progreso" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + avance + '" aria-label="Gastado frente a lo planeado"><span style="width:' + avance + '%"></span></div></div></div></section>';
    } else {
      html += '<section class="m-seccion" aria-label="Presupuesto del mes"><div class="m-group">' +
        fila({ icono: 'presupuesto', titulo: 'Genera el presupuesto de ' + esc(mesTexto(pp.mes).toLowerCase()), sub: 'Con tu plantilla, en un toque', chevron: true, attrs: 'data-acc="ir" data-ruta="presupuesto"' }) + '</div></section>';
    }
  }

  const prox = App.boot.proximos || [];
  if (prox.length) {
    html += seccion('Próximos pagos', prox.map(p => fila({
      icono: p.tipo === 'Tarjeta' ? 'tarjetas' : (p.tipo === 'Credito' ? 'capas' : (p.tipo === 'Servicio' ? 'pulso' : 'etiqueta')),
      titulo: esc(p.titulo),
      sub: esc(textoPlazo(p.dias)) + ' · ' + esc(p.detalle),
      final: '<strong class="m-num' + (p.dias < 0 ? ' m-negativo' : '') + '">' + dinero(p.valor) + '</strong>',
      chevron: true,
      attrs: p.susc ? 'data-acc="susc" data-id="' + esc(p.id) + '"' : 'data-acc="ir" data-ruta="' + (p.tipo === 'Tarjeta' ? 'tarjeta/' : 'credito/') + esc(p.id) + '"'
    })).join('') + fila({ titulo: 'Ver servicios y suscripciones', chevron: true, attrs: 'data-acc="ir" data-ruta="pagos"' }));
  }

  const ultimos = App.boot.ultimos || [];
  if (ultimos.length) {
    html += '<section class="m-seccion" aria-label="Últimos movimientos"><h2 class="m-seccion-titulo">Últimos movimientos</h2><div class="m-group">' +
      ultimos.map(i => filaMov(i, false)).join('') +
      fila({ titulo: 'Ver todos los movimientos', chevron: true, attrs: 'data-acc="ir" data-ruta="movimientos"' }) + '</div></section>';
  }

  html += '</div>';
  return {
    titulo: nombre ? 'Hola, ' + nombre : 'Inicio', html: html, ancha: true,
    // Tras un pago o una compra, la lista de próximos pagos se vuelve a pedir (liviana) en segundo plano.
    despues: () => { if (App.proximosViejos && !App.proximosCargando) refrescarProximos(); }
  };
}

/** Resumen de tiempos de esta sesión, por tipo de llamada: sirve para ver qué pesa. */
function htmlTiempos() {
  if (!TIEMPOS.length) return '';
  const por = {};
  TIEMPOS.forEach(t => { (por[t.fn] = por[t.fn] || []).push(t); });
  const med = a => { const o = a.slice().sort((x, y) => x - y); return o[Math.floor(o.length / 2)]; };
  const filas = Object.keys(por).map(fn => {
    const l = por[fn];
    const srv = l.map(t => t.servidor).filter(v => v !== null);
    return { fn: fn, n: l.length, mediana: med(l.map(t => t.cliente)), max: Math.max.apply(null, l.map(t => t.cliente)), srv: srv.length ? med(srv) : null };
  }).sort((a, b) => b.mediana - a.mediana);
  return '<h3 style="margin:var(--m-space-5) 0 var(--m-space-2)">Tiempos de esta sesión</h3><p class="m-ayuda">Mediana en milisegundos: lo que ves tú y lo que tarda Apps Script. Meta: abrir ≤ 2 s con caché, guardar ≤ 1,5 s.</p>' +
    '<div style="overflow-x:auto"><table class="m-tabla"><thead><tr><th>Llamada</th><th>Veces</th><th>Tú</th><th>Servidor</th><th>Máx.</th></tr></thead><tbody>' +
    filas.map(f => '<tr><td>' + esc(f.fn) + '</td><td class="m-num">' + f.n + '</td><td class="m-num">' + f.mediana + '</td><td class="m-num">' + (f.srv === null ? '—' : f.srv) + '</td><td class="m-num">' + f.max + '</td></tr>').join('') + '</tbody></table></div>';
}

function vDiagnostico() {
  return {
    titulo: 'Diagnóstico',

      const caja = $('#diag');
      try {

        caja.innerHTML =
          '<p><strong>' + esc(d.hoja) + '</strong></p>' +
          '<p class="m-ayuda">Versión de Moni ' + esc(d.version) + '</p>' +

  };
}

function vCatalogo(tabla) {
  const def = CAT[tabla];
  const todos = cat(tabla).filter(f => !def.filtro || def.filtro(f));
  const vivos = todos.filter(f => esVerdad(f.Activo) || f.Activo === '');
  const muertos = todos.filter(f => !(esVerdad(f.Activo) || f.Activo === ''));
  const verInactivos = !!App.inactivos[tabla];
  const bloqueo = def.requiere ? def.requiere() : '';

  const mapa = f => {
    const d = def.fila(f);
    return fila({ titulo: d.titulo, sub: d.sub, final: d.final, chevron: true, clase: esVerdad(f.Activo) || f.Activo === '' ? '' : 'm-inactivo',
      attrs: 'data-acc="editar" data-tabla="' + tabla + '" data-id="' + esc(f[def.id]) + '"' });
  };

  let html = '';
  if (bloqueo) html += '<div class="m-banner" role="note">' + ico('alerta') + '<span>' + esc(bloqueo) + '</span></div>';
  if (!vivos.length) {
    html += vacio(def.icono, 'Aún no hay ' + def.plural.toLowerCase(), def.vacio,
      bloqueo ? '' : '<button class="m-btn m-btn-primary" data-acc="nuevo" data-tabla="' + tabla + '">Agregar ' + esc(def.singular) + '</button>');
  } else {
    html += '<div class="m-group">' + vivos.map(mapa).join('') + '</div>';
  }
  if (muertos.length) {
    html += '<div class="m-seccion" style="margin-top:var(--m-space-5)"><div class="m-group"><div class="m-row"><div class="m-interruptor-fila" style="width:100%">' +
      '<label for="ver-inactivos">Mostrar desactivados (' + muertos.length + ')</label>' +
      '<span class="m-interruptor"><input type="checkbox" id="ver-inactivos" role="switch" data-acc-cambio="inactivos" data-tabla="' + tabla + '"' + (verInactivos ? ' checked' : '') + '><i></i></span></div></div></div></div>';
    if (verInactivos) html += '<div class="m-group">' + muertos.map(mapa).join('') + '</div>';
  }

  return {
    titulo: def.plural,
    acciones: bloqueo ? '' : '<button class="m-btn-texto" data-acc="nuevo" data-tabla="' + tabla + '" aria-label="Agregar ' + esc(def.singular) + '">' + ico('plus') + '</button>',
    html: html
  };
}

function idCampo(k) { return 'f-' + k; }

const bolsillosActivosDe = idCuenta => activos('Bolsillos').filter(b => b.ID_Cuenta === idCuenta);

function htmlCampo(c, valor, ctx) {
  const id = idCampo(c.k);
  const ayuda = c.ayuda ? '<p class="m-ayuda" id="' + id + '-ayuda">' + esc(c.ayuda) + '</p>' : '';
  const desc = c.ayuda ? ' aria-describedby="' + id + '-ayuda"' : '';
  const req = c.requerido ? ' required aria-required="true"' : '';
  let ctl;

  switch (c.tipo) {
    case 'interruptor':
      return '<div class="m-campo" data-campo="' + c.k + '"><div class="m-interruptor-fila"><label for="' + id + '">' + esc(c.label) + '</label>' +
        '<span class="m-interruptor"><input type="checkbox" role="switch" id="' + id + '" name="' + c.k + '"' + desc + (valor ? ' checked' : '') + '><i></i></span></div>' + ayuda + '</div>';
    case 'select': {
      const opts = c.opciones(ctx || {});
      const unaOpcion = o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(valor) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      ctl = '<select class="m-input" id="' + id + '" name="' + c.k + '"' + req + desc + '>' +
        (c.requerido && (valor === undefined || valor === '') ? '<option value="" disabled selected>Elegir…</option>' : '') +
        opts.map(o => o.grupo ? '<optgroup label="' + esc(o.grupo) + '">' + o.opciones.map(unaOpcion).join('') + '</optgroup>' : unaOpcion(o)).join('') + '</select>';
      break;
    }
    case 'dinero':
      ctl = '<input class="m-input m-num" id="' + id + '" name="' + c.k + '" type="text" inputmode="decimal" autocomplete="off"' + desc +
        ' value="' + (valor === '' || valor === undefined || valor === null || isNaN(Number(valor)) ? '' : esc(new Intl.NumberFormat('es-CO', { maximumFractionDigits: 2 }).format(Number(valor)))) + '" data-tipo="dinero"><p class="m-ayuda" data-eco="' + id + '" aria-live="polite"></p>';
      break;
    case 'entero':
      ctl = '<input class="m-input m-num" id="' + id + '" name="' + c.k + '" type="number" inputmode="numeric" min="' + (c.min || 0) + '" max="' + (c.max || '') + '" step="1"' + req + desc + ' value="' + esc(valor) + '">';
      break;
    case 'fecha':
      ctl = '<input class="m-input" id="' + id + '" name="' + c.k + '" type="date"' + desc + ' value="' + esc(valor) + '">';
      break;
    case 'multi': {
      const marcados = Array.isArray(valor) ? valor : [];
      const opts = c.opciones(ctx || {});
      return '<fieldset class="m-campo" data-campo="' + c.k + '" style="border:0;padding:0;margin:0 0 var(--m-space-4)"><legend class="m-label">' + esc(c.label) + '</legend>' +
        (opts.length ? opts.map(o => '<div class="m-interruptor-fila"><label for="' + id + '-' + esc(o[0]) + '">' + esc(o[1]) + '</label><span class="m-interruptor"><input type="checkbox" role="switch" id="' + id + '-' + esc(o[0]) + '" data-multi="' + c.k + '" value="' + esc(o[0]) + '"' + (marcados.indexOf(o[0]) !== -1 ? ' checked' : '') + '><i></i></span></div>').join('') : '<p class="m-ayuda">Aún no hay opciones.</p>') +
        (c.ayuda ? '<p class="m-ayuda">' + esc(c.ayuda) + '</p>' : '') + '</fieldset>';
    }
    case 'area':
      ctl = '<textarea class="m-input" id="' + id + '" name="' + c.k + '" rows="3"' + desc + '>' + esc(valor) + '</textarea>';
      break;
    default:
      ctl = '<input class="m-input" id="' + id + '" name="' + c.k + '" type="text"' + (c.inputmode ? ' inputmode="' + c.inputmode + '"' : '') +
        (c.maxlength ? ' maxlength="' + c.maxlength + '"' : '') + (c.lista ? ' list="' + id + '-lista"' : '') + req + desc + ' autocomplete="off" value="' + esc(valor) + '">' +
        (c.lista ? '<datalist id="' + id + '-lista">' + c.lista.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist>' : '');
  }
  return '<div class="m-campo" data-campo="' + c.k + '"><label class="m-label" for="' + id + '">' + esc(c.label) + '</label>' + ctl + ayuda + '</div>';
}

/** Lee los valores del formulario de una hoja. */
function leerFormulario(raiz, campos) {
  const v = {};
  campos.forEach(c => {
    if (c.tipo === 'multi') { v[c.k] = $$('input[data-multi="' + c.k + '"]:checked', raiz).map(x => x.value); return; }
    const el = $('#' + idCampo(c.k), raiz);
    if (!el) return;
    if (c.tipo === 'interruptor') v[c.k] = el.checked;
    else if (c.tipo === 'dinero') v[c.k] = leerDinero(el.value);
    else if (c.tipo === 'entero') v[c.k] = el.value === '' ? '' : Number(el.value);
    else v[c.k] = el.value.trim();
  });
  return v;
}

function actualizarVisibilidad(raiz, campos, ctx) {
  const v = leerFormulario(raiz, campos);
  campos.forEach(c => {
    const caja = $('[data-campo="' + c.k + '"]', raiz);
    if (caja && c.visible) caja.hidden = !c.visible(v, ctx || {});
  });
}

function activarEcoDinero(raiz) {
  $$('input[data-tipo="dinero"]', raiz).forEach(inp => {
    const eco = $('[data-eco="' + inp.id + '"]', raiz);
    const actualizar = () => {
      const n = leerDinero(inp.value);
      eco.textContent = inp.value === '' ? '' : (isNaN(n) ? 'Escribe solo números. Usa coma para los decimales.' : '= ' + dinero(n));
    };
    inp.addEventListener('input', actualizar);
    inp.addEventListener('blur', () => {
      const n = leerDinero(inp.value);
      if (n !== '' && !isNaN(n)) inp.value = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 2 }).format(n);
      actualizar();
    });
    actualizar();
  });
}

async function abrirFormulario(tabla, id, defaults) {
  const def = CAT[tabla];
  const existente = id ? cat(tabla).find(f => f[def.id] === id) : null;
  const item = existente ? (def.alEditar ? def.alEditar(existente) : existente) : {};
  const campos = def.campos.filter(c => !(c.soloAlCrear && existente));
  const ctx = { existente: existente };

  const valorInicial = c => {
    if (item[c.k] !== undefined && item[c.k] !== null && item[c.k] !== '') {
      return c.tipo === 'interruptor' ? esVerdad(item[c.k]) : item[c.k];
    }
    if (c.k === 'reserva' && !existente) return activos('Bolsillos').some(b => b.Rol === 'Reserva_Tarjeta') ? '' : '__nueva';
    return c.defecto !== undefined ? c.defecto : '';
  };

  const activo = existente ? (esVerdad(existente.Activo) || existente.Activo === '') : true;
  let cuerpo = campos.map(c => htmlCampo(c, valorInicial(c), ctx)).join('');
  if (existente) {
    cuerpo += activo
      ? '<button type="button" class="m-accion-peligro" data-hoja-acc="pedir-desactivar">Desactivar ' + esc(def.singular) + '</button>' +
        '<div id="confirma" hidden class="m-error-form" style="margin-top:var(--m-space-3)"><p style="margin-bottom:var(--m-space-3)">¿Desactivar “' + esc(existente.Nombre || existente.Tipo || '') + '”? Su historial se conserva y podrás reactivarlo.</p>' +
          '<div class="m-hoja-acciones"><button type="button" class="m-btn m-btn-secondary" data-hoja-acc="cancelar-desactivar">No, dejarlo</button>' +
          '<button type="button" class="m-btn m-btn-primary" style="background:var(--m-danger);color:#fff" data-hoja-acc="desactivar">Sí, desactivar</button></div></div>'
      : '<button type="button" class="m-accion-peligro" style="color:var(--m-tint)" data-hoja-acc="reactivar">Reactivar ' + esc(def.singular) + '</button>';
  }

  await abrirHoja({
    titulo: existente ? 'Editar ' + def.singular : 'Nueva ' + def.singular,
    cuerpo: '<form novalidate data-form="catalogo">' + cuerpo + '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => {
      activarEcoDinero(raiz);
      actualizarVisibilidad(raiz, campos, ctx);
      const sel = $('#' + idCampo('Tipo'), raiz);
      const sw = $('#' + idCampo('Permite_Bolsillos'), raiz);
      if (tabla === 'Cuentas' && sel && sw && !existente) {
        sw.checked = sel.value !== 'Debito';
        sw.addEventListener('change', () => { sw.dataset.tocado = '1'; });
        sel.addEventListener('change', () => { if (!sw.dataset.tocado) { sw.checked = sel.value !== 'Debito'; actualizarVisibilidad(raiz, campos, ctx); } });
      }
      raiz.addEventListener('input', () => actualizarVisibilidad(raiz, campos, ctx));
      raiz.addEventListener('change', () => actualizarVisibilidad(raiz, campos, ctx));
    },
    alGuardar: async raiz => {
      const v = leerFormulario(raiz, campos);
      campos.forEach(c => {
        if (c.visible && !c.visible(v, ctx)) delete v[c.k];
        if (c.tipo === 'dinero' && v[c.k] !== undefined && typeof v[c.k] === 'number' && isNaN(v[c.k])) throw new Error(c.label + ' debe ser un número.');
      });
      const falta = campos.find(c => c.requerido && (!c.visible || c.visible(v, ctx)) && (v[c.k] === '' || v[c.k] === undefined));
      if (falta) throw new Error(falta.label + ' es obligatorio.');

      const envio = Object.assign({}, v);
      const opciones = {};
      if (existente) envio[def.id] = existente[def.id];
      if (tabla === 'Tarjetas') {
        if (v.reserva === '__nueva') opciones.crearReserva = { ID_Cuenta: v.cuentaReserva };
        else envio.ID_Bolsillo_Reserva = v.reserva;
        delete envio.reserva; delete envio.cuentaReserva;
      }
      if (tabla === 'Cuentas') {
        if (v.fusionarEn) opciones.fusionarEn = v.fusionarEn;
        delete envio.fusionarEn;
      }
      if (tabla === 'Escenarios') {
        if (v.copiarDe) opciones.copiarDe = v.copiarDe;
        delete envio.copiarDe;
      }
      const vacioPermitido = ['ID_Bolsillo_Personal', 'ID_Bolsillo_Destino', 'ID_Categoria', 'ID_Credito'].concat(campos.filter(c => c.tipo === 'fecha').map(c => c.k));
      Object.keys(envio).forEach(k => { if (envio[k] === '' && vacioPermitido.indexOf(k) === -1) delete envio[k]; });
      if (!existente && defaults) Object.keys(defaults).forEach(k => { if (envio[k] === undefined) envio[k] = defaults[k]; });
      if (tabla === 'Nomina_Escenarios') { opciones.subsidios = v.subsidios || []; delete envio.subsidios; }
      if (tabla === 'Cuentas') {
        // Un valor vacío de saldo real/meta significa "quitar".
        ['Saldo_Real', 'Meta'].forEach(k => { if (v[k] === '' && existente && existente[k] !== '' && existente[k] !== undefined) envio[k] = ''; });
      }
      await api('saveCatalogo', tabla, envio, opciones);
      await refrescar();
      render();
      aviso(existente ? 'Cambios guardados' : 'Se agregó ' + def.singular);
    },
    extra: {
      'pedir-desactivar': raiz => { $('#confirma', raiz).hidden = false; $('[data-hoja-acc="pedir-desactivar"]', raiz).hidden = true; $('[data-hoja-acc="desactivar"]', raiz).focus(); },
      'cancelar-desactivar': raiz => { $('#confirma', raiz).hidden = true; $('[data-hoja-acc="pedir-desactivar"]', raiz).hidden = false; },
      'desactivar': async () => { await api('disableCatalogo', tabla, id); await refrescar(); render(); aviso('Desactivado'); return true; },
      'reactivar': async () => { await api('enableCatalogo', tabla, id); await refrescar(); render(); aviso('Reactivado'); return true; }
    }
  });
}

// ---------------------------------------------------------------------------
// Hoja modal (<dialog>): foco, Esc, arrastre para cerrar, errores en línea
// ---------------------------------------------------------------------------

/** La hoja que está abierta. Los oyentes del <dialog> se registran una sola vez (al final) y la usan. */
let hojaActual = null;

function abrirHoja(o) {
  return new Promise(resolve => {
    const dlg = $('#hoja');
    if (hojaActual) hojaActual.finalizar(); // nunca dos hojas a la vez
    dlg.innerHTML =
      '<div class="m-hoja-asa" aria-hidden="true"></div>' +
      '<div class="m-hoja-cabecera"><button type="button" class="m-btn-texto" data-hoja-acc="cerrar">' + esc(o.izq || 'Cancelar') + '</button>' +
      '<h2 id="hoja-titulo">' + esc(o.titulo) + '</h2>' +
      (o.sinGuardar ? '<span></span>' : '<button type="button" class="m-btn-texto" data-hoja-acc="guardar"><strong>' + esc(o.der || 'Guardar') + '</strong></button>') + '</div>' +
      '<div class="m-hoja-cuerpo"><div class="m-error-form" role="alert" hidden></div>' + o.cuerpo + '</div>';
    dlg.style.transform = '';

    const cuerpo = $('.m-hoja-cuerpo', dlg);
    const errorBox = $('.m-error-form', dlg);
    const mostrarError = m => { errorBox.textContent = m; errorBox.hidden = !m; if (m) errorBox.scrollIntoView({ block: 'nearest' }); };
    // Cerrar limpia de inmediato, sin esperar al evento 'close' (que no todos los navegadores disparan a tiempo).
    const cerrar = () => { if (dlg.open) dlg.close(); hoja.finalizar(); };

    const ejecutar = async (fn) => {
      mostrarError('');
      const botones = $$('button', dlg);
      const etiquetaGuardar = $('[data-hoja-acc="guardar"] strong', dlg);
      const textoOriginal = etiquetaGuardar ? etiquetaGuardar.textContent : '';
      botones.forEach(b => b.disabled = true);
      if (etiquetaGuardar) etiquetaGuardar.textContent = 'Guardando…';
      try {
        const cerrarDespues = await fn(cuerpo);
        cerrar();
        return cerrarDespues;
      } catch (e) {
        mostrarError(e.message);
        botones.forEach(b => b.disabled = false);
        if (etiquetaGuardar) etiquetaGuardar.textContent = textoOriginal;
      }
    };

    const alClic = ev => {
      const b = ev.target.closest('[data-hoja-acc]');
      if (ev.target === dlg) { cerrar(); return; }
      if (!b || !dlg.contains(b)) return;
      const acc = b.dataset.hojaAcc;
      if (acc === 'cerrar') cerrar();
      else if (acc === 'guardar') ejecutar(o.alGuardar);
      else if (o.extra && o.extra[acc]) {
        const r = o.extra[acc](cuerpo);
        if (r && typeof r.then === 'function') ejecutar(() => r.then(() => true));
      }
    };
    const alEnviar = ev => { ev.preventDefault(); if (o.alGuardar) ejecutar(o.alGuardar); };

    // Arrastrar la hoja hacia abajo para cerrarla
    let inicioY = null;
    const abajo = ev => { if (ev.target.closest('button')) return; inicioY = ev.clientY; try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {} };
    const mueve = ev => { if (inicioY === null) return; const dy = Math.max(0, ev.clientY - inicioY); dlg.style.transform = 'translateY(' + dy + 'px)'; dlg.style.transition = 'none'; };
    const suelta = ev => {
      if (inicioY === null) return;
      const dy = ev.clientY - inicioY; inicioY = null; dlg.style.transition = '';
      if (dy > 110) cerrar(); else dlg.style.transform = '';
    };
    $$('.m-hoja-asa, .m-hoja-cabecera', dlg).forEach(el => {
      el.addEventListener('pointerdown', abajo); el.addEventListener('pointermove', mueve);
      el.addEventListener('pointerup', suelta); el.addEventListener('pointercancel', suelta);
    });

    const hoja = {
      alClic: alClic,
      alEnviar: alEnviar,
      cerrada: false,
      finalizar() {
        if (this.cerrada) return;
        this.cerrada = true;
        if (dlg.open) dlg.close();
        dlg.style.transform = '';
        if (hojaActual === this) hojaActual = null;
        resolve();
      }
    };
    hojaActual = hoja;

    dlg.showModal();
    if (o.alAbrir) o.alAbrir(cuerpo);
    const primero = $('input:not([type=hidden]):not([disabled]), select, textarea', cuerpo);
    if (primero && !primero.closest('[hidden]')) primero.focus();
  });
}

/** Confirmación en hoja. Devuelve true si la persona confirma. */
async function confirmar(o) {
  let ok = false;
  await abrirHoja({
    titulo: o.titulo, izq: 'Cancelar', der: o.accion,
    cuerpo: '<p class="m-hoja-mensaje">' + esc(o.mensaje) + '</p>',
    alGuardar: async () => { ok = true; }
  });
  return ok;
}

function esqueleto(filas) {
  let h = '<div class="m-group" role="status" aria-busy="true" aria-label="Cargando">';
  for (let i = 0; i < filas; i++) {
    h += '<div class="m-esqueleto"><span class="m-esq-bloque"></span><span style="flex:1"><span class="m-esq-linea" style="display:block;width:' + (55 + (i * 13) % 30) + '%"></span>' +
      '<span class="m-esq-linea" style="display:block;width:32%;margin-top:8px"></span></span><span class="m-esq-linea" style="width:64px"></span></div>';
  }
  return h + '</div>';
}

/** Monto con su signo y color; el signo va en el texto para no depender solo del color. */
function montoMov(i, enBolsillo) {
  if (i.esTransferencia && !enBolsillo) return { texto: dinero(i.Valor), clase: '' };
  const v = Number(i.Valor) || 0;
  return v >= 0 && !i.esTransferencia
    ? { texto: '+' + dinero(v), clase: 'm-entra' }
    : { texto: (v >= 0 ? '+' : '−') + dinero(Math.abs(v)), clase: '' };
}

function filaMov(i, enBolsillo) {
  const m = montoMov(i, enBolsillo);
  let sub;
  if (i.esTransferencia) {
    sub = enBolsillo ? (i.Valor > 0 ? 'Desde ' : 'Hacia ') + esc(i.Contraparte || '') : esc(i.Origen) + ' → ' + esc(i.Destino);
  } else {
    sub = (enBolsillo ? '' : esc(i.Bolsillo)) + (i.Categoria ? (enBolsillo ? '' : ' · ') + esc(i.Categoria) : '');
  }
  return fila({
    titulo: esc(i.Concepto), sub: sub + (i.Anulado ? (sub ? ' · ' : '') + 'Anulado' : ''),
    final: '<span class="m-monto ' + m.clase + '">' + m.texto + '</span>',
    clase: i.Anulado ? 'm-anulado' : '', attrs: 'data-acc="mov" data-id="' + esc(i.ID_Mov) + '"'
  });
}

/** Lista agrupada por día. */
function htmlListaMov(items, enBolsillo) {
  if (!items.length) return '';
  let h = '<div class="m-group">';
  let dia = '';
  items.forEach(i => {
    if (i.Fecha !== dia) { dia = i.Fecha; h += '<div class="m-dia">' + esc(etiquetaDia(i.Fecha)) + '</div>'; }
    h += filaMov(i, enBolsillo);
  });
  return h + '</div>';
}

function navegadorMes(vista, mes, maxMes) {
  const esActual = mes >= (maxMes || App.boot.hoy.slice(0, 7));
  return '<div class="m-mes-nav"><button class="m-btn-texto" data-acc="mes" data-vista="' + vista + '" data-delta="-1" aria-label="Mes anterior">' + ico('izq', 'm-icon-sm') + '</button>' +
    '<strong aria-live="polite">' + esc(mesTexto(mes)) + '</strong>' +
    '<button class="m-btn-texto" data-acc="mes" data-vista="' + vista + '" data-delta="1" aria-label="Mes siguiente"' + (esActual ? ' disabled' : '') + '>' + ico('der', 'm-icon-sm') + '</button></div>';
}

function interruptorAnulados(vista, marcado) {
  return '<div class="m-seccion" style="margin-top:var(--m-space-5)"><div class="m-group"><div class="m-row"><div class="m-interruptor-fila" style="width:100%">' +
    '<label for="ver-anulados">Mostrar movimientos anulados</label><span class="m-interruptor"><input type="checkbox" role="switch" id="ver-anulados" data-acc-cambio="anulados" data-vista="' + vista + '"' + (marcado ? ' checked' : '') + '><i></i></span></div></div></div></div>';
}

function cambiarMes(vista, delta) {
  const st = vista === 'det' ? App.det : vista === 'ppto' ? App.ppto : vista === 'nom' ? App.nom : vista === 'aho' ? App.ahoC : App.mov;
  st.mes = mesMas(st.mes, delta); st.data = null; st.error = null;
  render();
}

function resumenMes(t) {
  return '<div class="m-group" style="padding:var(--m-space-3) var(--m-space-4);margin-bottom:var(--m-space-4)"><div class="m-resumen-fila" style="margin:0">' +
    '<div><div class="m-resumen-etiqueta">Entró</div><strong class="m-num m-positivo">' + dinero(t.ingresos) + '</strong></div>' +
    '<div><div class="m-resumen-etiqueta">Salió</div><strong class="m-num">' + dinero(t.gastos) + '</strong></div></div></div>';
}

function bloqueError(mensaje, accion) {
  return '<div class="m-vacio">' + ico('alerta') + '<h2>No se pudo cargar</h2><p>' + esc(mensaje) + '</p><button class="m-btn m-btn-secondary" data-acc="' + accion + '">Reintentar</button></div>';
}

// ---------- Detalle de un bolsillo ----------

function vBolsillo(id) {
  const inf = infoBolsillo(id);
  if (!inf) return { titulo: 'Bolsillo', html: vacio('alerta', 'Este bolsillo ya no existe', 'Puede que se haya desactivado.') };
  const d = App.det;
  if (d.id !== id) Object.assign(d, { id: id, mes: App.boot.hoy.slice(0, 7), data: null, error: null, cargando: false, anulados: false });

  const b = inf.b, c = inf.c;
  let html = '<div class="m-group m-saldo-grande"><div class="m-resumen-etiqueta">' + esc(c.Banco) + ' · ' + esc(c.Nombre) + '</div>' +
    '<div class="m-resumen-cifra m-num ' + claseSaldo(b.Saldo) + '">' + dinero(b.Saldo) + '</div>' +
    '<div class="m-acciones-fila"><button class="m-btn m-btn-primary" data-acc="registrar" data-bolsillo="' + esc(id) + '">Registrar</button>' +
    '<button class="m-btn m-btn-secondary" data-acc="mover" data-bolsillo="' + esc(id) + '">Mover dinero</button></div></div>';

  html += '<div style="height:var(--m-space-4)"></div>' + navegadorMes('det', d.mes);
  if (d.error) html += bloqueError(d.error, 'recargar-det');
  else if (!d.data) html += esqueleto(4);
  else {
    html += resumenMes(d.data.totales);
    html += d.data.movimientos.length ? htmlListaMov(d.data.movimientos, true)
      : vacio('presupuesto', 'Sin movimientos en este mes', 'Cuando registres un gasto, un ingreso o un traslado de este bolsillo, aparecerá aquí.');
    if (d.data.hayMas) html += '<p class="m-seccion-pie">Se muestran los 300 movimientos más recientes del mes.</p>';
    html += interruptorAnulados('det', d.anulados);
  }

  return {
    titulo: b.Es_Interno ? c.Nombre : b.Nombre,
    acciones: '<button class="m-btn-texto" data-acc="editar-bolsillo" data-id="' + esc(id) + '">Editar</button>',
    html: html,
    despues: () => { if (!d.data && !d.cargando && !d.error) cargarDetalle(); }
  };
}

async function cargarDetalle() {
  const d = App.det;
  const id = d.id, mes = d.mes, an = d.anulados;
  d.cargando = true; d.error = null;
  try {
    const data = await api('getDetalleBolsillo', id, mes, an);
    if (d.id !== id || d.mes !== mes || d.anulados !== an) { d.cargando = false; render(); return; } // respuesta vieja: se descarta y se pide la actual
    d.data = data;
  } catch (e) { d.error = e.message; }
  d.cargando = false;
  if (rutaActual() === 'bolsillo/' + id) render();
}

// ---------- Lista de todos los movimientos ----------

function filtrarMov(items) {
  const t = (App.mov.texto || '').trim().toLowerCase();
  if (!t) return items;
  return items.filter(i => [i.Concepto, i.Notas, i.Bolsillo, i.Categoria, i.Origen, i.Destino].some(x => String(x || '').toLowerCase().indexOf(t) !== -1));
}

function vMovimientos() {
  const m = App.mov;
  if (!m.mes) m.mes = App.boot.hoy.slice(0, 7);
  let html = navegadorMes('mov', m.mes) +
    '<input type="search" class="m-input m-buscar" id="buscar-mov" placeholder="Buscar por concepto, bolsillo o categoría" aria-label="Buscar en los movimientos" value="' + esc(m.texto) + '">';
  if (m.error) html += bloqueError(m.error, 'recargar-mov');
  else if (!m.data) html += esqueleto(6);
  else {
    html += resumenMes(m.data.totales) + '<div id="lista-mov">';
    const lista = filtrarMov(m.data.items);
    html += lista.length ? htmlListaMov(lista, false)
      : vacio('presupuesto', m.texto ? 'Nada coincide con la búsqueda' : 'Sin movimientos en este mes', m.texto ? 'Prueba con otra palabra.' : 'Usa el botón Registrar para anotar un gasto o un ingreso.');
    html += '</div>';
    if (m.data.hayMas) html += '<p class="m-seccion-pie">Se muestran los 300 movimientos más recientes del mes.</p>';
    html += interruptorAnulados('mov', m.anulados);
  }
  return { titulo: 'Movimientos', html: html, despues: () => { if (!m.data && !m.cargando && !m.error) cargarMov(); } };
}

async function cargarMov() {
  const m = App.mov;
  const mes = m.mes, an = m.anulados;
  m.cargando = true; m.error = null;
  try {
    const data = await api('getMovimientos', { mes: mes, incluirAnulados: an, limite: 300 });
    if (m.mes !== mes || m.anulados !== an) { m.cargando = false; render(); return; } // respuesta vieja: se descarta y se pide la actual
    m.data = data;
  } catch (e) { m.error = e.message; }
  m.cargando = false;
  if (rutaActual() === 'movimientos') render();
}

// ---------- Registrar, mover y editar ----------

/** Opciones de bolsillos agrupadas por cuenta, con su saldo. */
function opcionesBolsillos() {
  return ((App.boot.saldos && App.boot.saldos.cuentas) || []).filter(c => c.bolsillos.length).map(c => ({
    grupo: c.Banco + ' · ' + c.Nombre,
    opciones: c.bolsillos.map(b => [b.ID_Bolsillo, (b.Es_Interno ? c.Nombre : b.Nombre) + ' — ' + dinero(b.Saldo)])
  }));
}

function ultimoBolsillo() { try { return localStorage.getItem('moni.ultimoBolsillo') || ''; } catch (e) { return ''; } }
function recordarBolsillo(id) { try { localStorage.setItem('moni.ultimoBolsillo', id); } catch (e) {} }

const CAMPOS_REGISTRO = [
  { k: 'Valor', tipo: 'dinero' }, { k: 'Concepto', tipo: 'texto' }, { k: 'ID_Bolsillo', tipo: 'select' },
  { k: 'Origen', tipo: 'select' }, { k: 'Destino', tipo: 'select' }, { k: 'ID_Categoria', tipo: 'select' },
  { k: 'Fecha', tipo: 'texto' }, { k: 'Notas', tipo: 'texto' }, { k: 'ID_Item_Ppto', tipo: 'select' }
];

function categoriasPara(tipo) {
  const t = tipo === 'Ingreso' ? 'Ingreso' : 'Gasto';
  return [['', 'Sin categoría']].concat(activos('Categorias').filter(c => tipo === 'Ajuste' || c.Tipo === t).map(c => [c.ID_Categoria, c.Nombre]));
}

async function abrirRegistrar(o) {
  const edit = o.edit || null;
  const tipoInicial = edit ? edit.Tipo_Mov : (o.tipo || 'Gasto');
  const hoy = App.boot.hoy;
  const todos = opcionesBolsillos();
  const idsValidos = [].concat.apply([], todos.map(g => g.opciones.map(x => x[0])));
  const preferido = o.idBolsillo || ultimoBolsillo();
  const bolsilloInicial = edit ? edit.ID_Bolsillo : (idsValidos.indexOf(preferido) !== -1 ? preferido : (idsValidos[0] || ''));
  const destinoInicial = o.destino && idsValidos.indexOf(o.destino) !== -1 ? o.destino : (idsValidos.find(i => i !== bolsilloInicial) || '');
  const renglones = App.boot.renglones || [];
  const itemInicial = edit ? (edit.ID_Item_Ppto || '') : (o.idItem || '');

  const selBolsillo = (k, label, valor, solo) =>
    '<div class="m-campo" data-campo="' + k + '" data-solo="' + solo + '"><label class="m-label" for="' + idCampo(k) + '">' + esc(label) + '</label>' +
    '<select class="m-input" id="' + idCampo(k) + '" name="' + k + '">' +
    todos.map(g => '<optgroup label="' + esc(g.grupo) + '">' + g.opciones.map(x => '<option value="' + esc(x[0]) + '"' + (x[0] === valor ? ' selected' : '') + '>' + esc(x[1]) + '</option>').join('') + '</optgroup>').join('') + '</select></div>';

  const segmento = ['Gasto', 'Ingreso', 'Mover'].map(t => '<label><input type="radio" name="tipo" value="' + t + '"' + (t === tipoInicial ? ' checked' : '') + '><span>' + (t === 'Mover' ? 'Mover' : t) + '</span></label>').join('');
  const valorInicial = edit ? (edit.Tipo_Mov === 'Ajuste' ? edit.Valor : Math.abs(edit.Valor)) : (o.valor || '');

  const cuerpo = '<form novalidate data-form="registro">' +
    (edit ? '' : '<div class="m-campo"><div class="m-segmentado" role="radiogroup" aria-label="Qué quieres registrar">' + segmento + '</div></div>') +
    htmlCampo({ k: 'Valor', label: edit && edit.Tipo_Mov === 'Ajuste' ? 'Valor (negativo si resta)' : 'Valor', tipo: 'dinero', requerido: true }, valorInicial) +
    htmlCampo({ k: 'Concepto', label: 'Concepto', tipo: 'texto', maxlength: 120, requerido: true }, edit ? edit.Concepto : (o.concepto || '')).replace('data-campo="Concepto"', 'data-campo="Concepto" data-etiqueta="1"') +
    selBolsillo('ID_Bolsillo', 'Bolsillo', bolsilloInicial, 'Gasto,Ingreso,Ajuste') +
    selBolsillo('Origen', 'Sale de', bolsilloInicial, 'Mover') +
    selBolsillo('Destino', 'Llega a', destinoInicial, 'Mover') +
    (renglones.length ? '<div class="m-campo" data-campo="ID_Item_Ppto" data-solo="Gasto,Ajuste,Mover"><label class="m-label" for="f-ID_Item_Ppto">Renglón del presupuesto (opcional)</label><select class="m-input" id="f-ID_Item_Ppto" name="ID_Item_Ppto"><option value="">Ninguno</option>' +
      renglones.map(r => '<option value="' + esc(r.ID_Item) + '"' + (r.ID_Item === itemInicial ? ' selected' : '') + '>' + esc(r.Concepto) + '</option>').join('') + '</select><p class="m-ayuda">Así el gasto cuenta como lo "real" de ese renglón.</p></div>' : '') +
    '<div class="m-campo" data-campo="ID_Categoria" data-solo="Gasto,Ingreso,Ajuste"><label class="m-label" for="f-ID_Categoria">Categoría (opcional)</label><select class="m-input" id="f-ID_Categoria" name="ID_Categoria"></select></div>' +
    '<div class="m-campo" data-campo="Fecha"><label class="m-label" for="f-Fecha">Fecha</label><input class="m-input" id="f-Fecha" name="Fecha" type="date" max="' + hoy + '" value="' + esc(edit ? edit.Fecha : hoy) + '"></div>' +
    htmlCampo({ k: 'Notas', label: 'Notas (opcional)', tipo: 'area' }, edit ? edit.Notas : '') +
    '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>';

  const tipoActual = raiz => {
    if (edit) return edit.Tipo_Mov;
    const r = $('input[name="tipo"]:checked', raiz); return r ? r.value : 'Gasto';
  };
  const actualizar = raiz => {
    const t = tipoActual(raiz);
    $$('[data-solo]', raiz).forEach(el => { el.hidden = el.dataset.solo.split(',').indexOf(t) === -1; });
    const sel = $('#f-ID_Categoria', raiz);
    const previa = sel.value;
    const cat = categoriasPara(t);
    sel.innerHTML = cat.map(c => '<option value="' + esc(c[0]) + '"' + (c[0] === (previa || (edit && edit.ID_Categoria) || '') ? ' selected' : '') + '>' + esc(c[1]) + '</option>').join('');
    const etq = $('[data-etiqueta] label', raiz);
    if (etq) etq.textContent = t === 'Mover' ? 'Concepto (opcional)' : 'Concepto';
  };

  await abrirHoja({
    titulo: edit ? 'Editar movimiento' : 'Registrar',
    der: edit ? 'Guardar' : 'Guardar',
    cuerpo: cuerpo,
    alAbrir: raiz => {
      activarEcoDinero(raiz); actualizar(raiz);
      raiz.addEventListener('change', ev => { if (ev.target.name === 'tipo') actualizar(raiz); });
      const v = $('#f-Valor', raiz); if (v) v.focus();
    },
    alGuardar: async raiz => {
      const t = tipoActual(raiz);
      const v = leerFormulario(raiz, CAMPOS_REGISTRO);
      const fecha = $('#f-Fecha', raiz).value;
      const notas = ($('#f-Notas', raiz) || {}).value || '';
      if (v.Valor === '' || v.Valor === undefined || (typeof v.Valor === 'number' && isNaN(v.Valor))) throw new Error('Escribe el valor.');
      if (t !== 'Mover' && !v.Concepto) throw new Error('Escribe el concepto: por ejemplo "Mercado" o "Nómina".');

      let res;
      if (edit) {
        res = await api('editMovimiento', edit.ID_Mov, { Valor: v.Valor, Concepto: v.Concepto, Fecha: fecha, ID_Bolsillo: v.ID_Bolsillo, ID_Categoria: v.ID_Categoria, ID_Item_Ppto: v.ID_Item_Ppto || '', Notas: notas }, vistaActual());
        aplicarEscritura(res); render(); aviso('Cambios guardados');
        return;
      }
      if (t === 'Mover') {
        if (v.Origen === v.Destino) throw new Error('Elige dos bolsillos distintos.');
        res = await api('addTransferencia', { origen: v.Origen, destino: v.Destino, valor: v.Valor, fecha: fecha, concepto: v.Concepto, notas: notas, itemPpto: v.ID_Item_Ppto || '' }, vistaActual());
        recordarBolsillo(v.Origen);
      } else {
        res = await api('addMovimiento', { Tipo_Mov: t, Valor: v.Valor, Concepto: v.Concepto, Fecha: fecha, ID_Bolsillo: v.ID_Bolsillo, ID_Categoria: v.ID_Categoria, ID_Item_Ppto: v.ID_Item_Ppto || '', Notas: notas }, vistaActual());
        recordarBolsillo(v.ID_Bolsillo);
      }
      aplicarEscritura(res); render();
      const id = res.items[0] && res.items[0].ID_Mov;
      aviso(t === 'Mover' ? 'Dinero movido' : (t === 'Gasto' ? 'Gasto registrado' : 'Ingreso registrado'), { deshacer: () => anularYAvisar(id) });
    }
  });
}

async function anularYAvisar(id) {
  try {
    const res = await api('voidMovimiento', id, vistaActual());
    aplicarEscritura(res); render();
    aviso('Movimiento anulado', { deshacer: () => restaurarYAvisar(id) });
  } catch (e) { aviso(e.message, true); }
}

async function restaurarYAvisar(id) {
  try {
    const res = await api('restoreMovimiento', id, vistaActual());
    aplicarEscritura(res); render();
    aviso('Movimiento restaurado');
  } catch (e) { aviso(e.message, true); }
}

// ---------- Detalle de un movimiento ----------

async function abrirDetalleMov(id) {
  const it = buscarMov(id);
  if (!it) return;
  const m = montoMov(it, false);
  const filas = [];
  filas.push(['Valor', '<strong class="m-num ' + (m.clase === 'm-entra' ? 'm-positivo' : '') + '">' + esc(m.texto) + '</strong>']);
  filas.push(['Fecha', esc(etiquetaDia(it.Fecha) + ' · ' + it.Fecha)]);
  if (it.esTransferencia) {
    // En la lista general el traslado viene con Origen y Destino; en la de un bolsillo, como una pata con su contraparte.
    const entra = it.Origen === undefined && it.Valor > 0;
    const sale = it.Origen !== undefined ? it.Origen : (entra ? (it.Contraparte || '') : it.Bolsillo);
    const llega = it.Destino !== undefined ? it.Destino : (entra ? it.Bolsillo : (it.Contraparte || ''));
    filas.push(['Sale de', esc(sale)]); filas.push(['Llega a', esc(llega)]);
  }
  else { filas.push(['Bolsillo', esc(it.Bolsillo + (it.Cuenta && it.Cuenta !== it.Bolsillo ? ' · ' + it.Cuenta : ''))]); }
  if (it.Categoria) filas.push(['Categoría', esc(it.Categoria)]);
  if (it.Subtipo) filas.push(['Origen', esc(it.Subtipo.replace(/_/g, ' '))]);
  if (it.Notas) filas.push(['Notas', esc(it.Notas)]);
  if (it.Anulado) filas.push(['Estado', 'Anulado']);

  let siguiente = null;
  const cuerpo = '<p class="m-subtitulo" style="padding:0 0 var(--m-space-3);margin:0;font-weight:600;color:var(--m-label)">' + esc(it.Concepto) + '</p>' +
    '<dl class="m-detalle">' + filas.map(f => '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>').join('') + '</dl>' +
    (it.Anulado
      ? '<button type="button" class="m-btn m-btn-primary" style="width:100%" data-hoja-acc="restaurar">Restaurar movimiento</button>'
      : (it.Editable ? '<button type="button" class="m-btn m-btn-secondary" style="width:100%;margin-bottom:var(--m-space-2)" data-hoja-acc="editar">Editar</button>' : '') +
        '<button type="button" class="m-accion-peligro" data-hoja-acc="anular">Anular' + (it.esTransferencia ? ' traslado' : '') + '</button>' +
        (!it.Editable && !it.esTransferencia ? '<p class="m-ayuda" style="margin-top:var(--m-space-3)">Este movimiento lo generó la app y no se edita a mano; si te equivocaste, anúlalo y regístralo de nuevo.</p>' : ''));

  await abrirHoja({
    titulo: 'Movimiento', izq: 'Cerrar', sinGuardar: true, cuerpo: cuerpo,
    extra: {
      editar: () => { siguiente = () => abrirRegistrar({ edit: it }); return Promise.resolve(); },
      anular: () => api('voidMovimiento', id, vistaActual()).then(res => { aplicarEscritura(res); render(); aviso('Movimiento anulado', { deshacer: () => restaurarYAvisar(id) }); }),
      restaurar: () => api('restoreMovimiento', id, vistaActual()).then(res => { aplicarEscritura(res); render(); aviso('Movimiento restaurado'); })
    }
  });
  if (siguiente) siguiente();
}

// ---------- Cuadre de una cuenta ----------

async function abrirCuadre(idCuenta) {
  const c = ((App.boot.saldos && App.boot.saldos.cuentas) || []).find(x => x.ID_Cuenta === idCuenta);
  if (!c) return;
  const opcionesAjuste = [['', 'No ajustar: solo guardar el saldo']].concat(c.bolsillos.map(b => [b.ID_Bolsillo, b.Es_Interno ? c.Nombre : b.Nombre]));
  const cuerpo = '<form novalidate data-form="cuadre">' +
    '<p class="m-hoja-mensaje">Moni suma <strong>' + dinero(c.Saldo) + '</strong> en “' + esc(c.Nombre) + '”. Escribe lo que muestra tu banco para compararlos.</p>' +
    htmlCampo({ k: 'Valor', label: 'Saldo según tu banco', tipo: 'dinero', requerido: true }, c.Saldo_Real === null || c.Saldo_Real === undefined ? '' : c.Saldo_Real) +
    '<p id="cuadre-dif" class="m-ayuda" aria-live="polite" style="margin:calc(-1 * var(--m-space-2)) 0 var(--m-space-4)"></p>' +
    '<div class="m-campo" id="cuadre-ajuste" hidden><label class="m-label" for="f-Ajuste">Registrar la diferencia como ajuste en</label>' +
    '<select class="m-input" id="f-Ajuste">' + opcionesAjuste.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('') + '</select>' +
    '<p class="m-ayuda">Un ajuste deja la suma de tus bolsillos igual a la del banco y queda en el historial.</p></div>' +
    '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>';

  await abrirHoja({
    titulo: 'Cuadrar cuenta', cuerpo: cuerpo,
    alAbrir: raiz => {
      activarEcoDinero(raiz);
      const entrada = $('#f-Valor', raiz);
      const calcular = () => {
        const n = leerDinero(entrada.value);
        const dif = $('#cuadre-dif', raiz), aj = $('#cuadre-ajuste', raiz);
        if (n === '' || isNaN(n)) { dif.textContent = ''; aj.hidden = true; return; }
        const d = Math.round((n - c.Saldo) * 100) / 100;
        dif.textContent = Math.abs(d) < 0.005 ? 'Cuadra: no hay diferencia.' : 'Diferencia: ' + (d > 0 ? 'el banco muestra ' : 'Moni suma ') + dinero(Math.abs(d)) + ' más.';
        aj.hidden = Math.abs(d) < 0.005;
      };
      entrada.addEventListener('input', calcular); calcular(); entrada.focus();
    },
    alGuardar: async raiz => {
      const n = leerDinero($('#f-Valor', raiz).value);
      if (n === '' || isNaN(n)) throw new Error('Escribe el saldo que muestra tu banco.');
      const ajuste = $('#cuadre-ajuste', raiz).hidden ? '' : $('#f-Ajuste', raiz).value;
      const res = await api('cuadre', idCuenta, n, ajuste, vistaActual());
      aplicarEscritura(res); render();
      aviso(Math.abs(res.diferenciaAnterior) < 0.005 ? 'La cuenta cuadra' : (res.ajustado ? 'Cuenta cuadrada con un ajuste' : 'Saldo guardado'));
    }
  });
}

// ---------------------------------------------------------------------------
// Presupuesto del mes, plantilla, nómina y distribución
