<script>
/* Moni — parte de la aplicación: un bloque de script propio (HTML válido para Apps Script), incluido en el orden de PARTES_JS en Code.gs. */
'use strict';
// ---------------------------------------------------------------------------
// Borrar todos los datos de la persona (Ajustes → Privacidad)
// ---------------------------------------------------------------------------

function vBorrar() {
  const n = t => listaAsist(t).length;
  const q = (cant, uno, varios) => cant + ' ' + (cant === 1 ? uno : varios);
  return {
    titulo: 'Borrar mis datos',
    html:
      '<div class="m-group" style="padding:var(--m-space-4)">' +
      '<p><strong>Esta acción no se puede deshacer.</strong></p>' +
      '<p class="m-subtitulo-cuerpo">Moni queda como recién instalada y vuelves a ver la bienvenida. Úsala para empezar de cero o si ya no vas a usar la app.</p>' +
      '<h2 class="m-seccion-titulo" style="padding-left:0">Se borra</h2><ul class="m-lista-simple">' +
      '<li>' + esc(q(n('Bancos'), 'banco', 'bancos') + ', ' + q(n('Cuentas'), 'cuenta', 'cuentas') + ', ' + q(n('Bolsillos'), 'bolsillo', 'bolsillos') + ' y ' + q(n('Tarjetas'), 'tarjeta', 'tarjetas')) + '</li>' +
      '<li>Todos tus movimientos, presupuestos, nóminas, créditos, regalos y suscripciones</li>' +
      '<li>Tu nombre y tus preferencias de apariencia</li></ul>' +
      '<h2 class="m-seccion-titulo" style="padding-left:0">No se borra</h2><ul class="m-lista-simple">' +
      '<li>Las copias de seguridad en tu Drive (carpeta “Moni Respaldos”): guardan tus datos. Al confirmar puedes mandarlas a la papelera.</li>' +
      '<li>Los archivos que hayas guardado en tu Drive, como extractos en PDF</li></ul>' +
      '<button class="m-btn m-btn-peligro" style="width:100%" data-acc="borrar-todo">Borrar todos mis datos…</button></div>' +
      seccion('¿Quieres conservar una copia?', irA('ajustes/respaldos', { icono: 'capas', titulo: 'Crear un respaldo', sub: 'Se guarda en tu Drive antes de borrar' }))
  };
}

/** Todo lo que la app tenía en memoria era de lo que se acaba de borrar: se descarta. */
function olvidarDatosLocales() {
  [App.det, App.mov, App.ppto, App.nom, App.deudas, App.tar, App.cre, App.aho, App.ahoC, App.reg, App.anual, App.resp, App.pag, App.rec, App.ing, App.cdt].forEach(s => {
    s.data = null; s.error = null; s.cargando = false;
    ['id', 'mes', 'anio'].forEach(k => { if (k in s) s[k] = null; });
    if ('idEsc' in s) s.idEsc = '';
    if ('texto' in s) s.texto = '';
    if ('anulados' in s) s.anulados = false;
  });
  App.plantillaEsc = null; App.inactivos = {}; App.proximosViejos = false;
  App.inicioGraf = { data: null, cargando: false, viejo: false, intentado: false };
  App.asist = { activo: false, paso: null, omitido: false, ultimo: {} };
  recordarAsistenteOmitido(false);
  try { localStorage.removeItem('moni.ultimoBolsillo'); } catch (e) {}
}

/** Ventana de confirmación: hay que escribir BORRAR; el servidor lo vuelve a exigir. */
async function abrirBorrar() {
  let borrado = false;
  await abrirHoja({
    titulo: 'Borrar todo', sinGuardar: true,
    cuerpo: '<form novalidate data-form="borrar">' +
      '<p class="m-hoja-mensaje"><strong>Se borrará para siempre toda tu información</strong>: bancos, cuentas, bolsillos, tarjetas, movimientos, presupuestos, nómina, créditos, regalos y suscripciones. Moni volverá a pedirte los primeros pasos.</p>' +
      '<div class="m-campo"><label class="m-label" for="f-frase">Para confirmar, escribe BORRAR</label>' +
      '<input class="m-input" id="f-frase" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>' +
      htmlCampo({ k: 'respaldos', label: 'También mandar a la papelera mis respaldos de Drive', tipo: 'interruptor', ayuda: 'Las copias de “Moni Respaldos” guardan tus datos. Si no las borras, siguen en tu Drive.' }, false) +
      '<button type="button" class="m-btn m-btn-peligro" style="width:100%" data-hoja-acc="borrar" disabled>Borrar todos mis datos</button>' +
      '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>',
    alAbrir: raiz => {
      const frase = $('#f-frase', raiz), boton = $('[data-hoja-acc="borrar"]', raiz);
      frase.addEventListener('input', () => { boton.disabled = frase.value.trim().toUpperCase() !== 'BORRAR'; });
    },
    extra: {
      borrar: async raiz => {
        await api('resetAllData', $('#f-frase', raiz).value, { respaldos: $('#f-respaldos', raiz).checked });
        borrado = true;
      }
    }
  });
  if (!borrado) return;
  olvidarDatosLocales();
  App.pila = ['inicio'];
  await cargar(); // vuelve a leer todo: como no queda nada, aparece la bienvenida
  aviso('Listo: se borró toda tu información');
}

(function () {
  const dlg = $('#hoja');
  dlg.addEventListener('click', ev => { if (hojaActual) hojaActual.alClic(ev); });
  dlg.addEventListener('submit', ev => { if (hojaActual) hojaActual.alEnviar(ev); });
  // Esc o cierre nativo. El evento llega un instante DESPUÉS de cerrar: si mientras tanto se abrió otra hoja (Editar desde el
  // detalle), no hay que cerrarla.
  dlg.addEventListener('close', () => { if (hojaActual && !dlg.open) hojaActual.finalizar(); });
})();

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-acc]');
  if (!el || el.closest('dialog')) return;
  const fn = ACCIONES[el.dataset.acc];
  if (fn) { ev.preventDefault(); fn(el); }
});

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.dataset.accCambio === 'inactivos') {
    App.inactivos[t.dataset.tabla] = t.checked;
    render();
    const nuevo = $('#ver-inactivos'); if (nuevo) nuevo.focus();
    return;
  }
  if (t.dataset.accCambio === 'pagado') {
    // Marcar o desmarcar nunca es solo una casilla: se abre la confirmación y la casilla vuelve a su estado hasta que termine.
    const quiereMarcar = t.checked;
    t.checked = !quiereMarcar;
    if (quiereMarcar) abrirCompletarRenglon(t.dataset.id); else reabrirRenglon(t.dataset.id);
    return;
  }
  if (t.dataset.accCambio === 'nom-incl') {
    recalcularNomina(o => { o.incluir = o.incluir || {}; o.incluir[t.dataset.clave] = t.checked; });
    return;
  }
  if (t.dataset.accCambio === 'nom-dias') {
    const campo = { ordinario: 'dias', prima: 'diasPrima', vacaciones: 'diasVacaciones' }[t.dataset.que];
    const n = t.value === '' ? '' : Math.max(0, Number(t.value) || 0);
    recalcularNomina(o => { o[campo] = n; if (n !== '' && t.dataset.que !== 'ordinario') { o.incluir = o.incluir || {}; o.incluir[t.dataset.que] = n > 0; } });
    return;
  }
  if (t.dataset.accCambio === 'tasa-auto') {
    try {
      const r = await api('saveTasaAuto', t.checked);
      await refrescarParcial({ config: true, saldos: true }); render();
      aviso(r.activa ? (r.resultado ? 'Se actualizará sola cada día' : 'Activada. ' + (r.aviso || '')) : 'Actualización automática desactivada');
    } catch (e) { t.checked = !t.checked; aviso(e.message, true); }
    return;
  }
  if (t.name === 'log-filtro') { App.log.soloErrores = t.value === 'errores'; cargarRegistro(); return; }
  if (t.dataset.accCambio === 'plantilla-esc') { App.plantillaEsc = t.value; render(); return; }
  if (t.id === 'reg-anio') { App.reg.anio = Number(t.value); App.reg.data = null; render(); return; }
  if (t.id === 'anual-anio') { App.anual.anio = Number(t.value); App.anual.data = null; render(); return; }
  if (t.dataset.accCambio === 'resp-auto') {
    try { App.resp.data = await api('setRespaldoAuto', t.checked); aviso(t.checked ? 'Copias automáticas activadas' : 'Copias automáticas desactivadas'); }
    catch (e) { t.checked = !t.checked; aviso(e.message, true); }
    return;
  }
  if (t.dataset.accCambio === 'anulados') {
    const st = t.dataset.vista === 'det' ? App.det : App.mov;
    st.anulados = t.checked; st.data = null;
    render();
    const nuevo = $('#ver-anulados'); if (nuevo) nuevo.focus();
    return;
  }
  if (t.name === 'tema' || t.name === 'acento') {
    const clave = t.name === 'tema' ? 'Tema' : 'Color_Acento';
    const anterior = App.boot.config[clave];
    App.boot.config[clave] = t.value;
    aplicarApariencia();
    try { await api('saveConfigParam', clave, t.value); }
    catch (e) { App.boot.config[clave] = anterior; aplicarApariencia(); render(); aviso(e.message, true); return; }
    if (t.name === 'tema') {
      // Los colores de las muestras dependen del tema: se vuelve a pintar y se devuelve el foco.
      render();
      const marcado = $('input[name="tema"]:checked'); if (marcado) marcado.focus();
    }
  }
});

document.addEventListener('submit', async ev => {
  const f = ev.target;
  if (f.dataset.form === 'recordatorios') {
    ev.preventDefault();
    const caja = $('#rec-error', f), boton = $('button[type=submit]', f);
    caja.hidden = true; boton.disabled = true; boton.textContent = 'Guardando…';
    try {
      const v = leerFormulario(f, CAMPOS_REC);
      const r = await api('saveRecordatorios', { activos: v.activos, diasAntes: Number(v.diasAntes), hora: Number(v.hora), nomina: v.nomina });
      App.rec.data = r;
      await refrescarParcial({ config: true }); render();
      aviso(r.activos ? 'Recordatorios activos: ' + r.sincronizado.total + (r.sincronizado.total === 1 ? ' pago' : ' pagos') + ' en tu calendario' : 'Recordatorios desactivados');
    } catch (e) { caja.textContent = e.message; caja.hidden = false; boton.disabled = false; boton.textContent = 'Guardar'; }
    return;
  }
  if (f.dataset.form === 'tasas') {
    ev.preventDefault();
    const caja = $('#tasas-error', f), boton = $('button[type=submit]', f);
    caja.hidden = true; boton.disabled = true;
    try {
      for (const inp of $$('[data-tasa]', f)) {
        const d = inp.dataset.tasa, n = leerDinero(inp.value);
        if (n !== '' && isNaN(n)) throw new Error('Revisa la tasa del ' + d + '.');
        const nueva = n === '' ? '' : String(n);
        if (String(cfg('Tasa_' + d)) !== nueva) await api('saveTasaDivisa', d, nueva);
      }
      await refrescarParcial({ config: true, saldos: true }); render(); aviso('Tasas guardadas');
    } catch (e) { caja.textContent = e.message; caja.hidden = false; }
    boton.disabled = false;
    return;
  }
  if (f.dataset.form === 'asistente') { ev.preventDefault(); enviarPasoAsist(f, false); return; }
  if (f.dataset.form === 'parametros' || f.dataset.form === 'respaldos') {
    ev.preventDefault();
    const caja = $('#param-error', f), boton = $('button[type=submit]', f);
    caja.hidden = true; boton.disabled = true;
    const mapa = {};
    $$('[data-param]', f).forEach(i => {
      let v = i.value.trim();
      if (i.dataset.pct) { const n = Number(v.replace(',', '.')); v = isFinite(n) && v !== '' ? String(Math.round(n * 100) / 10000) : v; }
      else if (i.getAttribute('inputmode') === 'decimal') { v = String(leerDinero(v)); }
      mapa[i.dataset.param] = v;
    });
    try {
      const r = await api('saveConfigParams', mapa);
      Object.keys(r).forEach(k => { App.boot.config[k] = r[k]; });
      if (f.dataset.form === 'respaldos') App.resp.data = null;
      await refrescarParcial({ config: true }); // los avisos de Inicio (por ejemplo, el del salario mínimo) se recalculan
      aviso('Parámetros guardados'); render();
    } catch (e) { caja.textContent = e.message; caja.hidden = false; }
    boton.disabled = false;
    return;
  }
  if (f.dataset.form !== 'perfil') return;
  ev.preventDefault();
  const boton = $('button[type=submit]', f);
  boton.disabled = true;
  try {
    await api('saveConfigParam', 'Nombre_Usuario', $('#f-nombre', f).value);
    const zona = $('#f-zona', f);
    if (zona && zona.value !== (cfg('Zona_Horaria') || 'America/Bogota')) await api('saveConfigParam', 'Zona_Horaria', zona.value);
    await refrescarParcial({ config: true });
    aviso('Guardado');
    render();
  } catch (e) { aviso(e.message, true); }
  boton.disabled = false;
});

document.addEventListener('input', ev => {
  if (ev.target.id !== 'buscar-mov') return;
  App.mov.texto = ev.target.value;
  const caja = $('#lista-mov');
  if (caja) caja.innerHTML = htmlListaMov(filtrarMov(App.mov.data ? App.mov.data.items : []), false);
});

window.addEventListener('scroll', () => { $('#barra').classList.toggle('m-escrolado', window.scrollY > 40); }, { passive: true });

cargar();
</script>
