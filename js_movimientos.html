<script>
/* Moni — parte de la aplicación: un bloque de script propio (HTML válido para Apps Script), incluido en el orden de PARTES_JS en Code.gs. */
'use strict';
// ---------------------------------------------------------------------------
// Movimientos: listas, detalle de bolsillo, registrar, detalle de movimiento y cuadre
// ---------------------------------------------------------------------------

function esqueleto(filas) {
  let h = '<div class="m-group" role="status" aria-busy="true" aria-label="Cargando">';
  for (let i = 0; i < filas; i++) {
    h += '<div class="m-esqueleto"><span class="m-esq-bloque"></span><span style="flex:1"><span class="m-esq-linea" style="display:block;width:' + (55 + (i * 13) % 30) + '%"></span>' +
      '<span class="m-esq-linea" style="display:block;width:32%;margin-top:8px"></span></span><span class="m-esq-linea" style="width:64px"></span></div>';
  }
  return h + '</div>';
}

/** Monto con su signo y color; el signo va en el texto para no depender solo del color. */
function montoMov(i, enBolsillo) {
  const d = i.Divisa;
  // Una conversión sale en una moneda y llega en otra: se ven las dos
  if (i.esTransferencia && !enBolsillo) return { texto: dinero(i.Valor, d) + (i.DivisaDestino ? ' → ' + dinero(i.ValorDestino, i.DivisaDestino) : ''), clase: '' };
  const v = Number(i.Valor) || 0;
  return v >= 0 && !i.esTransferencia
    ? { texto: '+' + dinero(v, d), clase: 'm-entra' }
    : { texto: (v >= 0 ? '+' : '−') + dinero(Math.abs(v), d), clase: '' };
}

function filaMov(i, enBolsillo) {
  const m = montoMov(i, enBolsillo);
  let sub;
  if (i.esTransferencia) {
    sub = enBolsillo ? (i.Valor > 0 ? 'Desde ' : 'Hacia ') + esc(i.Contraparte || '') : esc(i.Origen) + ' → ' + esc(i.Destino);
  } else {
    sub = (enBolsillo ? '' : esc(i.Bolsillo)) + (i.Categoria ? (enBolsillo ? '' : ' · ') + esc(i.Categoria) : '');
  }
  return fila({
    titulo: esc(i.Concepto) + (i.Afecta_Saldos === false ? ' <span class="m-insignia" title="No cambió tus saldos">Histórico</span>' : ''), sub: sub + (i.Anulado ? (sub ? ' · ' : '') + 'Anulado' : ''),
    final: '<span class="m-monto ' + m.clase + '">' + m.texto + '</span>',
    clase: i.Anulado ? 'm-anulado' : '', attrs: 'data-acc="mov" data-id="' + esc(i.ID_Mov) + '"'
  });
}

/** Lista agrupada por día. */
function htmlListaMov(items, enBolsillo) {
  if (!items.length) return '';
  let h = '<div class="m-group">';
  let dia = '';
  items.forEach(i => {
    if (i.Fecha !== dia) { dia = i.Fecha; h += '<div class="m-dia">' + esc(etiquetaDia(i.Fecha)) + '</div>'; }
    h += filaMov(i, enBolsillo);
  });
  return h + '</div>';
}

function navegadorMes(vista, mes, maxMes) {
  const esActual = mes >= (maxMes || App.boot.hoy.slice(0, 7));
  return '<div class="m-mes-nav"><button class="m-btn-texto" data-acc="mes" data-vista="' + vista + '" data-delta="-1" aria-label="Mes anterior">' + ico('izq', 'm-icon-sm') + '</button>' +
    '<strong aria-live="polite">' + esc(mesTexto(mes)) + '</strong>' +
    '<button class="m-btn-texto" data-acc="mes" data-vista="' + vista + '" data-delta="1" aria-label="Mes siguiente"' + (esActual ? ' disabled' : '') + '>' + ico('der', 'm-icon-sm') + '</button></div>';
}

function interruptorAnulados(vista, marcado) {
  return '<div class="m-seccion" style="margin-top:var(--m-space-5)"><div class="m-group"><div class="m-row"><div class="m-interruptor-fila" style="width:100%">' +
    '<label for="ver-anulados">Mostrar movimientos anulados</label><span class="m-interruptor"><input type="checkbox" role="switch" id="ver-anulados" data-acc-cambio="anulados" data-vista="' + vista + '"' + (marcado ? ' checked' : '') + '><i></i></span></div></div></div></div>';
}

function cambiarMes(vista, delta) {
  const st = vista === 'det' ? App.det : vista === 'ppto' ? App.ppto : vista === 'nom' ? App.nom : vista === 'aho' ? App.ahoC : App.mov;
  st.mes = mesMas(st.mes, delta); st.data = null; st.error = null;
  if (vista === 'nom') st.opciones = null; // cada mes parte de sus valores por defecto
  render();
}

function resumenMes(t) {
  return '<div class="m-group" style="padding:var(--m-space-3) var(--m-space-4);margin-bottom:var(--m-space-4)"><div class="m-resumen-fila" style="margin:0">' +
    '<div><div class="m-resumen-etiqueta">Entró</div><strong class="m-num m-positivo">' + dinero(t.ingresos, t.Divisa) + '</strong></div>' +
    '<div><div class="m-resumen-etiqueta">Salió</div><strong class="m-num">' + dinero(t.gastos, t.Divisa) + '</strong></div></div></div>';
}

function bloqueError(mensaje, accion) {
  return '<div class="m-vacio">' + ico('alerta') + '<h2>No se pudo cargar</h2><p>' + esc(mensaje) + '</p><button class="m-btn m-btn-secondary" data-acc="' + accion + '">Reintentar</button></div>';
}

// ---------- Detalle de un bolsillo ----------

function vBolsillo(id) {
  const inf = infoBolsillo(id);
  if (!inf) return { titulo: 'Bolsillo', html: vacio('alerta', 'Este bolsillo ya no existe', 'Puede que se haya desactivado.') };
  const d = App.det;
  if (d.id !== id) Object.assign(d, { id: id, mes: App.boot.hoy.slice(0, 7), data: null, error: null, cargando: false, anulados: false });

  const b = inf.b, c = inf.c;
  let html = '<div class="m-group m-saldo-grande"><div class="m-resumen-etiqueta">' + esc(c.Banco) + ' · ' + esc(c.Nombre) + '</div>' +
    '<div class="m-resumen-cifra m-num ' + claseSaldo(b.Saldo) + '">' + dinero(b.Saldo, c.Divisa) + '</div>' +
    '<div class="m-acciones-fila"><button class="m-btn m-btn-primary" data-acc="registrar" data-bolsillo="' + esc(id) + '">Registrar</button>' +
    '<button class="m-btn m-btn-secondary" data-acc="mover" data-bolsillo="' + esc(id) + '">Mover dinero</button></div></div>';

  html += '<div style="height:var(--m-space-4)"></div>' + navegadorMes('det', d.mes);
  if (d.error) html += bloqueError(d.error, 'recargar-det');
  else if (!d.data) html += esqueleto(4);
  else {
    if (d.data.evolucion) html += tarjetaViz('bol-saldo', 'Saldo al cierre de cada mes', lineaSaldo(d.data.evolucion, c.Divisa, 150), tablaSaldo(d.data.evolucion, c.Divisa));
    html += resumenMes(d.data.totales);
    html += d.data.movimientos.length ? htmlListaMov(d.data.movimientos, true)
      : vacio('presupuesto', 'Sin movimientos en este mes', 'Cuando registres un gasto, un ingreso o un traslado de este bolsillo, aparecerá aquí.');
    if (d.data.hayMas) html += '<p class="m-seccion-pie">Se muestran los 300 movimientos más recientes del mes.</p>';
    html += interruptorAnulados('det', d.anulados);
  }

  return {
    titulo: nombreBolsillo(b, c),
    acciones: '<button class="m-btn-texto" data-acc="editar-bolsillo" data-id="' + esc(id) + '">Editar</button>',
    html: html,
    despues: () => { if (!d.data && !d.cargando && !d.error) cargarDetalle(); }
  };
}

function cargarDetalle() {
  const d = App.det, id = d.id, mes = d.mes, an = d.anulados;
  return cargarEn(d, 'bolsillo/' + id, 'getDetalleBolsillo', [id, mes, an], () => d.id === id && d.mes === mes && d.anulados === an);
}

// ---------- Lista de todos los movimientos ----------

function filtrarMov(items) {
  const t = (App.mov.texto || '').trim().toLowerCase();
  if (!t) return items;
  return items.filter(i => [i.Concepto, i.Notas, i.Bolsillo, i.Categoria, i.Origen, i.Destino].some(x => String(x || '').toLowerCase().indexOf(t) !== -1));
}

function vMovimientos() {
  const m = App.mov;
  if (!m.mes) m.mes = App.boot.hoy.slice(0, 7);
  let html = navegadorMes('mov', m.mes) +
    '<input type="search" class="m-input m-buscar" id="buscar-mov" placeholder="Buscar por concepto, bolsillo o categoría" aria-label="Buscar en los movimientos" value="' + esc(m.texto) + '">';
  if (m.error) html += bloqueError(m.error, 'recargar-mov');
  else if (!m.data) html += esqueleto(6);
  else {
    html += resumenMes(m.data.totales) + htmlMovGraficos(m.data.items) + '<div id="lista-mov">';
    const lista = filtrarMov(m.data.items);
    html += lista.length ? htmlListaMov(lista, false)
      : vacio('presupuesto', m.texto ? 'Nada coincide con la búsqueda' : 'Sin movimientos en este mes', m.texto ? 'Prueba con otra palabra.' : 'Usa el botón Registrar para anotar un gasto o un ingreso.');
    html += '</div>';
    if (m.data.hayMas) html += '<p class="m-seccion-pie">Se muestran los 300 movimientos más recientes del mes.</p>';
    html += interruptorAnulados('mov', m.anulados);
  }
  return { titulo: 'Movimientos', html: html, despues: () => { if (!m.data && !m.cargando && !m.error) cargarMov(); } };
}

function cargarMov() {
  const m = App.mov, mes = m.mes, an = m.anulados;
  return cargarEn(m, 'movimientos', 'getMovimientos', [{ mes: mes, incluirAnulados: an, limite: 300 }], () => m.mes === mes && m.anulados === an);
}

// ---------- Registrar, mover y editar ----------

/** Opciones de bolsillos agrupadas por cuenta, con su saldo. */
function opcionesBolsillos() {
  return ((App.boot.saldos && App.boot.saldos.cuentas) || []).filter(c => c.bolsillos.length).map(c => ({
    grupo: c.Banco + ' · ' + c.Nombre + (c.Divisa !== 'COP' ? ' (' + c.Divisa + ')' : ''),
    opciones: c.bolsillos.map(b => [b.ID_Bolsillo, nombreBolsillo(b, c) + ' — ' + dinero(b.Saldo, c.Divisa)])
  }));
}

function ultimoBolsillo() { try { return localStorage.getItem('moni.ultimoBolsillo') || ''; } catch (e) { return ''; } }
function recordarBolsillo(id) { try { localStorage.setItem('moni.ultimoBolsillo', id); } catch (e) {} }

const CAMPOS_REGISTRO = [
  { k: 'Valor', tipo: 'dinero' }, { k: 'Concepto', tipo: 'texto' }, { k: 'ID_Bolsillo', tipo: 'select' },
  { k: 'Origen', tipo: 'select' }, { k: 'Destino', tipo: 'select' }, { k: 'ID_Categoria', tipo: 'select' },
  { k: 'Fecha', tipo: 'texto' }, { k: 'Notas', tipo: 'texto' }, { k: 'ID_Item_Ppto', tipo: 'select' }, { k: 'Afecta', tipo: 'interruptor' }
];

function categoriasPara(tipo) {
  const t = tipo === 'Ingreso' ? 'Ingreso' : 'Gasto';
  return [['', 'Sin categoría']].concat(activos('Categorias').filter(c => tipo === 'Ajuste' || c.Tipo === t).map(c => [c.ID_Categoria, c.Nombre]));
}

/**
 * Cómo se comporta el formulario de registro en cada caso. Sin `o.para` es el registro libre (gasto, ingreso o mover);
 * con `o.para` es pagar un cobro, recibir un ingreso recurrente, comprar un regalo, completar un renglón del presupuesto,
 * una compra con una tarjeta concreta o sacar/reponer dinero del ahorro. Cada modo fija lo que ya se sabe y dice cómo
 * se guarda; los campos, los cargos y las validaciones son los mismos para todos.
 */
function modoRegistro(o) {
  const p = o.para || {};
  const libre = { tipos: ['Gasto', 'Ingreso', 'Mover'], conTarjetas: true, renglon: true, categoria: true, afecta: true, notas: true, cargos: true, moneda: true, fuente: true };
  if (o.edit) return Object.assign({}, libre, { titulo: 'Editar movimiento', tipos: [o.edit.Tipo_Mov], conTarjetas: false, cargos: false, moneda: false, fuente: false });
  if (!p.tipo) return Object.assign({}, libre, { titulo: 'Registrar' });

  const comun = { conTarjetas: false, renglon: false, categoria: false, afecta: false, notas: false, cargos: false, moneda: false, fuente: false };
  if (p.tipo === 'compra') {
    const t = porId('Tarjetas', 'ID_Tarjeta', p.idTarjeta);
    return Object.assign({}, libre, { titulo: 'Compra con ' + (t ? t.Nombre : 'la tarjeta'), tipos: ['Gasto'], medio: 'T:' + p.idTarjeta });
  }
  if (p.tipo === 'cobro') {
    const s = p.item;
    return Object.assign({}, comun, {
      titulo: 'Pagar ' + s.Nombre, der: 'Pagar', tipos: ['Gasto'], conTarjetas: true, cargos: true, conceptoFijo: s.Nombre,
      valor: s.Valor || '', valorEtiqueta: s.Tipo === 'Servicio' ? 'Cuánto pagaste' : 'Valor',
      medio: s.ID_Tarjeta ? 'T:' + s.ID_Tarjeta : (s.ID_Bolsillo || ''), soloPesos: true,
      nota: s.Tipo === 'Servicio' ? 'El valor que escribas queda como el estimado para el próximo cobro.' : '',
      guardar: async (v, raiz) => {
        const res = await api('paySuscripcion', s.ID_Suscripcion, { Valor: v.Valor, Fecha: v.Fecha, ID_Bolsillo: v.medioTarjeta ? '' : v.ID_Bolsillo, ID_Tarjeta: v.medioTarjeta || '', cargos: leerCargos(raiz) });
        aplicarEscritura(res); App.pag.data = res.suscripciones; App.proximosViejos = true; render();
        aviso('Pago registrado' + (res.proximo ? ' · próximo cobro ' + res.proximo : ''), { deshacer: async () => {
          try { const u = await api('undoPagoSuscripcion', s.ID_Suscripcion, res.anterior, res.idMov, res.idCompra, res.idItem || ''); aplicarEscritura(u); App.pag.data = u.suscripciones; render(); aviso('Pago deshecho'); }
          catch (e) { aviso(e.message, true); }
        } });
      }
    });
  }
  if (p.tipo === 'ingreso') {
    const i = p.item;
    return Object.assign({}, comun, {
      titulo: 'Recibí ' + i.Nombre, tipos: ['Ingreso'], conceptoFijo: i.Nombre, valor: i.Valor || '', valorEtiqueta: 'Cuánto recibiste',
      medio: i.ID_Bolsillo || '', medioEtiqueta: 'Llegó a', soloPesos: true, nota: 'Por defecto, el monto esperado. Escribe el valor real si fue otro.',
      guardar: async v => {
        const res = await api('receiveIngreso', i.ID_Ingreso, { Valor: v.Valor, Fecha: v.Fecha, ID_Bolsillo: v.ID_Bolsillo });
        aplicarEscritura(res); App.ing.data = res.ingresos; render();
        aviso('Ingreso registrado · próximo ' + res.proximo, { deshacer: async () => {
          try { const u = await api('undoIngreso', i.ID_Ingreso, res.anterior, res.idMov); aplicarEscritura(u); App.ing.data = u.ingresos; render(); aviso('Ingreso deshecho'); }
          catch (e) { aviso(e.message, true); }
        } });
      }
    });
  }
  if (p.tipo === 'regalo') {
    const it = p.item;
    const pref = it.ID_Bolsillo_Plan || (opcionesDestino(false).map(g => (g.opciones.find(x => /regalo/i.test(x[1])) || [])[0]).find(Boolean) || '');
    return Object.assign({}, comun, {
      titulo: it.ParaMi ? 'Registrar la compra' : 'Compra de regalo', tipos: ['Gasto'], conTarjetas: true, soloPesos: true, valor: it.Estimado - it.Real > 0 ? it.Estimado - it.Real : '', valorEtiqueta: 'Cuánto costó',
      conceptoFijo: it.ParaMi ? (it.Idea || it.CategoriaNombre || 'Compra de tu lista de deseos') : 'Regalo para ' + it.Persona + (it.Idea ? ' · ' + it.Idea : ''), medio: pref,
      ayudaTarjeta: 'No sale dinero ahora. Moni te recordará pasar el valor ' + (it.BolsilloPlan ? 'de “' + it.BolsilloPlan + '” ' : '') + 'a la reserva de la tarjeta, y el aviso sigue hasta que registres ese traslado.',
      guardar: async v => {
        const res = await api('payRegalo', it.ID_Regalo, v.Valor, v.medioTarjeta ? 'T:' + v.medioTarjeta : v.ID_Bolsillo, v.Fecha);
        aplicarEscritura(res); aplicarRegalos(res.regalos); App.tar.data = null; App.deudas.data = null; render();
        aviso(res.regalos.pendientes && res.regalos.pendientes.some(x => x.ID_Regalo === it.ID_Regalo) ? 'Compra registrada · falta mover el dinero a la reserva' : 'Compra registrada');
      }
    });
  }
  if (p.tipo === 'renglon') {
    const it = p.item, soloAgregar = !!p.soloAgregar;
    const esCredito = it.Tipo === 'Cuota' && !!it.ID_Credito, esTarjeta = it.Tipo === 'Gasto' && !!it.ID_Tarjeta;
    const mueve = it.Tipo !== 'Gasto' && !esCredito; // ahorro, fondo o cuota sin crédito: un traslado hacia el bolsillo del renglón
    const tj = esTarjeta ? porId('Tarjetas', 'ID_Tarjeta', it.ID_Tarjeta) : null;
    return Object.assign({}, comun, {
      titulo: soloAgregar ? 'Agregar un movimiento' : 'Marcar como completo', der: soloAgregar ? 'Agregar' : 'Confirmar',
      tipos: [mueve ? 'Mover' : 'Gasto'], conceptoFijo: it.Concepto, existentes: it.ID_Item, soloPesos: true,
      valor: Math.max(it.Restante, 0) || it.Plan, valorAyuda: 'Lo planeado es ' + dinero(it.Plan) + (it.Real > 0 ? ' y ya llevas ' + dinero(it.Real) : '') + '.',
      medio: esCredito ? '' : (mueve ? (ultimoBolsillo() !== it.ID_Bolsillo_Destino ? ultimoBolsillo() : '') : (it.ID_Bolsillo_Destino || ultimoBolsillo())),
      medioEtiqueta: esTarjeta ? 'Se aparta de' : (mueve ? 'Sale de' : (esCredito ? 'Pagas desde' : 'Pagaste desde')),
      medioVacio: esCredito ? 'El de siempre de este crédito' : (esTarjeta ? 'El bolsillo del renglón' : ''),
      destinoFijo: mueve ? it.ID_Bolsillo_Destino : '', destinoTexto: it.Bolsillo || 'el bolsillo del renglón',
      nota: esCredito ? 'Se registra como el pago de la cuota del crédito, con su cronograma.'
        : (esTarjeta ? 'Se registra como una compra con ' + (tj ? tj.Nombre : 'la tarjeta') + '. El dinero se aparta del bolsillo que elijas.'
        : (mueve ? 'El dinero se traslada al bolsillo “' + (it.Bolsillo || 'de destino') + '”.' : 'Se registra como un gasto de ese bolsillo.')),
      guardar: async (v, raiz) => {
        const existente = ($('#f-Existente', raiz) || {}).value || '';
        const datos = {};
        if (existente) datos.ID_Mov = existente;
        else {
          const origen = mueve ? v.Origen : v.ID_Bolsillo;
          if (!origen && !esCredito && !(esTarjeta && it.ID_Bolsillo_Destino)) throw new Error('Elige el bolsillo.');
          Object.assign(datos, { Valor: v.Valor, Fecha: v.Fecha, ID_Bolsillo: origen || '' });
        }
        if (soloAgregar) datos.Completar = false;
        const res = await api('payRenglonConfirmado', it.ID_Item, datos, vistaActual());
        if (datos.ID_Bolsillo) recordarBolsillo(datos.ID_Bolsillo);
        aplicarEscritura(res); aplicarPresupuesto(res.presupuesto);
        if (esCredito) App.cre.data = null;
        if (esCredito || esTarjeta) { App.tar.data = null; App.deudas.data = null; }
        render();
        aviso(soloAgregar ? 'Movimiento agregado' : 'Renglón completo', { deshacer: () => desmarcarRenglon(it.ID_Item, true) });
      }
    });
  }
  if (p.tipo === 'meta') {
    // Aportar a una meta: un traslado hacia su bolsillo (cuenta en el renglón de la meta si el mes tiene presupuesto)
    const m = p.item;
    return Object.assign({}, comun, {
      titulo: 'Aportar a ' + m.Nombre, der: 'Aportar', tipos: ['Mover'], soloPesos: true,
      conceptoFijo: 'Aporte a la meta ' + m.Nombre, valor: Math.max(0, Math.round((m.planMes - m.aportadoMes) * 100) / 100) || '',
      valorAyuda: m.planMes > 0 ? 'Este mes planeaste ' + dinero(m.planMes) + (m.aportadoMes > 0 ? ' y ya llevas ' + dinero(m.aportadoMes) : '') + '.' : '',
      destinoFijo: m.ID_Bolsillo, destinoTexto: m.Bolsillo || 'el bolsillo de la meta',
      medio: ultimoBolsillo() !== m.ID_Bolsillo ? ultimoBolsillo() : '',
      guardar: async v => {
        const res = await api('addAporteMeta', m.ID_Meta, v.Origen, v.Valor, v.Fecha);
        recordarBolsillo(v.Origen);
        aplicarEscritura(res); aplicarMetas(res); render();
        aviso('Aporte registrado · llevas ' + dinero(res.meta.ahorrado) + ' de ' + dinero(res.meta.Monto_Objetivo), { deshacer: () => anularYAvisar(res.items[0] && res.items[0].ID_Mov) });
      }
    });
  }
  if (p.tipo === 'usoMeta') {
    // Usar el dinero de la meta (comprar lo que era): un gasto desde su bolsillo
    const m = p.item;
    return Object.assign({}, comun, {
      titulo: 'Usar el dinero de ' + m.Nombre, tipos: ['Gasto'], soloPesos: true, categoria: true, notas: false,
      medioFijo: m.ID_Bolsillo, medioTexto: m.Bolsillo || 'el bolsillo de la meta', medioEtiqueta: 'Sale de',
      nota: 'Queda como un gasto de la meta. Lo ahorrado no baja: lo usado se muestra aparte.',
      guardar: async v => {
        if (!v.Concepto) throw new Error('Escribe en qué lo usaste.');
        const res = await api('addUsoMeta', m.ID_Meta, v.Valor, v.Fecha, v.Concepto, v.ID_Categoria || '');
        aplicarEscritura(res); aplicarMetas(res); render();
        aviso('Gasto registrado', { deshacer: () => anularYAvisar(res.items[0] && res.items[0].ID_Mov) });
      }
    });
  }
  if (p.tipo === 'ahorro') {
    const d = p.datos, retirar = p.modo === 'retirar';
    return Object.assign({}, comun, {
      titulo: retirar ? 'Sacar para gastos' : 'Reponer al ahorro', tipos: ['Mover'], soloPesos: true,
      conceptoFijo: retirar ? 'Sacas dinero de ' + d.cuenta.Nombre + ' para gastarlo' : 'Devuelves dinero a ' + d.cuenta.Nombre,
      nota: retirar ? 'Queda anotado como algo que debes reponer.' : 'Baja lo que debes a tu ahorro.',
      valor: retirar ? '' : (d.cuenta.deuda.manual || ''),

          const lista = await api('listMovimientosParaRenglon', modo.existentes);
          if (lista.length) {
            sel.insertAdjacentHTML('beforeend', lista.map(m => '<option value="' + esc(m.ID_Mov) + '">' + esc(fechaCorta(m.Fecha) + ' · ' + m.Concepto + ' · ' + dinero(m.Valor)) + '</option>').join(''));
            $('#pr-existente', raiz).hidden = false;
          }
        } catch (e) { /* sin lista, se registra el pago normalmente */ }
      }
    },
    alGuardar: async raiz => {
      const t = tipoActual(raiz);
      const v = leerFormulario(raiz, CAMPOS_REGISTRO);
      const afectaSaldos = !((t === 'Gasto' || t === 'Ingreso' || t === 'Mover') && v.Afecta === false); // histórico: cuenta en los informes, no en los saldos
      const fecha = $('#f-Fecha', raiz).value;
      const notas = ($('#f-Notas', raiz) || {}).value || '';
      const existente = ($('#f-Existente', raiz) || {}).value || '';
      if (!existente && (v.Valor === '' || v.Valor === undefined || (typeof v.Valor === 'number' && isNaN(v.Valor)) || v.Valor <= 0 && t !== 'Ajuste')) throw new Error('Escribe el valor.');
      if (!modo.conceptoFijo && t !== 'Mover' && !v.Concepto) throw new Error('Escribe el concepto: por ejemplo "Mercado" o "Nómina".');
      if (t === 'Mover' && !existente) {
        const or = v.Origen || modo.origenFijo, de = v.Destino || modo.destinoFijo;
        if (or && or === de) throw new Error('Elige dos bolsillos distintos.');
        if (or && de && divisaDeBolsillo(or) !== divisaDeBolsillo(de)) throw new Error('Esos bolsillos están en monedas distintas. Usa “Convertir divisas” en la pantalla Bolsillos.');
      }
      const medio = v.ID_Bolsillo || '';
      // Los modos (pagar un cobro, recibir un ingreso, un regalo, un renglón, el ahorro) guardan con su propia operación
      if (modo.guardar) {
        await modo.guardar(Object.assign({}, v, { Fecha: fecha, medioTarjeta: medio.indexOf('T:') === 0 ? medio.slice(2) : '', ID_Bolsillo: medio.indexOf('T:') === 0 ? '' : medio }), raiz);
        return;
      }

      let res;
      if (edit) {
        res = await api('editMovimiento', edit.ID_Mov, { Afecta_Saldos: afectaSaldos, Valor: v.Valor, Concepto: v.Concepto, Fecha: fecha, ID_Bolsillo: v.ID_Bolsillo, ID_Categoria: v.ID_Categoria, ID_Item_Ppto: v.ID_Item_Ppto || '', Notas: notas }, vistaActual());
        aplicarEscritura(res); render(); aviso('Cambios guardados');
        return;
      }
      if (t === 'Mover') {
        res = await api('addTransferencia', { origen: v.Origen, destino: v.Destino, valor: v.Valor, fecha: fecha, concepto: v.Concepto, notas: notas, itemPpto: v.ID_Item_Ppto || '', afectaSaldos: afectaSaldos, cargos: leerCargos(raiz) }, vistaActual());
        recordarBolsillo(v.Origen);
      } else if (t === 'Gasto' && medio.indexOf('T:') === 0) {
        // Gasto con tarjeta: con renglón aparta de su bolsillo; sin renglón no aparta nada (o lo que se elija en "Más opciones").
        const divOrig = ($('#f-Divisa_Original', raiz) || {}).value || '';
        const valOrig = divOrig ? leerDinero($('#f-Valor_Original', raiz).value) : '';
        if (divOrig && (valOrig === '' || isNaN(valOrig) || valOrig <= 0)) throw new Error('Escribe cuánto costó en ' + divOrig + ', o elige “No, en la de la tarjeta”.');
        const fuente = ($('#f-Fuente', raiz) || {}).value || '';
        const envio = { ID_Tarjeta: medio.slice(2), Valor: v.Valor, Concepto: v.Concepto, Fecha: fecha, ID_Categoria: v.ID_Categoria, ID_Item_Ppto: v.ID_Item_Ppto || '', Notas: notas,
          Divisa_Original: divOrig, Valor_Original: valOrig, cargos: leerCargos(raiz) };
        if (fuente) { envio.Fuente = fuente; if (fuente === 'Ppto' || fuente === 'Guardar') envio.ID_Bolsillo_Origen = ($('#f-FuenteOrigen', raiz) || {}).value || ''; }
        res = await api('addGastoTarjeta', envio, vistaActual());
        aplicarEscritura(res); App.tar.data = null; App.deudas.data = null; render();
        aviso(res.aparto ? 'Gasto con tarjeta registrado y dinero apartado' : 'Gasto con tarjeta registrado', { deshacer: () => anularGastoTarjeta(res.idCompra, res.idItem) });
        return;
      } else {
        res = await api('addMovimiento', { Afecta_Saldos: afectaSaldos, Tipo_Mov: t, Valor: v.Valor, Concepto: v.Concepto, Fecha: fecha, ID_Bolsillo: v.ID_Bolsillo, ID_Categoria: v.ID_Categoria, ID_Item_Ppto: v.ID_Item_Ppto || '', Notas: notas, cargos: t === 'Gasto' ? leerCargos(raiz) : [] }, vistaActual());
        recordarBolsillo(v.ID_Bolsillo);
      }
      aplicarEscritura(res); render();
      const id = res.items[0] && res.items[0].ID_Mov;
      aviso((t === 'Mover' ? 'Dinero movido' : (t === 'Gasto' ? 'Gasto registrado' : 'Ingreso registrado')) + (afectaSaldos ? '' : ' (tus saldos no cambiaron)'), { deshacer: () => anularYAvisar(id) });
    }
  });
}

async function anularGastoTarjeta(idCompra, idItem) {
  try {
    const res = await api('voidGastoTarjeta', idCompra, idItem || '', vistaActual());
    aplicarEscritura(res); App.tar.data = null; App.deudas.data = null; render();
    aviso('Gasto con tarjeta anulado');
  } catch (e) { aviso(e.message, true); }
}

const anularYAvisar = id => escribirYAvisar('voidMovimiento', [id, vistaActual()], { mensaje: 'Movimiento anulado', deshacer: () => restaurarYAvisar(id) });
const restaurarYAvisar = id => escribirYAvisar('restoreMovimiento', [id, vistaActual()], { mensaje: 'Movimiento restaurado' });

// ---------- Detalle de un movimiento ----------

/** Qué es un movimiento, dicho en palabras: ingreso, gasto, movimiento de dinero (traslado)… */
function tipoMovimientoTexto(it) {
  const sub = it.Subtipo ? ' · ' + it.Subtipo.replace(/_/g, ' ').toLowerCase() : '';
  if (it.Subtipo === 'Conversion') return 'Conversión de divisas';
  if (it.esTransferencia || it.Tipo_Mov === 'Transferencia') return 'Movimiento de dinero (entre bolsillos)' + (it.Subtipo ? sub : '');
  if (it.Tipo_Mov === 'Ingreso') return 'Ingreso' + sub;
  if (it.Tipo_Mov === 'Gasto') return 'Gasto' + sub;
  if (it.Tipo_Mov === 'Ajuste') return 'Ajuste de saldo';
  return it.Tipo_Mov || 'Movimiento';
}

async function abrirDetalleMov(id) {
  const it = buscarMov(id);
  if (!it) return;
  const m = montoMov(it, false);
  const filas = [];
  filas.push(['Tipo', '<strong>' + esc(tipoMovimientoTexto(it)) + '</strong>']);
  filas.push(['Valor', '<strong class="m-num ' + (m.clase === 'm-entra' ? 'm-positivo' : '') + '">' + esc(m.texto) + '</strong>']);
  filas.push(['Fecha', esc(etiquetaDia(it.Fecha) === fechaTxt(it.Fecha) ? fechaTxt(it.Fecha) : etiquetaDia(it.Fecha) + ' · ' + fechaTxt(it.Fecha))]);
  if (it.esTransferencia) {
    // En la lista general el traslado viene con Origen y Destino; en la de un bolsillo, como una pata con su contraparte.
    const entra = it.Origen === undefined && it.Valor > 0;
    const sale = it.Origen !== undefined ? it.Origen : (entra ? (it.Contraparte || '') : it.Bolsillo);
    const llega = it.Destino !== undefined ? it.Destino : (entra ? it.Bolsillo : (it.Contraparte || ''));
    filas.push(['Sale de', esc(sale)]); filas.push(['Llega a', esc(llega)]);
  }
  else { filas.push(['Bolsillo', esc(it.Bolsillo + (it.Cuenta && it.Cuenta !== it.Bolsillo ? ' · ' + it.Cuenta : ''))]); }
  if (it.Categoria) filas.push(['Categoría', esc(it.Categoria)]);
  if (it.Subtipo) filas.push(['Origen', esc(it.Subtipo.replace(/_/g, ' '))]);
  if (it.Notas) filas.push(['Notas', esc(it.Notas)]);
  if (it.Afecta_Saldos === false) filas.push(['Saldos', 'No cambió tus saldos (movimiento histórico): cuenta en gráficos y presupuesto']);
  if (it.Anulado) filas.push(['Estado', 'Anulado']);

  let siguiente = null;
  const cuerpo = '<p class="m-subtitulo" style="padding:0 0 var(--m-space-3);margin:0;font-weight:600;color:var(--m-label)">' + esc(it.Concepto) + '</p>' +
    '<dl class="m-detalle">' + filas.map(f => '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>').join('') + '</dl>' +
    (it.Anulado
      ? '<button type="button" class="m-btn m-btn-primary" style="width:100%" data-hoja-acc="restaurar">Restaurar movimiento</button>'
      : (it.Editable ? '<button type="button" class="m-btn m-btn-secondary" style="width:100%;margin-bottom:var(--m-space-2)" data-hoja-acc="editar">Editar</button>' : '') +
        '<button type="button" class="m-accion-peligro" data-hoja-acc="anular">Anular' + (it.esTransferencia ? ' traslado' : '') + '</button>' +
        (!it.Editable && !it.esTransferencia ? '<p class="m-ayuda" style="margin-top:var(--m-space-3)">Este movimiento lo generó la app y no se edita a mano; si te equivocaste, anúlalo y regístralo de nuevo.</p>' : ''));

  await abrirHoja({
    titulo: 'Movimiento', izq: 'Cerrar', sinGuardar: true, cuerpo: cuerpo,
    extra: {
      editar: () => { siguiente = () => abrirRegistrar({ edit: it }); return Promise.resolve(); },
      anular: () => api('voidMovimiento', id, vistaActual()).then(res => { aplicarEscritura(res); render(); aviso('Movimiento anulado', { deshacer: () => restaurarYAvisar(id) }); }),
      restaurar: () => api('restoreMovimiento', id, vistaActual()).then(res => { aplicarEscritura(res); render(); aviso('Movimiento restaurado'); })
    }
  });
  if (siguiente) siguiente();
}

// ---------- Cuadre de una cuenta ----------

async function abrirCuadre(idCuenta) {
  const c = ((App.boot.saldos && App.boot.saldos.cuentas) || []).find(x => x.ID_Cuenta === idCuenta);
  if (!c) return;
  const opcionesAjuste = [['', 'No ajustar: solo guardar el saldo']].concat(c.bolsillos.map(b => [b.ID_Bolsillo, nombreBolsillo(b, c)]));
  const cuerpo = '<form novalidate data-form="cuadre">' +
    '<p class="m-hoja-mensaje">Moni suma <strong>' + dinero(c.Saldo, c.Divisa) + '</strong> en “' + esc(c.Nombre) + '”. Escribe lo que muestra tu banco para compararlos.</p>' +
    htmlCampo({ k: 'Valor', label: 'Saldo según tu banco', tipo: 'dinero', requerido: true }, c.Saldo_Real === null || c.Saldo_Real === undefined ? '' : c.Saldo_Real) +
    '<p id="cuadre-dif" class="m-ayuda" aria-live="polite" style="margin:calc(-1 * var(--m-space-2)) 0 var(--m-space-4)"></p>' +
    '<div class="m-campo" id="cuadre-ajuste" hidden><label class="m-label" for="f-Ajuste">Registrar la diferencia como ajuste en</label>' +
    '<select class="m-input" id="f-Ajuste">' + opcionesAjuste.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('') + '</select>' +
    '<p class="m-ayuda">Un ajuste deja la suma de tus bolsillos igual a la del banco y queda en el historial.</p></div>' +
    '<button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>';

  await abrirHoja({
    titulo: 'Cuadrar cuenta', cuerpo: cuerpo,
    alAbrir: raiz => {
      const entrada = $('#f-Valor', raiz);
      entrada.dataset.divisa = c.Divisa;
      activarEcoDinero(raiz);
      const calcular = () => {
        const n = leerDinero(entrada.value);
        const dif = $('#cuadre-dif', raiz), aj = $('#cuadre-ajuste', raiz);
        if (n === '' || isNaN(n)) { dif.textContent = ''; aj.hidden = true; return; }
        const d = Math.round((n - c.Saldo) * 100) / 100;
        dif.textContent = Math.abs(d) < 0.005 ? 'Cuadra: no hay diferencia.' : 'Diferencia: ' + (d > 0 ? 'el banco muestra ' : 'Moni suma ') + dinero(Math.abs(d), c.Divisa) + ' más.';
        aj.hidden = Math.abs(d) < 0.005;
      };
      entrada.addEventListener('input', calcular); calcular(); entrada.focus();
    },
    alGuardar: async raiz => {
      const n = leerDinero($('#f-Valor', raiz).value);
      if (n === '' || isNaN(n)) throw new Error('Escribe el saldo que muestra tu banco.');
      const ajuste = $('#cuadre-ajuste', raiz).hidden ? '' : $('#f-Ajuste', raiz).value;
      const res = await api('cuadre', idCuenta, n, ajuste, vistaActual());
      aplicarEscritura(res); render();
      aviso(Math.abs(res.diferenciaAnterior) < 0.005 ? 'La cuenta cuadra' : (res.ajustado ? 'Cuenta cuadrada con un ajuste' : 'Saldo guardado'));
    }
  });
}
</script>
